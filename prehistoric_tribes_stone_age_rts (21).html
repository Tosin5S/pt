                }

                for (let i = 0; i < this.riverBoats.length; i++) {
                    const b = this.riverBoats[i];
                    b.x = wrapX(b.x + b.dir * b.speed * dt);
                    b.oarPhase += dt * 5.5;
                }
                for (let i = 0; i < this.riverFish.length; i++) {
                    const rf = this.riverFish[i];
                    rf.x = wrapX(rf.x + rf.dir * rf.speed * dt);
                    rf.phase += dt * 8;
                }
                const heroRef = this.villagers.find(u => u.isT101s);
                for (let i = 0; i < this.eagles.length; i++) {
                    const eg = this.eagles[i];
                    let boost = 1.0;
                    if (heroRef && wrappedDist(eg.x, eg.y, heroRef.x, heroRef.y) < 180) {
                        // Bird flock scatters rapidly when soaring t101s flies near!
                        eg.ang = Math.atan2(eg.y - heroRef.y, wrapDX(heroRef.x, eg.x));
                        boost = 2.6;
                    }
                    eg.ang += dt * 0.3;
                    eg.x = wrapX(eg.x + Math.cos(eg.ang) * eg.spd * boost * dt);
                    eg.y += Math.sin(eg.ang) * eg.spd * 0.5 * boost * dt;
                    eg.wing += dt * (7 * boost);
                }
                for (let i = 0; i < this.clouds.length; i++) {
                    const cl = this.clouds[i];
                    cl.x = wrapX(cl.x + cl.spd * dt);
                }

                const stepTimers = (arr, rate = 1) => {
                    for (let i = arr.length - 1; i >= 0; i--) {
                        arr[i].life -= dt * rate;
                        if (arr[i].life <= 0) arr.splice(i, 1);
                    }
                };
                stepTimers(this.particles, 1);
                stepTimers(this.floatTexts, 1);
                stepTimers(this.targetRings, 1.4);
                stepTimers(this.slashRibbons, 1);
                stepTimers(this.thrustStreaks, 1);
                stepTimers(this.groundShockwaves, 1);
                stepTimers(this.fissures, 1);
                stepTimers(this.terrainDecals, 1);
                stepTimers(this.rockSpikes, 1);
                stepTimers(this.lightningArcs, 1);
                stepTimers(this.healingBeams, 1);
                stepTimers(this.parryRings, 1);
                stepTimers(this.afterimages, 1);
                stepTimers(this.wadingRipples, 1);
                stepTimers(this.singularities, 1);
                stepTimers(this.sonicRings, 1.6);

                for (let i = this.clashSparks.length - 1; i >= 0; i--) {
                    const cs = this.clashSparks[i];
                    cs.x = wrapX(cs.x + cs.vx * dt);
                    cs.y += cs.vy * dt;
                    cs.vy += 240 * dt;
                    cs.life -= dt;
                    if (cs.life <= 0) this.clashSparks.splice(i, 1);
                }

                for (let i = this.fallingTrees.length - 1; i >= 0; i--) {
                    const ft = this.fallingTrees[i];
                    ft.angle += dt * 2.2;
                    if (ft.angle >= Math.PI * 0.5) this.fallingTrees.splice(i, 1);
                }
            }

            // =====================================================================
            // 2.5D RENDER PIPELINE & 3D ROTATING GLOBE
            // =====================================================================
            isVisibleInFrustum(wx, wy, pad = 120) {
                const dx = Math.abs(wrapDX(this.cam.x, wx));
                const dy = Math.abs(wy - this.cam.y);
                const halfW = (this.canvas.width * 0.5) / this.cam.zoom + pad;
                const halfH = (this.canvas.height * 0.5) / (this.cam.zoom * this.camTiltY) + pad;
                return dx <= halfW && dy <= halfH;
            }

            render() {
                const ctx = this.ctx;
                const W = this.canvas.width;
                const H = this.canvas.height;

                this.cam.x = wrapX(this.cam.x + wrapDX(this.cam.x, this.cam.targetX) * 0.16);
                this.cam.y = Math.max(250, Math.min(WORLD_H - 250, this.cam.y + (this.cam.targetY - this.cam.y) * 0.16));
                this.cam.zoom += (this.cam.targetZoom - this.cam.zoom) * 0.16;
                this.camTiltY += (this.targetCamTiltY - this.camTiltY) * 0.14;

                if (this.globeMode) {
                    this.render3DSphericalGlobe(ctx, W, H);
                    this.renderMinimap();
                    return;
                }

                const light = this.getLightingState();
                ctx.clearRect(0, 0, W, H);

                let shakeX = 0, shakeY = 0;
                if (this.screenShake.timer > 0) {
                    const damp = this.screenShake.timer / this.screenShake.maxTimer;
                    shakeX = (Math.random() - 0.5) * 2 * this.screenShake.intensity * damp;
                    shakeY = (Math.random() - 0.5) * 2 * this.screenShake.intensity * damp;
                }

                ctx.save();
                ctx.translate(W * 0.5 + shakeX, H * 0.5 + shakeY);
                ctx.scale(this.cam.zoom, this.cam.zoom * this.camTiltY);

                // 1. Continental Biomes, 2.5D Cliffs, Stone Ramps, Waterfalls, River & Suspension Bridges
                this.renderVisibleContinents(ctx);

                // 2. Persistent Terrain Decals & Fissures
                this.renderTerrainDecalsAndFissures(ctx);

                // 3. Settlers Cobblestone Roads
                this.renderRoadNetwork(ctx);

                // 4. True 2.5D Y-Buffer Depth-Sorted Render Queue
                const renderQueue = [];
                if (this.isVisibleInFrustum(840, 2340, 120)) {
                    renderQueue.push({ sortY: 2340, kind: 'campfire', rx: wrapDX(this.cam.x, 840), ry: 2340 - this.cam.y });
                }
                for (let i = 0; i < this.porters.length; i++) {
                    const p = this.porters[i];
                    const px = p.x1 + (p.x2 - p.x1) * p.t;
                    const py = p.y1 + (p.y2 - p.y1) * p.t;
                    if (!this.isVisibleInFrustum(px, py, 70)) continue;
                    renderQueue.push({ sortY: py, kind: 'porter', ref: p, rx: wrapDX(this.cam.x, px), ry: py - this.cam.y });
                }
                for (let i = 0; i < this.nodes.length; i++) {
                    const n = this.nodes[i];
                    if (!this.isVisibleInFrustum(n.x, n.y, 80)) continue;
                    renderQueue.push({ sortY: n.y, kind: 'node', ref: n, rx: wrapDX(this.cam.x, n.x), ry: n.y - this.cam.y });
                }
                for (let i = 0; i < this.fallingTrees.length; i++) {
                    const ft = this.fallingTrees[i];
                    if (!this.isVisibleInFrustum(ft.x, ft.y, 90)) continue;
                    renderQueue.push({ sortY: ft.y, kind: 'fallingTree', ref: ft, rx: wrapDX(this.cam.x, ft.x), ry: ft.y - this.cam.y });
                }
                for (let i = 0; i < this.buildings.length; i++) {
                    const b = this.buildings[i];
                    if (!this.isVisibleInFrustum(b.x, b.y, 120)) continue;
                    renderQueue.push({ sortY: b.y + b.radius * 0.35, kind: 'building', ref: b, rx: wrapDX(this.cam.x, b.x), ry: b.y - this.cam.y });
                }
                for (let i = 0; i < this.strongholds.length; i++) {
                    const s = this.strongholds[i];
                    if (!this.isVisibleInFrustum(s.x, s.y, 140)) continue;
                    renderQueue.push({ sortY: s.y + s.radius * 0.4, kind: 'stronghold', ref: s, rx: wrapDX(this.cam.x, s.x), ry: s.y - this.cam.y });
                }
                for (let i = 0; i < this.wildlife.length; i++) {
                    const w = this.wildlife[i];
                    if (!this.isVisibleInFrustum(w.x, w.y, 80)) continue;
                    renderQueue.push({ sortY: w.y, kind: 'wildlife', ref: w, rx: wrapDX(this.cam.x, w.x), ry: w.y - this.cam.y });
                }
                for (let i = 0; i < this.enemies.length; i++) {
                    const e = this.enemies[i];
                    if (!this.isVisibleInFrustum(e.x, e.y, 90)) continue;
                    renderQueue.push({ sortY: e.y + 4, kind: 'enemy', ref: e, rx: wrapDX(this.cam.x, e.x), ry: e.y - this.cam.y });
                }
                for (let i = 0; i < this.villagers.length; i++) {
                    const u = this.villagers[i];
                    if (!this.isVisibleInFrustum(u.x, u.y, 100)) continue;
                    renderQueue.push({ sortY: u.y + 5, kind: 'villager', ref: u, rx: wrapDX(this.cam.x, u.x), ry: u.y - this.cam.y });
                }
                for (let i = 0; i < this.siegeEngines.length; i++) {
                    const se = this.siegeEngines[i];
                    if (!this.isVisibleInFrustum(se.x, se.y, 110)) continue;
                    renderQueue.push({ sortY: se.y + 8, kind: 'siege', ref: se, rx: wrapDX(this.cam.x, se.x), ry: se.y - this.cam.y });
                }
                for (let i = 0; i < this.rockSpikes.length; i++) {
                    const rs = this.rockSpikes[i];
                    if (!this.isVisibleInFrustum(rs.x, rs.y, 60)) continue;
                    renderQueue.push({ sortY: rs.y + 2, kind: 'rockSpike', ref: rs, rx: wrapDX(this.cam.x, rs.x), ry: rs.y - this.cam.y });
                }

                renderQueue.sort((a, b) => a.sortY - b.sortY);

                const invTilt = 1 / Math.max(0.62, this.camTiltY);

                for (let i = 0; i < renderQueue.length; i++) {
                    const item = renderQueue[i];
                    ctx.save();
                    ctx.translate(item.rx, item.ry);
                    ctx.scale(1, invTilt);
                    if (item.kind === 'campfire') this.drawTribalHearthCampfire(ctx);
                    else if (item.kind === 'porter') this.drawSinglePorter(ctx, item.ref, light);
                    else if (item.kind === 'node') this.drawResourceNode(ctx, item.ref, light);
                    else if (item.kind === 'fallingTree') this.drawTimberFallingTree(ctx, item.ref);
                    else if (item.kind === 'building') this.drawBuilding(ctx, item.ref, light);
                    else if (item.kind === 'stronghold') this.drawRivalStronghold(ctx, item.ref, light);
                    else if (item.kind === 'wildlife') this.drawArticulatedBeast(ctx, item.ref, 0, 0, light);
                    else if (item.kind === 'enemy') this.drawArticulatedHuman(ctx, item.ref, 0, 0, true, light);
                    else if (item.kind === 'villager') this.drawArticulatedHuman(ctx, item.ref, 0, 0, false, light);
                    else if (item.kind === 'siege') this.drawArticulatedSiegeEngine(ctx, item.ref, light);
                    else if (item.kind === 'rockSpike') this.drawExtrudedRockSpike(ctx, item.ref);
                    ctx.restore();
                }

                // 5. Age of Empires X-Ray Occlusion Silhouette Pass
                this.renderXRayOcclusionPass(ctx, invTilt);

                // 6. Combat Projectiles, Bloodbending Puppet Strings, Lightning & Atmosphere
                this.renderCombatAndBendingVFX(ctx, invTilt);

                // 6.5. Dynamic Point-Light Illumination Shader, Cloud Shadows & Soaring Eagles
                this.renderDynamicPointLightsAndEcosystem(ctx, invTilt, light);

                // 7. Build Mode Preview Footprint
                if (this.buildMode) {
                    const spec = BUILDING_SPECS[this.buildMode];
                    const bx = wrapDX(this.cam.x, this.buildPos.x);
                    const by = this.buildPos.y - this.cam.y;
                    ctx.save();
                    ctx.translate(bx, by);
                    ctx.fillStyle = 'rgba(74, 222, 128, 0.28)';
                    ctx.strokeStyle = '#4ade80';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, spec.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.restore();

                // 8. Screen-Space Celestial Tint, Volumetric God-Rays & Weather Shaders
                if (light.tint) {
                    ctx.fillStyle = light.tint;
                    ctx.fillRect(0, 0, W, H);
                }
                this.renderVolumetricGodRays(ctx, W, H, light);
                if (this.weatherEnabled) {
                    this.renderContinentalWeatherShader(ctx, W, H);
                }
                if (this.hd2dEnabled) {
                    this.renderHD2DPostProcess(ctx, W, H, light);
                }

                // 9. Lasso Selection Box
                if (this.lassoRect) {
                    const r = this.lassoRect;
                    ctx.fillStyle = 'rgba(253, 224, 71, 0.15)';
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2;
                    ctx.fillRect(Math.min(r.x1, r.x2), Math.min(r.y1, r.y2), Math.abs(r.x2 - r.x1), Math.abs(r.y2 - r.y1));
                    ctx.strokeRect(Math.min(r.x1, r.x2), Math.min(r.y1, r.y2), Math.abs(r.x2 - r.x1), Math.abs(r.y2 - r.y1));
                }

                this.renderMinimap();
            }

            renderVisibleContinents(ctx) {
                const light = this.getLightingState();
                for (let c = 0; c < CONTINENTS.length; c++) {
                    const cont = CONTINENTS[c];
                    const center = (cont.xStart + cont.xEnd) * 0.5;
                    const dx = wrapDX(this.cam.x, center);
                    if (Math.abs(dx) > 2200) continue;

                    const leftX = dx - 800;
                    ctx.save();
                    ctx.translate(leftX, -this.cam.y);

                    // Continental Ground Fill
                    ctx.fillStyle = cont.color;
                    ctx.fillRect(0, 0, 1602, WORLD_H);

                    // Checkerboard Biome Texture Patches with Soft Depth Shading
                    ctx.fillStyle = cont.groundAlt;
                    for (let gx = 80; gx < 1520; gx += 240) {
                        for (let gy = 1400; gy < 3200; gy += 240) {
                            ctx.beginPath();
                            ctx.ellipse(gx, gy, 88, 54, 0, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // Winding Turquoise River with Depth Gradient, Shoreline Foam & Specular Sun-Glints
                    const rivGrad = ctx.createLinearGradient(0, 2575, 0, 2725);
                    rivGrad.addColorStop(0, '#0369a1');
                    rivGrad.addColorStop(0.5, '#0284c7');
                    rivGrad.addColorStop(1, '#075985');
                    ctx.fillStyle = rivGrad;
                    ctx.beginPath();
                    ctx.moveTo(0, 2600);
                    for (let rx = 0; rx <= 1600; rx += 80) {
                        ctx.lineTo(rx, 2600 + Math.sin((rx / 1600) * Math.PI * 2) * 32);
                    }
                    for (let rx = 1600; rx >= 0; rx -= 80) {
                        ctx.lineTo(rx, 2700 + Math.sin((rx / 1600) * Math.PI * 2) * 32);
                    }
                    ctx.closePath();
                    ctx.fill();

                    // Shoreline Animated Foam Ripples & Dancing Specular Water Glints
                    const foamPulse = Math.sin(this.gameTime * 3.2) * 3;
                    ctx.strokeStyle = 'rgba(186, 230, 253, 0.52)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    for (let rx = 0; rx <= 1600; rx += 80) {
                        const ry = 2604 + Math.sin((rx / 1600) * Math.PI * 2) * 32 + foamPulse;
                        if (rx === 0) ctx.moveTo(rx, ry);
                        else ctx.lineTo(rx, ry);
                    }
                    for (let rx = 0; rx <= 1600; rx += 80) {
                        const ry = 2696 + Math.sin((rx / 1600) * Math.PI * 2) * 32 - foamPulse;
                        if (rx === 0) ctx.moveTo(rx, ry);
                        else ctx.lineTo(rx, ry);
                    }
                    ctx.stroke();

                    if (this.hd2dEnabled) {
                        ctx.fillStyle = light.isBloodMoon ? 'rgba(251, 113, 133, 0.55)' : (light.isNight ? 'rgba(125, 211, 252, 0.45)' : 'rgba(254, 240, 138, 0.65)');
                        for (let sx = 60; sx < 1560; sx += 95) {
                            const shimmerX = sx + Math.sin(this.gameTime * 2.4 + sx) * 14;
                            const shimmerY = 2648 + Math.sin((sx / 1600) * Math.PI * 2) * 32 + Math.cos(this.gameTime * 3.1 + sx) * 12;
                            const glintW = 6 + Math.sin(this.gameTime * 5 + sx) * 4;
                            if (glintW > 2) {
                                ctx.fillRect(shimmerX, shimmerY, glintW, 2.2);
                            }
                        }
                    }

                    // Elevated Northern Highland Cliff Ridge, 3 Carved Stone Ramps, Waterfall & 2 Rope Suspension Bridges
                    this.drawContinentalCliffsAndWaterfalls(ctx);

                    ctx.restore();
                }

                // Underwater Swimming Prehistoric River Fish & Wading Ripples
                for (let f = 0; f < this.riverFish.length; f++) {
                    const rf = this.riverFish[f];
                    const ry = this.getRiverCenterY(rf.x) + rf.offsetY;
                    if (!this.isVisibleInFrustum(rf.x, ry, 40)) continue;
                    const rx = wrapDX(this.cam.x, rf.x);
                    const wiggle = Math.sin(rf.phase) * 2.2;
                    ctx.save();
                    ctx.translate(rx, ry - this.cam.y);
                    ctx.scale(rf.dir, 1);
                    ctx.fillStyle = 'rgba(12, 74, 110, 0.55)';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 5.5, 2.2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(-5, 0);
                    ctx.lineTo(-8.5, -2.5 + wiggle);
                    ctx.lineTo(-8.5, 2.5 + wiggle);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                for (let w = 0; w < this.wadingRipples.length; w++) {
                    const wr = this.wadingRipples[w];
                    if (!this.isVisibleInFrustum(wr.x, wr.y, 40)) continue;
                    const rx = wrapDX(this.cam.x, wr.x);
                    const ry = wr.y - this.cam.y;
                    const curR = wr.r + (wr.maxR - wr.r) * (1 - wr.life / 0.55);
                    ctx.save();
                    ctx.strokeStyle = `rgba(186, 230, 253, ${wr.life})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, curR, curR * 0.5, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            drawContinentalCliffsAndWaterfalls(ctx) {
                // Elevated Northern Highland Cliff Ledge (y = 1820)
                ctx.fillStyle = '#44403c';
                ctx.fillRect(0, 1790, 1600, 38);
                ctx.fillStyle = '#78716c';
                ctx.fillRect(0, 1785, 1600, 10);

                // 3 Carved Stone Staircase Ramps
                const ramps = [340, 820, 1280];
                for (let i = 0; i < ramps.length; i++) {
                    const rx = ramps[i];
                    ctx.fillStyle = '#a8a29e';
                    ctx.fillRect(rx - 32, 1790, 64, 95);
                    ctx.strokeStyle = '#44403c';
                    ctx.lineWidth = 2;
                    for (let s = 0; s < 6; s++) {
                        ctx.beginPath();
                        ctx.moveTo(rx - 30, 1798 + s * 15);
                        ctx.lineTo(rx + 30, 1798 + s * 15);
                        ctx.stroke();
                    }
                }

                // Cascading Waterfall at x = 620
                const wfX = 620;
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(wfX - 24, 1788, 48, 85);
                ctx.fillStyle = 'rgba(224, 242, 254, 0.75)';
                const foamOff = (this.gameTime * 60) % 20;
                for (let fy = 1792 + foamOff; fy < 1870; fy += 20) {
                    ctx.fillRect(wfX - 20, fy, 40, 6);
                }

                // 2 Swaying Rope-and-Plank Suspension Bridges across the River
                const bridges = [480, 1140];
                for (let b = 0; b < bridges.length; b++) {
                    const bx = bridges[b];
                    const rY = 2650 + Math.sin((bx / 1600) * Math.PI * 2) * 32;
                    ctx.fillStyle = '#78350f';
                    ctx.strokeStyle = '#fde68a';
                    ctx.lineWidth = 2.5;
                    ctx.fillRect(bx - 28, rY - 58, 56, 116);
                    ctx.strokeRect(bx - 28, rY - 58, 56, 116);
                }
            }

            renderTerrainDecalsAndFissures(ctx) {
                for (let i = 0; i < this.terrainDecals.length; i++) {
                    const d = this.terrainDecals[i];
                    if (!this.isVisibleInFrustum(d.x, d.y, 50)) continue;
                    const rx = wrapDX(this.cam.x, d.x);
                    const ry = d.y - this.cam.y;
                    ctx.save();
                    ctx.globalAlpha = Math.min(0.65, d.life / d.maxLife);
                    ctx.fillStyle = d.kind === 'frost' ? '#7dd3fc' : '#1c1917';
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, d.radius, d.radius * 0.55, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                for (let i = 0; i < this.fissures.length; i++) {
                    const f = this.fissures[i];
                    if (!this.isVisibleInFrustum(f.x, f.y, 60)) continue;
                    const rx = wrapDX(this.cam.x, f.x);
                    const ry = f.y - this.cam.y;
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.rotate(f.angle || 0);
                    ctx.strokeStyle = '#f97316';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-24, 0);
                    ctx.lineTo(0, -6);
                    ctx.lineTo(24, 3);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            renderRoadNetwork(ctx) {
                ctx.save();
                for (let i = 0; i < this.roads.length; i++) {
                    const r = this.roads[i];
                    const x1 = wrapDX(this.cam.x, r.x1);
                    const y1 = r.y1 - this.cam.y;
                    const x2 = x1 + wrapDX(r.x1, r.x2);
                    const y2 = r.y2 - this.cam.y;
                    ctx.strokeStyle = this.ageLevel >= 2 ? '#a8a29e' : '#78350f';
                    ctx.lineWidth = 14;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    ctx.strokeStyle = '#d6d3d1';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 8]);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                ctx.restore();
            }

            drawTribalHearthCampfire(ctx) {
                ctx.save();
                const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, 68);
                grad.addColorStop(0, 'rgba(251, 146, 60, 0.45)');
                grad.addColorStop(1, 'rgba(251, 146, 60, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, 68, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#78350f';
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2;
                    ctx.save();
                    ctx.translate(Math.cos(a) * 32, Math.sin(a) * 20);
                    ctx.rotate(a + Math.PI * 0.5);
                    ctx.fillRect(-10, -3, 20, 6);
                    ctx.restore();
                }

                const flicker = Math.sin(this.gameTime * 14) * 3;
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(-12, 4);
                ctx.quadraticCurveTo(0, -26 - flicker, 12, 4);
                ctx.fill();
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.moveTo(-6, 4);
                ctx.quadraticCurveTo(0, -16 + flicker, 6, 4);
                ctx.fill();
                ctx.restore();
            }

            drawSinglePorter(ctx, p) {
                ctx.save();
                ctx.scale(p.dir, 1);
                ctx.fillStyle = '#78350f';
                ctx.strokeStyle = '#fde68a';
                ctx.lineWidth = 1.5;
                ctx.fillRect(-12, -10, 20, 9);
                ctx.strokeRect(-12, -10, 20, 9);

                ctx.save();
                ctx.translate(-4, 0);
                ctx.rotate(p.wheelPhase || 0);
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                ctx.fillStyle = '#e6b88a';
                ctx.beginPath();
                ctx.arc(12, -14, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawResourceNode(ctx, n, light) {
                ctx.save();
                const shake = (n.hitShakeTimer || 0) > 0 ? Math.sin(this.gameTime * 50) * 3 : 0;
                n.hitShakeTimer = Math.max(0, (n.hitShakeTimer || 0) - 0.016);
                ctx.translate(shake, 0);

                // Cutaway transparency if friendly unit is walking behind tree
                if (n.type === 'wood') {
                    for (let i = 0; i < this.villagers.length; i++) {
                        const u = this.villagers[i];
                        if (u.y < n.y && u.y > n.y - 54 && Math.abs(wrapDX(n.x, u.x)) < 28) {
                            ctx.globalAlpha = 0.52;
                            u._isOccluded = true;
                            break;
                        }
                    }
                }

                // Deep Ambient Occlusion Contact Shadow + Directional Cast Shadow
                const shDX = light ? light.shadowDX * 0.7 : 6;
                const shDY = light ? light.shadowDY * 0.7 : 4;
                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.34})`;
                ctx.beginPath();
                ctx.ellipse(shDX, shDY, 19, 8.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.48)';
                ctx.beginPath();
                ctx.ellipse(0, 2, 10, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();

                const rimColor = light && light.isBloodMoon ? '#fda4af' : (light && light.isNight ? '#7dd3fc' : '#fef08a');

                if (n.type === 'wood') {
                    ctx.fillStyle = '#451a03';
                    ctx.fillRect(-5, -25, 10, 27);
                    ctx.fillStyle = '#78350f';
                    ctx.fillRect(-3, -25, 4, 26);

                    const sway = Math.sin(this.gameTime * 2.2 + n.x) * 2.5;
                    // Multi-tiered HD-2D Canopy with Normal-Style Rim Highlight
                    ctx.fillStyle = '#14532d';
                    ctx.beginPath();
                    ctx.arc(sway + 2, -31, 21, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#15803d';
                    ctx.beginPath();
                    ctx.arc(sway, -35, 19, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.arc(sway - 5, -39, 13, 0, Math.PI * 2);
                    ctx.fill();

                    if (this.hd2dEnabled) {
                        ctx.strokeStyle = rimColor;
                        ctx.lineWidth = 1.6;
                        ctx.beginPath();
                        ctx.arc(sway - 3, -38, 14, Math.PI * 0.95, Math.PI * 1.75);
                        ctx.stroke();
                    }
                } else if (n.type === 'stone' || n.type === 'gold') {
                    ctx.fillStyle = n.type === 'gold' ? '#ca8a04' : '#57534e';
                    ctx.strokeStyle = '#1c1917';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-19, 4);
                    ctx.lineTo(-11, -21);
                    ctx.lineTo(8, -23);
                    ctx.lineTo(19, 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Faceted Sunlit Bevel
                    ctx.fillStyle = n.type === 'gold' ? '#facc15' : '#a8a29e';
                    ctx.beginPath();
                    ctx.moveTo(-14, 2);
                    ctx.lineTo(-9, -19);
                    ctx.lineTo(2, -20);
                    ctx.lineTo(0, 2);
                    ctx.closePath();
                    ctx.fill();

                    if (this.hd2dEnabled) {
                        ctx.strokeStyle = rimColor;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(-11, -20);
                        ctx.lineTo(8, -22);
                        ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = '#166534';
                    ctx.beginPath();
                    ctx.arc(0, -10, 15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.arc(-5, -12, 3.5, 0, Math.PI * 2);
                    ctx.arc(5, -9, 3.5, 0, Math.PI * 2);
                    ctx.arc(0, -15, 3.2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            drawTimberFallingTree(ctx, ft) {
                ctx.save();
                ctx.rotate(ft.dir * ft.angle);
                ctx.fillStyle = '#5c2808';
                ctx.fillRect(-4, -26, 8, 26);
                ctx.fillStyle = '#15803d';
                ctx.beginPath();
                ctx.arc(0, -34, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawBuilding(ctx, b, light) {
                const ep = EPOCHS[this.ageLevel];
                ctx.save();

                for (let i = 0; i < this.villagers.length; i++) {
                    const u = this.villagers[i];
                    if (u.y < b.y + b.radius * 0.25 && u.y > b.y - b.radius * 1.45 && Math.abs(wrapDX(b.x, u.x)) < b.radius * 0.95) {
                        ctx.globalAlpha = 0.56;
                        u._isOccluded = true;
                        break;
                    }
                }

                const r = b.radius;
                const shDX = light ? light.shadowDX : 8;
                const shDY = light ? light.shadowDY : 8;
                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.38})`;
                ctx.beginPath();
                ctx.ellipse(shDX, shDY, r * 1.18, r * 0.62, 0, 0, Math.PI * 2);
                ctx.fill();

                // Deep Ambient Occlusion Foundation Ring
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.beginPath();
                ctx.ellipse(0, 4, r * 0.95, r * 0.42, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = ep.wallColor;
                ctx.strokeStyle = '#1c1917';
                ctx.lineWidth = 2.5;
                ctx.fillRect(-r * 0.8, -r * 0.85, r * 1.6, r * 1.0);
                ctx.strokeRect(-r * 0.8, -r * 0.85, r * 1.6, r * 1.0);

                // Warm Interior Window Torchlight Glow
                if (this.hd2dEnabled && b.built) {
                    ctx.fillStyle = light && light.isBloodMoon ? '#fb7185' : '#fde047';
                    ctx.fillRect(-r * 0.45, -r * 0.45, r * 0.24, r * 0.24);
                    ctx.fillRect(r * 0.21, -r * 0.45, r * 0.24, r * 0.24);
                }

                ctx.fillStyle = ep.roofColor;
                ctx.beginPath();
                ctx.moveTo(-r * 0.98, -r * 0.8);
                ctx.lineTo(0, -r * 1.65);
                ctx.lineTo(r * 0.98, -r * 0.8);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // HD-2D Sunlit Roof Ridge Rim-Light
                if (this.hd2dEnabled) {
                    const rimColor = light && light.isBloodMoon ? '#fda4af' : (light && light.isNight ? '#7dd3fc' : '#fef08a');
                    ctx.strokeStyle = rimColor;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.95, -r * 0.81);
                    ctx.lineTo(0, -r * 1.63);
                    ctx.stroke();
                }

                // Animated Building Machinery, Chimney Smoke, Forge Sparks & Shrine Crystals
                if (b.built) {
                    if (b.type === 'sawmill') {
                        ctx.save();
                        ctx.translate(r * 0.55, -r * 0.25);
                        ctx.rotate(this.gameTime * 8);
                        ctx.fillStyle = '#cbd5e1';
                        ctx.strokeStyle = '#475569';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(0, 0, 9, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        for (let t = 0; t < 6; t++) {
                            const ta = (t / 6) * Math.PI * 2;
                            ctx.fillRect(Math.cos(ta) * 8 - 1.5, Math.sin(ta) * 8 - 1.5, 3, 3);
                        }
                        ctx.restore();
                    } else if (b.type === 'kitchen') {
                        const smokeY = ((this.gameTime * 24 + b.x) % 26);
                        ctx.fillStyle = `rgba(226, 232, 240, ${0.55 * (1 - smokeY / 26)})`;
                        ctx.beginPath();
                        ctx.arc(r * 0.3, -r * 1.4 - smokeY, 4 + smokeY * 0.18, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (b.type === 'forge') {
                        const pulse = 0.6 + Math.sin(this.gameTime * 10) * 0.4;
                        ctx.fillStyle = `rgba(249, 115, 22, ${pulse})`;
                        ctx.beginPath();
                        ctx.arc(-r * 0.45, -r * 0.2, 6, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (b.type === 'shrine') {
                        for (let c = 0; c < 3; c++) {
                            const ca = this.gameTime * 2.5 + (c * Math.PI * 2) / 3;
                            const cx = Math.cos(ca) * 18;
                            const cy = -r * 1.45 + Math.sin(ca * 2) * 4;
                            ctx.fillStyle = c === 0 ? '#38bdf8' : (c === 1 ? '#fde047' : '#f43f5e');
                            ctx.beginPath();
                            ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else if (b.type === 'tower') {
                        ctx.fillStyle = '#f97316';
                        ctx.beginPath();
                        ctx.arc(0, -r * 1.72, 5 + Math.sin(this.gameTime * 14) * 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                const spec = BUILDING_SPECS[b.type] || BUILDING_SPECS.hut;
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(spec.icon, 0, -r * 0.25);

                if (!b.built) {
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-r * 0.85, -r * 1.4, r * 1.7, r * 1.5);
                }
                ctx.restore();
            }

            drawRivalStronghold(ctx, s, light) {
                const r = s.radius;
                const ai = this.aiPlayers.find(a => a.continentIdx === s.continentIdx);
                const ep = EPOCHS[ai ? ai.ageLevel : 0];

                // Draw AI Player's Surrounding Satellite Settlement Buildings & Cobblestone Roads
                if (ai && ai.aiStructures) {
                    for (let i = 0; i < ai.aiStructures.length; i++) {
                        const sb = ai.aiStructures[i];
                        const dx = wrapDX(s.x, sb.x);
                        const dy = sb.y - s.y;
                        ctx.save();
                        ctx.strokeStyle = '#78350f';
                        ctx.lineWidth = 8;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(dx, dy);
                        ctx.stroke();

                        ctx.translate(dx, dy);
                        ctx.fillStyle = ep.wallColor;
                        ctx.strokeStyle = '#1c1917';
                        ctx.lineWidth = 2;
                        ctx.fillRect(-20, -22, 40, 24);
                        ctx.strokeRect(-20, -22, 40, 24);

                        ctx.fillStyle = ai.bannerColor || ep.roofColor;
                        ctx.beginPath();
                        ctx.moveTo(-24, -20);
                        ctx.lineTo(0, -40);
                        ctx.lineTo(24, -20);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                ctx.save();
                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.45})`;
                ctx.beginPath();
                ctx.ellipse(10, 10, r * 1.2, r * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = ai && ai.stance === 'allied' ? '#064e3b' : (ai && ai.stance === 'neutral' ? '#1e3a8a' : '#450a0a');
                ctx.strokeStyle = ai ? ai.color : '#f43f5e';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, -12, r * 0.85, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                const pct = Math.max(0, s.hp / s.maxHp);
                ctx.fillStyle = '#1c1917';
                ctx.fillRect(-38, -r - 22, 76, 7);
                ctx.fillStyle = ai ? ai.color : '#f43f5e';
                ctx.fillRect(-37, -r - 21, 74 * pct, 5);

                ctx.font = 'bold 11px Inter, sans-serif';
                ctx.fillStyle = '#fef08a';
                ctx.textAlign = 'center';
                ctx.fillText(`${s.avatar || '👑'} ${s.name} (${ep.name.split(':')[0]})`, 0, -r - 28);
                ctx.restore();
            }

            drawExtrudedRockSpike(ctx, rs) {
                ctx.save();
                ctx.rotate(rs.tilt || 0);
                ctx.fillStyle = '#78716c';
                ctx.strokeStyle = '#292524';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(-rs.w, 0);
                ctx.lineTo(0, -rs.h);
                ctx.lineTo(rs.w, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            drawArticulatedBeast(ctx, w, x, y, light) {
                ctx.save();
                const elevY = -(w.terrainZ || 0);
                ctx.translate(x, y + elevY);
                const isMammoth = w.kind === 'mammoth';
                const isSabre = w.kind === 'sabre';
                const r = isMammoth ? 22 : 14;

                const moveAng = w.moveAngle !== undefined ? w.moveAngle : 0;
                const horizPerspective = 0.68 + Math.abs(Math.cos(moveAng)) * 0.32;

                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.34})`;
                ctx.beginPath();
                ctx.ellipse(5, 8, r * 1.2 * horizPerspective, r * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.scale((w.facing || 1) * horizPerspective, 1);
                const wp = w.walkPhase || 0;

                ctx.strokeStyle = isMammoth ? '#451a03' : '#b45309';
                ctx.lineWidth = isMammoth ? 4.5 : 3;
                for (let l = -1; l <= 1; l += 2) {
                    const swing = Math.sin(wp + l) * 5;
                    ctx.beginPath();
                    ctx.moveTo(l * 8, -4);
                    ctx.lineTo(l * 8 + swing, 8);
                    ctx.stroke();
                }

                ctx.fillStyle = isMammoth ? '#5c2808' : (isSabre ? '#d97706' : '#a16207');
                ctx.beginPath();
                ctx.ellipse(0, -10, r, r * 0.72, 0, 0, Math.PI * 2);
                ctx.fill();

                if (isMammoth) {
                    ctx.strokeStyle = '#fef3c7';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(r - 4, -8);
                    ctx.quadraticCurveTo(r + 12, -2, r + 14, -14);
                    ctx.stroke();
                }
                ctx.restore();
            }

            drawArticulatedHuman(ctx, u, x, y, isEnemy, light) {
                ctx.save();
                ctx.translate(x, y);

                const isSelected = !isEnemy && this.selectedIds.includes(u.id);
                const elevZ = u.terrainZ || 0;
                if (isSelected) {
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.ellipse(0, 4 - elevZ, 20, 10, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }

                const mAng = u.moveAngle !== undefined ? u.moveAngle : 0;
                const sinA = Math.sin(mAng);
                const isBackView = sinA < -0.58 && (u.swingAnim || 0) <= 0.1;
                const isFrontView = sinA > 0.58 && (u.swingAnim || 0) <= 0.1;

                let mountLiftY = 0;
                if (!isEnemy && u.mountType && (u.airborneZ || 0) <= 1) {
                    this.drawArticulatedBeast(ctx, {
                        kind: u.mountType,
                        facing: u.facing || 1,
                        moveAngle: mAng,
                        walkPhase: u.walkPhase || 0,
                        terrainZ: elevZ
                    }, 0, 4, light);
                    mountLiftY = u.mountType === 'mammoth' ? -18 : -11;
                }

                let hoverY = -(u.airborneZ || 0) - (u.combatJumpZ || 0) - elevZ + mountLiftY;
                if (u.isT101s) {
                    hoverY -= (u.skySoar ? 24 : 12) + Math.sin(this.gameTime * 5) * 4;
                } else if ((u.bloodLevitatedTimer || 0) > 0) {
                    hoverY -= 16 + Math.sin(this.gameTime * 6 + u.x) * 3.5;
                }

                // Crouch offset during Low Leg Sweep, Tactical Roll or Shield-Wall Brace
                if ((u.martialAnim || 0) > 0.1 && u.martialForm === 'leg_sweep') {
                    hoverY += 5 * Math.sin(u.martialAnim * Math.PI);
                } else if ((u.blockAnim || 0) > 0.1 && u.blockType === 'shield_wall') {
                    hoverY += 3.5 * Math.sin(u.blockAnim * Math.PI);
                }

                // Synchronized Miniature Legion Squadron Retinue for Commanders!
                if (!isEnemy && u.isCommander) {
                    const offsets = [
                        { dx: -22, dy: -10 },
                        { dx: 22,  dy: -10 },
                        { dx: -16, dy: 12 },
                        { dx: 16,  dy: 12 }
                    ];
                    const walk = u.walkPhase || 0;
                    for (let m = 0; m < offsets.length; m++) {
                        const off = offsets[m];
                        const bob = Math.sin(walk + m) * 2;
                        ctx.save();
                        ctx.translate(off.dx, off.dy - elevZ + bob);
                        ctx.scale(u.facing || 1, 1);
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath();
                        ctx.ellipse(0, 2, 5, 2.2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = u.fightingStyle === 'phalanx' ? '#0284c7' : '#b45309';
                        ctx.fillRect(-3.2, -10, 6.4, 7.5);
                        ctx.fillStyle = '#e6b88a';
                        ctx.beginPath();
                        ctx.arc(0, -13, 3.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#fde047';
                        ctx.lineWidth = 1.4;
                        ctx.beginPath();
                        ctx.moveTo(2, -7);
                        ctx.lineTo(8, -13 - Math.sin((u.swingAnim || 0) * Math.PI) * 4);
                        ctx.stroke();
                        ctx.restore();
                    }
                }

                // Ground Shadow
                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.35})`;
                ctx.beginPath();
                ctx.ellipse(3, 3 - elevZ, 11, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                this.drawElementalStanceAura(ctx, u);

                ctx.save();
                ctx.translate(0, hoverY);
                ctx.scale(u.facing || 1, 1);

                // Full-Body Rotations for Backflip Dodge, Tactical Roll, Supersonic Flight Pitch & Aerial Barrel-Rolls
                if (u.ragdollSpin) {
                    ctx.rotate(this.gameTime * u.ragdollSpin);
                } else if ((u.dodgeAnim || 0) > 0.05 && (u.dodgeType === 'backflip' || u.dodgeType === 'roll')) {
                    const rotDir = u.dodgeType === 'backflip' ? -1 : 1;
                    ctx.translate(0, -14);
                    ctx.rotate(rotDir * (1 - u.dodgeAnim) * Math.PI * 2);
                    ctx.translate(0, 14);
                } else if ((u.flightRollAnim || 0) > 0.05) {
                    ctx.translate(0, -16);
                    ctx.rotate((1 - u.flightRollAnim) * Math.PI * 2);
                    ctx.translate(0, 16);
                } else if ((u.diveAnim || 0) > 0.05) {
                    ctx.translate(0, -16);
                    ctx.rotate(Math.sin(u.diveAnim * Math.PI) * 0.72);
                    ctx.translate(0, 16);
                } else if ((u.flightSpeedPitch || 0) > 0.04) {
                    ctx.translate(0, -16);
                    ctx.rotate(u.flightSpeedPitch);
                    ctx.translate(0, 16);
                }

                const walk = u.walkPhase || 0;
                const breath = Math.sin(this.gameTime * 4 + (u.x || 0)) * 0.8;
                const swingPhase = Math.sin((u.swingAnim || 0) * Math.PI);
                const cStep = u.comboStep || 0;

                // Supersonic Crimson-Gold Flight Energy Wings & Jet Contrails for Hero t101s & Sky-Soaring Units
                if (u.isT101s && u.skySoar) {
                    const wingSpread = 12 + Math.sin(this.gameTime * 10) * 3 + (u.flightSpeedPitch || 0) * 14;
                    ctx.save();
                    ctx.strokeStyle = 'rgba(253, 224, 71, 0.85)';
                    ctx.fillStyle = 'rgba(244, 63, 94, 0.36)';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(-2, -19);
                    ctx.quadraticCurveTo(-14 - wingSpread * 0.6, -32, -20 - wingSpread, -20);
                    ctx.quadraticCurveTo(-12, -13, -3, -14);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                // Flowing Mantle Cape for t101s, Avatars & Commanders
                // 3-Joint Skeletal IK Legs (Hip -> Knee -> Ankle -> Foot with Kung-Fu High Kick, Crane Stance, Split Kick & Flight Streamlining)
                for (let legIdx = -1; legIdx <= 1; legIdx += 2) {
                    const isFloating = u.isT101s || (u.bloodLevitatedTimer || 0) > 0 || (u.combatJumpZ || 0) > 4;
                    const stride = isFloating
                        ? legIdx * 3.0 - (u.flightSpeedPitch || 0) * 6
                        : Math.sin(walk + (legIdx === 1 ? 0 : Math.PI)) * 6.8 + (legIdx === 1 ? swingPhase * 4.5 : -swingPhase * 2.5);
                    const lift = isFloating
                        ? (legIdx === 1 ? 4.5 : 2.5)
                        : Math.max(0, Math.cos(walk + (legIdx === 1 ? 0 : Math.PI)) * 3.8);
                    const hipX = legIdx * 2.4;
                    const hipY = -9;
                    let footX = hipX + stride;
                    let footY = -lift;

                    // Tuck knees tightly during Backflip or Tactical Roll
                    if ((u.dodgeAnim || 0) > 0.1 && (u.dodgeType === 'backflip' || u.dodgeType === 'roll')) {
                        footX = hipX - 2;
                        footY = -6.5;
                    } else if ((u.martialAnim || 0) > 0.1 && u.martialForm === 'hurricane_kick') {
                        // 360° Helicopter Split-Kick: both legs extend horizontally in opposite directions!
                        const hP = Math.sin(u.martialAnim * Math.PI);
                        footX = legIdx * (4 + hP * 12);
                        footY = -8 - hP * 5;
                    } else if ((u.martialAnim || 0) > 0.1 && u.martialForm === 'crane_kick') {
                        // One-Legged Crane Balance on back leg + Snap Vertical Kick on front leg!
                        const cP = Math.sin(u.martialAnim * Math.PI);
                        if (legIdx === -1) {
                            footX = -2;
                            footY = 0;
                        } else {
                            footX = 5 + cP * 11;
                            footY = -10 - cP * 14;
                        }
                    } else if ((u.martialAnim || 0) > 0.1 && u.martialForm === 'leg_sweep') {
                        const sP = Math.sin(u.martialAnim * Math.PI);
                        if (legIdx === 1) {
                            footX = 8 + sP * 11;
                            footY = 1;
                        }
                    } else if (legIdx === 1 && (u.kickAnim || 0) > 0.08) {
                        const kP = Math.sin(u.kickAnim * Math.PI);
                        footX = 6 + kP * 12;
                        footY = -8 - kP * 14;
                    }

                    const legIK = solve2BoneIK(hipX, hipY, footX, footY, 5.4, 5.4, 1);
                    ctx.strokeStyle = '#d6a276';
                    ctx.lineWidth = 3.0;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(hipX, hipY);
                    ctx.lineTo(legIK.jx, legIK.jy);
                    ctx.lineTo(legIK.ex, legIK.ey);
                    ctx.stroke();

                    // Glowing Chi Foot Arc during Kung-Fu / Airbender High Kick or Split-Kick
                    if ((legIdx === 1 && (u.kickAnim || 0) > 0.15) || ((u.martialAnim || 0) > 0.15 && u.martialForm === 'hurricane_kick')) {
                        ctx.fillStyle = u.bender === 'fire' ? '#f97316' : '#34d399';
                        ctx.beginPath();
                        ctx.arc(legIK.ex, legIK.ey, 3.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Dynamic Spine Lean & Torso Pivot for Combat Choreography
                ctx.save();
                ctx.translate(0, -9);
                ctx.rotate((u.spineLean || 0) * swingPhase);
                ctx.translate(0, 9);

                // =========================================================================
                // 3-JOINT SKELETAL IK BACK / OFF-HAND ARM (Dual Blades, Shield Bash, Bow Riser & Kung-Fu Guard)
                // =========================================================================
                const backShX = -3.2, backShY = -18.5 - breath * 0.5;
                let backTargetX = backShX - 4;
                let backTargetY = backShY + 4;

                if (u.fightingStyle === 'archery') {
                    backTargetX = 11.5;
                    backTargetY = -19.0 + (u.aimPitch || 0) * 6;
                } else if ((u.blockAnim || 0) > 0.1) {
                    // Active Defensive Guard Arm Posture
                    backTargetX = 8.5;
                    backTargetY = -21.5;
                } else if ((u.martialAnim || 0) > 0.1 && u.martialForm === 'crane_kick') {
                    // Crane Wing Spread Arm
                    backTargetX = -11.5;
                    backTargetY = -26.5 - Math.sin(u.martialAnim * Math.PI) * 4;
                } else if (u.fightingStyle === 'berserker') {
                    const offAng = -0.5 + Math.cos((u.swingAnim || 0) * Math.PI * 2) * 1.1;
                    backTargetX = backShX + Math.cos(offAng) * 11;
                    backTargetY = backShY + Math.sin(offAng) * 11;
                } else if (u.fightingStyle === 'phalanx') {
                    const bashPush = (cStep === 1 ? swingPhase * 8 : swingPhase * 2);
                    backTargetX = 5.5 + bashPush;
                    backTargetY = -16.5;
                } else if (u.fightingStyle === 'kungfu' || u.bender) {
                    backTargetX = 7.5 + swingPhase * 5;
                    backTargetY = -20.5 - swingPhase * 3;
                } else if (u.isT101s) {
                    backTargetX = -8.5 - (u.flightSpeedPitch || 0) * 6;
                    backTargetY = -23.5 - Math.sin(this.gameTime * 6) * 2.5;
                }

                const backArmIK = solve2BoneIK(backShX, backShY, backTargetX, backTargetY, 5.8, 5.8, -1);
                ctx.strokeStyle = '#c49060';
                ctx.lineWidth = 2.8;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(backShX, backShY);
                ctx.lineTo(backArmIK.jx, backArmIK.jy);
                ctx.lineTo(backArmIK.ex, backArmIK.ey);
                ctx.stroke();

                // Off-Hand Weapon / Shield Rendering
                if (u.fightingStyle === 'berserker' && !u.isT101s) {
                    ctx.save();
                    ctx.translate(backArmIK.ex, backArmIK.ey);
                    ctx.rotate(backArmIK.endAngle - 0.3);
                    ctx.strokeStyle = '#fed7aa';
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(6, -5, 12, -2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Articulated Torso & Tunic / Armor
                ctx.fillStyle = isEnemy
                    ? (u.bloodControlled ? '#854d0e' : (u.empireColor || '#7f1d1d'))
                    : (u.isT101s ? '#450a0a' : (u.fightingStyle === 'phalanx' ? '#0369a1' : '#92400e'));
                ctx.strokeStyle = u.isT101s || u.isAISovereign ? '#fde047' : '#1c1917';
                ctx.lineWidth = 1.4;
                ctx.beginPath();

                const pitch = (u.aimPitch || 0) + swingAngleOffset;

                let targetWristX = shX + Math.cos(pitch) * reach;

                if (u.fightingStyle === 'archery') {

                } else if (u.fightingStyle === 'archery') {

                    // Bowstring Twang Harmonic Vibration after release
                    const twangVib = (u.bowDrawAnim || 0) > 0.05 ? Math.sin(this.gameTime * 75) * 2.4 * u.bowDrawAnim : 0;
                    const stringMidX = (u.bowDrawAnim || 0) > 0.55 ? handX : bowX - 1 + twangVib;

                    ctx.strokeStyle = '#fef08a';
                    ctx.lineWidth = 1.3;
                    ctx.beginPath();
                    ctx.moveTo(tipTopX, tipTopY);
                    ctx.lineTo(stringMidX, stringMidY);
                    ctx.lineTo(tipBotX, tipBotY);
                    ctx.stroke();

                    // Nocked Arrow visibly drawn on the bow before & during release!
                    if ((u.bowDrawAnim || 0) > 0.35 || (u.attackTimer || 0) < 0.55) {
                        const nockX = handX;
                        const nockY = handY;
                        const aimAng = Math.atan2(bowY - nockY, (bowX + 10) - nockX);
                        ctx.save();
                        ctx.translate(nockX, nockY);

                        // Feathered Fletching at Nock
                        ctx.fillStyle = '#f43f5e';
                        ctx.beginPath();
                        ctx.moveTo(-2, 0);
                        ctx.lineTo(-6, -3);
                        ctx.lineTo(-1, -1);
                        ctx.moveTo(-2, 0);

                        ctx.fillStyle = (u.comboStep || 0) === 2 ? '#f97316' : '#38bdf8';

                } else if (u.fightingStyle === 'juggernaut') {
                    // Colossal Obsidian Mammoth-Maul
                    ctx.save();
                    ctx.translate(handX, handY);
                    ctx.rotate(armIK.endAngle - 0.5);
                    ctx.strokeStyle = '#78350f';

                    ctx.beginPath();

                } else if (u.fightingStyle === 'phalanx') {
                    // Longpike Spear with Gleaming Bronze/Steel Tip
                    ctx.save();
                    ctx.translate(handX, handY);
                    ctx.rotate((u.aimPitch || 0) * 0.6);
                    ctx.strokeStyle = '#78350f';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(-8, 2);
                    ctx.lineTo(18, -3);
                    ctx.stroke();
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.moveTo(18, -6);
                    ctx.lineTo(25, -3.5);

                } else if (u.fightingStyle === 'kungfu') {
                    // Glowing Emerald Chi Fist Aura
                    ctx.fillStyle = 'rgba(16, 185, 129, 0.75)';

                    ctx.arc(handX, handY, 3.8 + swingPhase * 2, 0, Math.PI * 2);
                    ctx.fill();

                    // 100-Palm Chi Flurry Multi-Fist Afterimage Cone!
                    if ((u.martialAnim || 0) > 0.12 && u.martialForm === 'hundred_palms') {
                        for (let f = 0; f < 5; f++) {
                            const fAng = -0.55 + f * 0.28 + Math.sin(this.gameTime * 45 + f) * 0.15;
                            const fx = shX + Math.cos(fAng) * (12 + (f % 2) * 5);
                            const fy = shY + Math.sin(fAng) * (12 + (f % 2) * 5);
                            ctx.fillStyle = f % 2 === 0 ? 'rgba(52, 211, 153, 0.75)' : 'rgba(253, 224, 71, 0.75)';
                            ctx.beginPath();
                            ctx.arc(fx, fy, 3.0, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                } else {
                    // Curved Twin-Fang Berserker Sabre Blade
                    ctx.save();
                    ctx.translate(handX, handY);
                    ctx.rotate(armIK.endAngle - 0.35);
                    ctx.strokeStyle = '#f8fafc';
                    ctx.lineWidth = 2.8;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);

                    ctx.stroke();

                if ((u.blockAnim || 0) > 0.08) {

                    if (u.blockType === 'ring_barrier') {
                        ctx.strokeStyle = '#fde047';

                        ctx.lineWidth = 2.2;
                        ctx.beginPath();
                        ctx.arc(0, -17, 17, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    } else if (u.blockType === 'earth_wall') {
                        ctx.fillStyle = '#78716c';
                        ctx.strokeStyle = '#fbbf24';
                        ctx.lineWidth = 1.8;
                        ctx.fillRect(9, -25, 6, 24);
                        ctx.strokeRect(9, -25, 6, 24);
                    } else if (u.blockType === 'palm_deflect') {
                        ctx.strokeStyle = '#34d399';
                        ctx.lineWidth = 2.4;
                        ctx.beginPath();
                        ctx.arc(10, -18, 11, -Math.PI * 0.65, Math.PI * 0.65);
                        ctx.stroke();
                    } else if (u.blockType === 'shield_wall') {
                        ctx.strokeStyle = '#38bdf8';
                        ctx.fillStyle = 'rgba(56, 189, 248, 0.28)';
                        ctx.lineWidth = 2.4;
                        ctx.beginPath();
                        ctx.roundRect(8, -26, 6, 22, 2);
                        ctx.fill();
                        ctx.stroke();
                    } else {
                        // Twin-Blade X-Cross Parry
                        ctx.strokeStyle = '#fde047';
                        ctx.lineWidth = 2.5;
                        ctx.beginPath();
                        ctx.moveTo(6, -26); ctx.lineTo(15, -12);
                        ctx.moveTo(15, -26); ctx.lineTo(6, -12);
                        ctx.stroke();

                    ctx.restore();

                ctx.restore(); // End Spine Lean transform
                ctx.restore(); // End Hover & Facing transform

                // Specular Hit-Flash Silhouette Overlay on Impact
                if ((u.hitFlashTimer || 0) > 0) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
                    ctx.beginPath();
                    ctx.arc(0, -18 + hoverY, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                // Overhead Unit Badges & Health Bar
                const pct = Math.max(0, u.hp / u.maxHp);

                    ctx.fillStyle = u.bloodControlled ? '#fde047' : '#fb7185';

                    ctx.fillStyle = '#38bdf8';
                    ctx.textAlign = 'center';
                    ctx.fillText('⛰️ HIGH GROUND +25%', 0, -43 + hoverY);

                ctx.restore();

            drawElementalStanceAura(ctx, u) {
                ctx.save();
                if (u.isT101s) {
                    ctx.strokeStyle = 'rgba(244, 63, 94, 0.75)';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.ellipse(0, -14, 18, 8, this.gameTime * 2.5, 0, Math.PI * 2);

                    ctx.strokeStyle = bSpec.color;

                    ctx.ellipse(0, -14, 16, 7, this.gameTime * 3, 0, Math.PI * 2);

                ctx.restore();

            drawArticulatedSiegeEngine(ctx, se, light) {
                ctx.save();
                const elevY = -(se.terrainZ || 0);
                ctx.translate(0, elevY);

                if (this.selectedIds.includes(se.id)) {
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.ellipse(0, 6, 34, 16, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.42})`;
                ctx.beginPath();
                ctx.ellipse(8, 9, 32, 13, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.scale(se.facing || 1, 1);

                if (se.kind === 'trebuchet') {
                    ctx.fillStyle = '#5c2808';
                    ctx.fillRect(-24, 0, 48, 7);
                    ctx.strokeStyle = '#78350f';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(-16, 2); ctx.lineTo(0, -32); ctx.lineTo(16, 2);
                    ctx.stroke();

                    const swingAng = -0.5 + Math.sin(se.armAnim * Math.PI) * 1.4;
                    ctx.save();
                    ctx.translate(0, -30);
                    ctx.rotate(swingAng);
                    ctx.strokeStyle = '#b45309';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(-12, 0); ctx.lineTo(28, 0);
                    ctx.stroke();
                    ctx.fillStyle = '#57534e';
                    ctx.fillRect(-16, 2, 10, 10);
                    ctx.restore();
                } else {
                    const ramSurge = Math.sin(se.armAnim * Math.PI) * 11;
                    ctx.fillStyle = '#451a03';
                    ctx.fillRect(-20 + ramSurge, -13, 40, 7);
                    ctx.fillStyle = '#e7e5e4';
                    ctx.beginPath();
                    ctx.arc(20 + ramSurge, -10, 7.5, 0, Math.PI * 2);

                    ctx.fillStyle = '#78350f';
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-24, -6); ctx.lineTo(0, -22); ctx.lineTo(24, -6);

                    ctx.fill();
                    if (this.hd2dEnabled) ctx.stroke();

                const pct = Math.max(0, se.hp / se.maxHp);
                ctx.fillStyle = '#1c1917';

                ctx.fillStyle = '#fde047';
                ctx.fillRect(-19, -41, 38 * pct, 2.5);

                ctx.restore();
