                let pinchZoom0 = 0.72;

                this.canvas.addEventListener('pointerdown', (e) => {
                    this.sfx.init();
                    isPointerDown = true;
                    startX = lastX = e.clientX;
                    startY = lastY = e.clientY;
                    movedDist = 0;
                    if (this.lassoMode && !this.globeMode) {
                        this.lassoRect = { x1: startX, y1: startY, x2: startX, y2: startY };
                    }
                });

                window.addEventListener('pointermove', (e) => {
                    if (!isPointerDown) return;
                    const dx = e.clientX - lastX;
                    const dy = e.clientY - lastY;
                    lastX = e.clientX;
                    lastY = e.clientY;
                    movedDist += Math.hypot(dx, dy);

                    if (this.globeMode) {
                        this.globeYaw -= dx * 0.007;
                        return;
                    }

                    if (this.lassoMode && this.lassoRect) {
                        this.lassoRect.x2 = e.clientX;
                        this.lassoRect.y2 = e.clientY;
                        return;
                    }

                    this.cam.targetX = wrapX(this.cam.targetX - dx / this.cam.zoom);
                    this.cam.targetY = Math.max(250, Math.min(WORLD_H - 250, this.cam.targetY - dy / (this.cam.zoom * this.camTiltY)));
                });

                window.addEventListener('pointerup', (e) => {
                    if (!isPointerDown) return;
                    isPointerDown = false;

                    if (this.lassoMode && this.lassoRect && movedDist > 14) {
                        this.finishLassoSelection();
                        this.lassoRect = null;
                        return;
                    }
                    this.lassoRect = null;

                    if (movedDist < 12) {
                        if (this.globeMode) {
                            this.handleGlobeTap(e.clientX, e.clientY);
                        } else {
                            this.handleWorldTap(e.clientX, e.clientY);
                        }
                    }
                });

                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const factor = e.deltaY > 0 ? 0.9 : 1.1;
                    this.cam.targetZoom = Math.max(0.28, Math.min(1.65, this.cam.targetZoom * factor));
                }, { passive: false });

                this.canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        pinchDist0 = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        pinchZoom0 = this.cam.targetZoom;
                    }
                }, { passive: true });

                this.canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && pinchDist0 > 10) {
                        const d = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        this.cam.targetZoom = Math.max(0.28, Math.min(1.65, pinchZoom0 * (d / pinchDist0)));
                    }
                }, { passive: true });

                if (this.miniCanvas) {
                    this.miniCanvas.addEventListener('pointerdown', (e) => {
                        const rect = this.miniCanvas.getBoundingClientRect();
                        const mx = (e.clientX - rect.left) / rect.width;
                        const my = (e.clientY - rect.top) / rect.height;
                        this.globeMode = false;
                        this.cam.targetX = wrapX(mx * WORLD_W);
                        this.cam.targetY = Math.max(300, Math.min(WORLD_H - 300, my * WORLD_H));
                    });
                }
            }

            finishLassoSelection() {
                if (!this.lassoRect) return;
                const xMin = Math.min(this.lassoRect.x1, this.lassoRect.x2);
                const xMax = Math.max(this.lassoRect.x1, this.lassoRect.x2);
                const yMin = Math.min(this.lassoRect.y1, this.lassoRect.y2);
                const yMax = Math.max(this.lassoRect.y1, this.lassoRect.y2);
                const picked = [];
                this.villagers.forEach(u => {
                    const sp = this.worldToScreen(u.x, u.y);
                    if (sp.x >= xMin && sp.x <= xMax && sp.y >= yMin && sp.y <= yMax) {
                        picked.push(u.id);
                    }
                });
                if (picked.length > 0) {
                    this.selectedIds = picked;
                    this.updateInspector();
                    this.showBanner('🔲', `Selected ${picked.length} Tribe Units!`);
                }
            }

            handleGlobeTap(sx, sy) {
                const cx = this.canvas.width * 0.5;
                const cy = this.canvas.height * 0.5;
                const R = Math.min(this.canvas.width, this.canvas.height) * 0.34;
                if (Math.hypot(sx - cx, sy - cy) <= R * 1.15) {
                    const relX = (sx - cx) / R;
                    const lon = Math.asin(Math.max(-1, Math.min(1, relX))) - this.globeYaw;
                    const norm = ((lon / (Math.PI * 2)) % 1 + 1) % 1;
                    this.cam.targetX = wrapX(norm * WORLD_W);
                    this.cam.targetY = 2340;
                    this.globeMode = false;
                    const cIdx = Math.floor(this.cam.targetX / 1600) % CONTINENTS.length;
                    this.showBanner('🌍', `Dropped into ${CONTINENTS[cIdx].name}!`);
                }
            }

            handleWorldTap(sx, sy) {
                const wp = this.screenToWorld(sx, sy);
                const heroSelected = this.selectedIds.some(id => {
                    const v = this.villagers.find(u => u.id === id);
                    return v && v.isT101s;
                });

                if (this.buildMode) {
                    this.buildPos = wp;
                    return;
                }

                // 1. Select friendly unit or Siege Engine (or let t101s telekinetically levitate a friendly human!)
                const tappedUnit = this.villagers.find(u => wrappedDist(wp.x, wp.y, u.x, u.y) < 36) ||
                                   this.siegeEngines.find(se => wrappedDist(wp.x, wp.y, se.x, se.y) < 44);
                if (tappedUnit) {
                    if (heroSelected && !tappedUnit.isT101s && !tappedUnit.kind && this.ringControlMode) {
                        tappedUnit.bloodLevitatedTimer = 12.0;
                        tappedUnit.hp = Math.min(tappedUnit.maxHp, tappedUnit.hp + 35);
                        if (!this.selectedIds.includes(tappedUnit.id)) this.selectedIds.push(tappedUnit.id);
                        this.sfx.play('ring');
                        this.spawnFloatText(tappedUnit.x, tappedUnit.y - 36, '🪽 RING LEVITATED!', '#fde047');
                        this.showBanner('💍', `t101s is Blood-Levitating ${tappedUnit.name} — tap anywhere to fly them together!`);
                        this.updateInspector();
                        return;
                    }
                    this.selectedIds = [tappedUnit.id];
                    this.updateInspector();
                    return;
                }

                // 2. Attack or Blood-Control enemy raider or stronghold
                const tappedEnemy = this.enemies.find(e => wrappedDist(wp.x, wp.y, e.x, e.y) < 42) ||
                                    this.strongholds.find(s => wrappedDist(wp.x, wp.y, s.x, s.y) < s.radius + 18);
                if (tappedEnemy && this.selectedIds.length > 0) {
                    this.selectedIds.forEach(id => {
                        const u = this.villagers.find(v => v.id === id) || this.siegeEngines.find(s => s.id === id);
                        if (u) {
                            u.targetEntityId = tappedEnemy.id;
                            u.targetX = null;
                            u.targetY = null;
                        }
                    });
                    // Any enemy humans currently Blood-Controlled by t101s also obey the attack order!
                    if (heroSelected) {
                        this.enemies.forEach(e => {
                            if ((e.puppetTimer || 0) > 0 || e.bloodControlled) {
                                if (e.id !== tappedEnemy.id) {
                                    e.controlTargetEntityId = tappedEnemy.id;
                                    e.controlTargetX = null;
                                    e.controlTargetY = null;
                                }
                            }
                        });
                    }
                    this.targetRings.push({ x: tappedEnemy.x, y: tappedEnemy.y, maxRadius: 42, color: '#f43f5e', life: 1.0 });
                    return;
                }

                // 3. Harvest resource node
                const tappedNode = this.nodes.find(n => wrappedDist(wp.x, wp.y, n.x, n.y) < 38);
                if (tappedNode && this.selectedIds.length > 0) {
                    this.selectedIds.forEach(id => {
                        const u = this.villagers.find(v => v.id === id);
                        if (u) {
                            u.targetEntityId = tappedNode.id;
                            u.targetX = null;
                            u.targetY = null;
                        }
                    });
                    this.targetRings.push({ x: tappedNode.x, y: tappedNode.y, maxRadius: 36, color: '#fbbf24', life: 1.0 });
                    return;
                }

                // 4. Move selected units (and any Blood-Controlled Human Puppets!) in formation
                if (this.selectedIds.length > 0) {
                    this.selectedIds.forEach((id, idx) => {
                        const u = this.villagers.find(v => v.id === id) || this.siegeEngines.find(s => s.id === id);
                        if (u) {
                            const angle = (idx / Math.max(1, this.selectedIds.length)) * Math.PI * 2;
                            const spread = this.selectedIds.length > 1 ? 26 : 0;
                            u.targetX = wrapX(wp.x + Math.cos(angle) * spread);
                            u.targetY = Math.max(160, Math.min(WORLD_H - 160, wp.y + Math.sin(angle) * spread));
                            u.targetEntityId = null;
                        }
                    });
                    if (heroSelected) {
                        this.enemies.forEach((e, eIdx) => {
                            if ((e.puppetTimer || 0) > 0 || e.bloodControlled) {
                                const pAng = eIdx * 1.2;
                                e.controlTargetX = wrapX(wp.x + Math.cos(pAng) * 44);
                                e.controlTargetY = Math.max(160, Math.min(WORLD_H - 160, wp.y + Math.sin(pAng) * 34));
                                e.controlTargetEntityId = null;
                            }
                        });
                    }
                    this.targetRings.push({ x: wp.x, y: wp.y, maxRadius: 28, color: '#4ade80', life: 1.0 });
                }
            }

            addScreenShake(intensity = 7, duration = 0.28) {
                this.screenShake.intensity = Math.max(this.screenShake.intensity, intensity);
                this.screenShake.maxTimer = duration;
                this.screenShake.timer = duration;
            }

            launchUnitRagdoll(u, vx, vy, vz = 130, spinDir = 1) {
                u.vx = vx;
                u.vy = vy;
                u.velZ = vz;
                u.airborneZ = Math.max(2, u.airborneZ || 0);
                u.ragdollSpin = spinDir * 8.5;
            }

            spawnFloatText(x, y, text, color = '#fde047') {
                this.floatTexts.push({ x: wrapX(x), y, text, color, life: 1.1 });
            }

            spawnSlashRibbon(x, y, facing, a0, a1, radius, color, thickness = 7, isFinisher = false) {
                this.slashRibbons.push({
                    x: wrapX(x),
                    y,
                    facing,
                    a0,
                    a1,
                    radius,
                    color,
                    thickness,
                    isFinisher,
                    life: isFinisher ? 0.30 : 0.22,
                    maxLife: isFinisher ? 0.30 : 0.22
                });
            }

            spawnThrustStreak(x1, y1, x2, y2, color = '#38bdf8', width = 5) {
                this.thrustStreaks.push({
                    x1: wrapX(x1),
                    y1,
                    x2: wrapX(x2),
                    y2,
                    color,
                    width,
                    life: 0.20,
                    maxLife: 0.20
                });
            }

            spawnGroundShockwave(x, y, maxR = 48, color = '#fde047') {
                this.groundShockwaves.push({
                    x: wrapX(x),
                    y,
                    maxR,
                    color,
                    life: 0.36,
                    maxLife: 0.36
                });
            }

            spawnClashSparks(x, y, color = '#fde047', count = 9) {
                for (let i = 0; i < count; i++) {
                    const ang = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
                    const spd = 65 + Math.random() * 95;
                    this.clashSparks.push({
                        x: wrapX(x),
                        y,
                        vx: Math.cos(ang) * spd,
                        vy: Math.sin(ang) * spd - 20,
                        color: i % 2 === 0 ? '#ffffff' : color,
                        life: 0.24 + Math.random() * 0.12,
                        maxLife: 0.32
                    });
                }
            }

            spawnTerrainDecal(x, y, kind, radius = 24) {
                if (this.terrainDecals.length > 90) this.terrainDecals.shift();
                this.terrainDecals.push({ x: wrapX(x), y, kind, radius, life: 14, maxLife: 14 });
            }

            spawnRockSpikeCluster(x, y, count = 3) {
                for (let i = 0; i < count; i++) {
                    this.rockSpikes.push({
                        x: wrapX(x + (Math.random() - 0.5) * 36),
                        y: y + (Math.random() - 0.5) * 20,
                        h: 18 + Math.random() * 14,
                        w: 9 + Math.random() * 5,
                        tilt: (Math.random() - 0.5) * 0.4,
                        life: 3.5,
                        maxLife: 3.5
                    });
                }
            }

            loop(now) {
                const rawDt = Math.min(0.05, Math.max(0.001, (now - this.lastTick) / 1000));
                this.lastTick = now;

                this._frames++;
                this._fpsTimer += rawDt;
                if (this._fpsTimer >= 0.5) {
                    this.fps = Math.round(this._frames / this._fpsTimer);
                    this._frames = 0;
                    this._fpsTimer = 0;
                    const fpsEl = document.getElementById('perfFps');
                    if (fpsEl) fpsEl.textContent = `${this.fps} FPS`;
                    const cIdx = Math.floor(wrapX(this.cam.x) / 1600) % CONTINENTS.length;
                    const cEl = document.getElementById('perfContinent');
                    if (cEl) cEl.textContent = CONTINENTS[cIdx].name;
                }

                try {
                    this.update(rawDt);
                    this.render();
                } catch (err) {
                    console.error('Frame error recovered:', err);
                }

                requestAnimationFrame((t) => this.loop(t));
            }

            update(dt) {
                this.gameTime += dt;
                if (this.resetConfirmTimer > 0) this.resetConfirmTimer = Math.max(0, this.resetConfirmTimer - dt);
                if (this.screenShake.timer > 0) this.screenShake.timer = Math.max(0, this.screenShake.timer - dt);
                if (this.victoryCheerTimer > 0) this.victoryCheerTimer = Math.max(0, this.victoryCheerTimer - dt);
                if (this.crimsonEclipseTimer > 0) this.crimsonEclipseTimer = Math.max(0, this.crimsonEclipseTimer - dt);

                // Rebuild Spatial Hash Grid
                this.spatialGrid.clear();
                for (let i = 0; i < this.villagers.length; i++) this.spatialGrid.insert(this.villagers[i]);
                for (let i = 0; i < this.enemies.length; i++) this.spatialGrid.insert(this.enemies[i]);
                for (let i = 0; i < this.nodes.length; i++) this.spatialGrid.insert(this.nodes[i]);

                // Raid Wave Countdown
                this.raidTimer -= dt;
                if (this.raidTimer <= 0) {
                    this.triggerCannibalRaid();
                    this.raidTimer = 55;
                }
                const waveEl = document.getElementById('waveTimerLabel');
                if (waveEl) waveEl.textContent = `Raid: ${Math.ceil(this.raidTimer)}s`;

                // Update Settlers Porters & Buildings
                this.updateBuildingsAndPorters(dt);

                // Update Tribe Heroes, Benders & Commanders
                this.updateVillagers(dt);

                // Update 2.5D Siege Engines
                this.updateSiegeEngines(dt);

                // Update Enemies & Strongholds
                this.updateEnemies(dt);

                // Update Projectiles, Wildlife & FX
                this.updateProjectilesAndFX(dt);
            }

            updateBuildingsAndPorters(dt) {
                for (let i = 0; i < this.buildings.length; i++) {
                    const b = this.buildings[i];
                    if (!b.built) {
                        b.progress += dt * 22;
                        if (b.progress >= 100) {
                            b.built = true;
                            b.progress = 100;
                            this.showBanner('✅', `${b.name} Construction Complete!`);
                        }
                        continue;
                    }
                    b.prodTimer = (b.prodTimer || 0) + dt;
                    if (b.prodTimer >= 4.5) {
                        b.prodTimer = 0;
                        if (b.type === 'sawmill') this.resources.wood += 8;
                        else if (b.type === 'quarry') this.resources.stone += 7;
                        else if (b.type === 'kitchen') this.resources.food += 9;
                        else if (b.type === 'forge') { this.resources.weapons += 1; this.resources.gold += 4; }
                        else if (b.type === 'town_center') { this.resources.food += 4; this.resources.gold += 3; }
                        this.updateHUD();
                    }

                    if (b.type === 'tower') {
                        b.attackTimer = Math.max(0, (b.attackTimer || 0) - dt);
                        if (b.attackTimer <= 0) {
                            const nearEn = this.spatialGrid.queryRadius(b.x, b.y, 290, e => e.isEnemy && e.isHostileToPlayer !== false && e.hp > 0);
                            if (nearEn.length > 0) {
                                b.attackTimer = 1.35;
                                const dist = Math.max(110, wrappedDist(b.x, b.y, nearEn[0].x, nearEn[0].y));
                                this.sfx.play('bow');
                                this.projectiles.push({
                                    x: b.x,
                                    y: b.y - 44,
                                    groundY0: b.y,
                                    tx: nearEn[0].x,
                                    ty: nearEn[0].y,
                                    targetId: nearEn[0].id,
                                    isEnemyProj: false,
                                    kind: 'fire_arrow',
                                    color: '#f97316',
                                    dmg: 28,
                                    progress: 0,
                                    speed: Math.max(0.95, Math.min(1.85, 320 / dist)),
                                    arcHeight: 92,
                                    trail: []
                                });
                            }
                        }
                    }
                }

                for (let i = 0; i < this.porters.length; i++) {
                    const p = this.porters[i];
                    p.t += dt * 0.22 * p.dir;
                    p.wheelPhase = (p.wheelPhase || 0) + dt * 7;
                    if (p.t >= 1) { p.t = 1; p.dir = -1; }
                    else if (p.t <= 0) { p.t = 0; p.dir = 1; }
                }
            }

            updateVillagers(dt) {
                for (let i = this.villagers.length - 1; i >= 0; i--) {
                    const u = this.villagers[i];
                    if (u.hp <= 0) {
                        if (u.isT101s) {
                            u.hp = u.maxHp; // The One Ring revives t101s
                            this.showBanner('💍', 'The One Ring restored t101s from the brink!');
                        } else {
                            this.villagers.splice(i, 1);
                            continue;
                        }
                    }

                    u.attackTimer = Math.max(0, u.attackTimer - dt);
                    u.swingAnim = Math.max(0, u.swingAnim - dt * 3.2);
                    u.kickAnim = Math.max(0, u.kickAnim - dt * 3.0);
                    u.bowDrawAnim = Math.max(0, (u.bowDrawAnim || 0) - dt * 2.8);
                    u.dodgeAnim = Math.max(0, (u.dodgeAnim || 0) - dt * 2.4);
                    u.blockAnim = Math.max(0, (u.blockAnim || 0) - dt * 2.5);
                    u.martialAnim = Math.max(0, (u.martialAnim || 0) - dt * 2.2);
                    u.flightRollAnim = Math.max(0, (u.flightRollAnim || 0) - dt * 2.0);
                    u.diveAnim = Math.max(0, (u.diveAnim || 0) - dt * 2.3);
                    u.combatJumpZ = Math.max(0, (u.combatJumpZ || 0) - dt * 65);
                    u.spineLean = (u.spineLean || 0) * Math.pow(0.08, dt);
                    u.victoryTimer = Math.max(0, (u.victoryTimer || 0) - dt);
                    u.hitFlashTimer = Math.max(0, (u.hitFlashTimer || 0) - dt);
                    u.bloodLevitatedTimer = Math.max(0, (u.bloodLevitatedTimer || 0) - dt);
                    u.onRoad = !u.skySoar && this.isPointNearRoad(u.x, u.y);
                    u.terrainZ = this.getTerrainElevation(u.x, u.y);

                    // Dynamic Flight Pitch & Periodic Aerial Barrel-Rolls for t101s & Flying Units
                    const moveSpeed = Math.hypot(u.vx || 0, u.vy || 0);
                    const isFlyingUnit = u.isT101s || (u.bloodLevitatedTimer || 0) > 0 || u.bender === 'avatar';
                    const targetPitch = (isFlyingUnit && moveSpeed > 30) ? Math.min(0.62, moveSpeed / 210) : 0;
                    u.flightSpeedPitch = (u.flightSpeedPitch || 0) + (targetPitch - (u.flightSpeedPitch || 0)) * Math.min(1, dt * 8);

                    if (u.isT101s && u.skySoar && moveSpeed > 75 && (u.flightRollAnim || 0) <= 0 && Math.random() < 0.008) {
                        u.flightRollAnim = 1.0;
                        this.sonicRings.push({ x: u.x, y: u.y - 26, r: 6, maxR: 54, life: 0.75 });
                    }

                    // Spawn Translucent Motion-Blur Afterimages for Sky-Soar t101s, Airbenders & Kung-Fu Dash
                    const isMovingFast = Math.hypot(u.vx || 0, u.vy || 0) > 65;
                    if (isMovingFast && (u.isT101s || u.bender === 'air' || u.fightingStyle === 'kungfu') && Math.random() < 0.35) {
                        if (this.afterimages.length < 45) {
                            this.afterimages.push({
                                x: u.x,
                                y: u.y,
                                facing: u.facing || 1,
                                elevY: -(u.terrainZ || 0) - (u.isT101s ? (u.skySoar ? 24 : 12) : 0),
                                color: u.isT101s ? '#f43f5e' : (u.bender === 'air' ? '#a7f3d0' : '#10b981'),
                                life: 0.24,
                                maxLife: 0.24
                            });
                        }
                    }

                    // Spawn River Wading Ripples when crossing the river on foot
                    if (!u.skySoar && (u.bloodLevitatedTimer || 0) <= 0 && (u.terrainZ || 0) === 0 && Math.abs(u.y - this.getRiverCenterY(u.x)) < 45) {
                        if (Math.hypot(u.vx || 0, u.vy || 0) > 8 && Math.random() < 0.22 && this.wadingRipples.length < 50) {
                            this.wadingRipples.push({ x: u.x, y: u.y + 3, r: 4, maxR: 20, life: 0.55 });
                        }
                    }

                    // Waterbender Spirit Healing Beam to nearby wounded allies
                    if (u.bender === 'water' || u.bender === 'avatar') {
                        const wounded = this.villagers.find(ally => ally.hp < ally.maxHp && wrappedDist(u.x, u.y, ally.x, ally.y) < 160);
                        if (wounded) {
                            wounded.hp = Math.min(wounded.maxHp, wounded.hp + 12 * dt);
                            if (Math.random() < 0.18) {
                                this.healingBeams.push({ x1: u.x, y1: u.y - 18, x2: wounded.x, y2: wounded.y - 18, life: 0.25 });
                            }
                        }
                    }

                    // Check Enemy Target or Auto-Acquire Nearby Hostile Raider
                    let enemyTarget = null;
                    if (u.targetEntityId) {
                        enemyTarget = this.enemies.find(e => e.id === u.targetEntityId && e.hp > 0) ||
                                      this.strongholds.find(s => s.id === u.targetEntityId && s.hp > 0);
                    }
                    if (!enemyTarget) {
                        const nearEnemies = this.spatialGrid.queryRadius(u.x, u.y, 260, e => e.isEnemy && e.isHostileToPlayer !== false && !e.bloodControlled && e.hp > 0);
                        if (nearEnemies.length > 0) enemyTarget = nearEnemies[0];
                    }

                    const styleSpec = FIGHTING_STYLES[u.fightingStyle] || FIGHTING_STYLES.berserker;
                    const benderSpec = u.bender ? BENDING_SPECS[u.bender] : null;

                    if (enemyTarget) {
                        const dist = wrappedDist(u.x, u.y, enemyTarget.x, enemyTarget.y);
                        const highGroundBonus = (u.terrainZ || 0) >= 16 ? 1.25 : 1.0;
                        const effRange = (u.isT101s ? 250 : (benderSpec ? benderSpec.range : styleSpec.range)) * highGroundBonus;
                        const dx = wrapDX(u.x, enemyTarget.x);
                        const dy = enemyTarget.y - u.y;
                        if (Math.abs(dx) > 2) u.facing = dx >= 0 ? 1 : -1;
                        u.moveAngle = Math.atan2(dy, dx);
                        u.aimPitch = Math.max(-0.55, Math.min(0.55, Math.atan2(dy, Math.max(18, Math.abs(dx)))));

                        if (dist > effRange) {
                            this.moveUnitToward(u, enemyTarget.x, enemyTarget.y, dt);
                        } else if (u.attackTimer <= 0) {
                            this.performUnitAttack(u, enemyTarget);
                        }
                        continue;
                    }

                    // Check Resource Harvesting Target
                    if (u.targetEntityId) {
                        const node = this.nodes.find(n => n.id === u.targetEntityId && n.amount > 0);
                        if (node) {
                            const d = wrappedDist(u.x, u.y, node.x, node.y);
                            if (d > 38) {
                                this.moveUnitToward(u, node.x, node.y, dt);
                            } else if (u.attackTimer <= 0) {
                                u.attackTimer = 0.85;
                                u.swingAnim = 1.0;
                                node.hitShakeTimer = 0.25;
                                node.amount -= 10;
                                if (node.type === 'wood') this.resources.wood += 6;
                                else if (node.type === 'stone') this.resources.stone += 6;
                                else if (node.type === 'gold') this.resources.gold += 5;
                                else this.resources.food += 6;
                                this.sfx.play('chop');
                                this.spawnFloatText(node.x, node.y - 26, '+6', '#fde047');
                                if (node.amount <= 0) {
                                    if (node.type === 'wood') {
                                        this.fallingTrees.push({ x: node.x, y: node.y, angle: 0, dir: u.facing || 1 });
                                    }
                                    this.nodes = this.nodes.filter(n => n.id !== node.id);
                                    u.targetEntityId = null;
                                }
                                this.updateHUD();
                            }
                            continue;
                        }
                    }

                    // Move to Waypoint
                    if (u.targetX !== null && u.targetY !== null) {
                        const d = wrappedDist(u.x, u.y, u.targetX, u.targetY);
                        if (d > 14) {
                            this.moveUnitToward(u, u.targetX, u.targetY, dt);
                        } else {
                            u.targetX = null;
                            u.targetY = null;
                            u.vx = 0;
                            u.vy = 0;
                        }
                    } else {
                        u.vx = 0;
                        u.vy = 0;
                    }
                }
            }

            moveUnitToward(u, tx, ty, dt) {
                const dx = wrapDX(u.x, tx);
                const dy = ty - u.y;
                const dist = Math.hypot(dx, dy) || 1;
                const styleSpec = FIGHTING_STYLES[u.fightingStyle] || FIGHTING_STYLES.berserker;
                let speed = 96 * styleSpec.speedMult;
                if (u.onRoad) speed *= 1.45;
                if (u.mountType) speed *= 1.35;
                if (u.isT101s && u.skySoar) speed *= 1.55;
                if ((u.bloodLevitatedTimer || 0) > 0) speed *= 1.48;
                u.vx = (dx / dist) * speed;
                u.vy = (dy / dist) * speed;
                u.x = wrapX(u.x + u.vx * dt);
                u.y = Math.max(180, Math.min(WORLD_H - 180, u.y + u.vy * dt));
                if (Math.abs(dx) > 2) u.facing = dx >= 0 ? 1 : -1;
                u.moveAngle = Math.atan2(dy, dx);
                u.walkPhase = (u.walkPhase || 0) + dt * 9.5;
            }

            performUnitAttack(u, target) {
                const styleSpec = FIGHTING_STYLES[u.fightingStyle] || FIGHTING_STYLES.berserker;
                const light = this.getLightingState();
                const bloodMoonBonus = light.isBloodMoon ? 1.35 : 1.0;
                const highGroundBonus = (u.terrainZ || 0) >= 16 ? 1.25 : 1.0;

                // Advance 3-Stage Choreographed Combo Chain (0 -> 1 -> 2)
                u.comboStep = ((u.comboStep || 0) + 1) % 3;
                const cStep = u.comboStep;
                const isFinisher = cStep === 2;
                const comboMult = isFinisher ? 1.45 : (cStep === 1 ? 1.15 : 1.0);

                u.attackTimer = (u.isT101s ? 0.68 : 0.88) / styleSpec.speedMult;
                u.swingAnim = 1.0;
                u.spineLean = isFinisher ? 0.34 : 0.18;

                // 1. HERO t101s: THE ONE RING 3-FORM BLOODBENDING, DIVE-BOMB & TELEKINETIC CHOREOGRAPHY
                if (u.isT101s) {
                    this.sfx.play('ring');
                    u.combatJumpZ = isFinisher ? 22 : 8;
                    if (isFinisher) {
                        u.diveAnim = 1.0;
                        u.flightRollAnim = 1.0;
                        this.sonicRings.push({ x: u.x, y: u.y - 26, r: 8, maxR: 72, life: 0.85 });
                    }
                    const rawDmg = u.atk * 1.65 * bloodMoonBonus * highGroundBonus * comboMult;
                    target.hitFlashTimer = 0.22;
                    this.spawnGroundShockwave(target.x, target.y, isFinisher ? 64 : 40, '#f43f5e');
                    this.spawnClashSparks(target.x, target.y - 18, '#fb7185', 8);

                    if (target.isEnemy) {
                        if (this.ringControlMode) {
                            target.hp = Math.max(Math.round(target.maxHp * 0.25), target.hp - rawDmg * 0.22);
                            target.puppetTimer = 22.0;
                            target.bloodControlled = true;
                            target.puppetCasterId = u.id;
                            const formLabels = ['🩸 BLOOD GRIP!', '💍 RUNE BIND!', '👑 SOVEREIGN THRALL!'];
                            this.spawnFloatText(target.x, target.y - 40, formLabels[u.comboStep], '#fde047');
                        } else {
                            target.hp -= rawDmg;
                            target.puppetTimer = 3.5;
                            target.bloodControlled = false;
                            target.puppetCasterId = u.id;
                            this.launchUnitRagdoll(target, (Math.random() - 0.5) * 115, (Math.random() - 0.5) * 75, isFinisher ? 175 : 125, u.facing);
                            this.spawnFloatText(target.x, target.y - 40, `🩸 RING CRUSH -${Math.round(rawDmg)}`, '#fb7185');
                        }
                    } else {
                        target.hp -= rawDmg;
                        this.spawnFloatText(target.x, target.y - 40, `💍 -${Math.round(rawDmg)}`, '#fb7185');
                    }
                    this.lightningArcs.push({ x1: u.x, y1: u.y - 26, x2: target.x, y2: target.y - 18, color: '#f43f5e', life: 0.38 });
                    if (isFinisher) {
                        this.singularities.push({ x: target.x, y: target.y - 20, r: 6, maxR: 76, life: 0.55 });
                    }
                    return;
                }

                // 2. AVATAR ELEMENTAL BENDING MARTIAL ARTS FORMS
                if (u.bender) {
                    const bSpec = BENDING_SPECS[u.bender];
                    u.martialAnim = 1.0;
                    if (u.bender === 'earth') {
                        u.martialForm = cStep === 1 ? 'leg_sweep' : 'avatar_kata';
                        u.spineLean = 0.28;
                        this.spawnGroundShockwave(u.x, u.y, 42, '#d97706');
                    } else if (u.bender === 'air' || u.bender === 'fire') {
                        u.martialForm = isFinisher ? 'hurricane_kick' : (cStep === 1 ? 'crane_kick' : 'hundred_palms');
                        if (isFinisher || cStep === 1) {
                            u.kickAnim = 1.0;
                            u.combatJumpZ = 20;
                            u.spineLean = -0.28;
                        }
                    } else {
                        u.martialForm = 'avatar_kata';
                    }
                    this.spawnSlashRibbon(u.x, u.y - 18, u.facing, -1.0, 1.1, isFinisher ? 34 : 26, bSpec.color, isFinisher ? 10 : 7, isFinisher);
                    const count = (isFinisher && (u.bender === 'fire' || u.bender === 'avatar')) ? 2 : 1;
                    for (let c = 0; c < count; c++) {
                        this.projectiles.push({
                            x: u.x,
                            y: u.y - 22 - (u.terrainZ || 0) - (u.combatJumpZ || 0),
                            tx: target.x + (c === 1 ? 18 : 0),
                            ty: target.y + (c === 1 ? -12 : 0),
                            targetId: target.id,
                            isEnemyProj: false,
                            kind: u.bender === 'avatar' ? ['fire', 'earth', 'water', 'air'][(u.comboStep + c) % 4] : u.bender,
                            color: bSpec.color,
                            dmg: u.atk * 1.35 * highGroundBonus * comboMult,
                            progress: 0,
                            speed: 2.35,
                            arcHeight: u.bender === 'earth' ? 68 : 26
                        });
                    }
                    if (isFinisher) {
                        this.spawnFloatText(u.x, u.y - 42, `${bSpec.icon} MASTER KATA!`, bSpec.color);
                    }
                    return;
                }

                // 3. SKY-VOLLEY BOWMAN: FULL ELASTIC BOW-DRAW & PHOENIX MULTI-ARROW VOLLEY
                if (u.fightingStyle === 'archery') {
                    u.bowDrawAnim = 1.0;
                    u.spineLean = -0.18;
                    this.sfx.play('bow');

                    // Bow-Release Sonic Air Ring at the Archer's Hand
                    this.parryRings.push({
                        x: u.x + (u.facing || 1) * 14,
                        y: u.y - 20 - (u.terrainZ || 0),
                        r: 4,
                        maxR: isFinisher ? 28 : 18,
                        life: 0.24
                    });

                    const arrowCount = isFinisher ? 5 : (cStep === 1 ? 2 : 1);
                    const arrowKind = isFinisher ? 'fire_arrow' : (cStep === 1 ? 'wind_arrow' : 'arrow');
                    const dist = Math.max(100, wrappedDist(u.x, u.y, target.x, target.y));
                    const baseSpeed = Math.max(0.95, Math.min(1.85, 310 / dist));

                    for (let a = 0; a < arrowCount; a++) {
                        const spread = (a - (arrowCount - 1) * 0.5) * 22;
                        this.projectiles.push({
                            x: u.x + (u.facing || 1) * 12,
                            y: u.y - 20 - (u.terrainZ || 0),
                            groundY0: u.y,
                            tx: target.x + spread,
                            ty: target.y + spread * 0.35,
                            targetId: target.id,
                            isEnemyProj: false,
                            kind: arrowKind,
                            color: arrowKind === 'fire_arrow' ? '#f97316' : (arrowKind === 'wind_arrow' ? '#34d399' : '#fde047'),
                            dmg: (u.atk * styleSpec.dmgMult * highGroundBonus * comboMult) / (isFinisher ? 2.2 : (cStep === 1 ? 1.4 : 1.0)),
                            progress: 0,
                            speed: baseSpeed * (1 - a * 0.04),
                            arcHeight: (isFinisher ? 115 : 74) + a * 14 + Math.min(60, dist * 0.14),
                            trail: []
                        });
                    }
                    if (isFinisher) {
                        this.spawnFloatText(u.x, u.y - 38, '🦅 PHOENIX 5-ARROW VOLLEY!', '#f97316');
                    } else if (cStep === 1) {
                        this.spawnFloatText(u.x, u.y - 36, '🌪️ TWIN GALE ARROWS!', '#34d399');
                    }
                    return;
                }

                // 4. CHOREOGRAPHED 3-HIT MELEE & MARTIAL ARTS COMBOS (Berserker, Phalanx, Kung-Fu, Juggernaut)
                // Enemy has a chance to actively Dodge or Block incoming strikes with full animations!
                if (target.isEnemy && !target.bloodControlled && (target.puppetTimer || 0) <= 0 && !isFinisher && Math.random() < 0.24) {
                    if (Math.random() < 0.52) {
                        this.triggerUnitDodge(target, u);
                    } else {
                        this.triggerUnitBlock(target, u);
                    }
                    return;
                }

                const dmg = u.atk * styleSpec.dmgMult * highGroundBonus * comboMult;
                target.hp -= dmg;
                target.hitFlashTimer = isFinisher ? 0.24 : 0.16;
                this.spawnClashSparks(target.x, target.y - 16, styleSpec.color, isFinisher ? 12 : 6);

                if (u.fightingStyle === 'berserker') {
                    if (u.comboStep === 0) {
                        // Cross-Body Dual X-Slash
                        this.spawnSlashRibbon(u.x, u.y - 18, u.facing, -1.25, 1.15, 28, '#f97316', 8, false);
                        this.spawnSlashRibbon(u.x, u.y - 16, u.facing, 1.15, -1.25, 26, '#fde047', 6, false);
                    } else if (u.comboStep === 1) {
                        // 360° Whirlwind Spin Cleave
                        u.flightRollAnim = 0.85;
                        this.spawnSlashRibbon(u.x, u.y - 16, u.facing, -Math.PI, Math.PI, 32, '#fb923c', 9, true);
                        this.spawnGroundShockwave(u.x, u.y, 38, '#f97316');
                    } else {
                        // Airborne Guillotine Leap Slam Finisher
                        u.combatJumpZ = 26;
                        u.diveAnim = 1.0;
                        u.spineLean = 0.42;
                        this.spawnSlashRibbon(u.x, u.y - 22, u.facing, -1.5, 1.4, 36, '#ef4444', 12, true);
                        this.spawnGroundShockwave(target.x, target.y, 54, '#ef4444');
                        if (target.isEnemy) this.launchUnitRagdoll(target, u.facing * 75, -20, 110, u.facing);
                        this.spawnFloatText(target.x, target.y - 38, `❌ LEAP FINISHER -${Math.round(dmg)}!`, '#f97316');
                        return;
                    }
                } else if (u.fightingStyle === 'phalanx') {
                    if (u.comboStep === 0) {
                        this.spawnThrustStreak(u.x, u.y - 16, target.x, target.y - 16, '#38bdf8', 5);
                    } else if (u.comboStep === 1) {
                        // Heavy Tower-Shield Bash
                        u.blockAnim = 0.85;
                        u.blockType = 'shield_wall';
                        this.parryRings.push({ x: target.x, y: target.y - 16, r: 8, maxR: 38, life: 0.30 });
                        if (target.isEnemy) this.launchUnitRagdoll(target, u.facing * 65, 0, 75, u.facing);
                        this.spawnFloatText(target.x, target.y - 36, '🛡️ SHIELD BASH!', '#38bdf8');
                    } else {
                        // Skyward Impale Lunge Finisher
                        u.combatJumpZ = 14;
                        this.spawnThrustStreak(u.x, u.y - 18, target.x + u.facing * 18, target.y - 22, '#fde047', 8);
                        this.spawnGroundShockwave(target.x, target.y, 44, '#38bdf8');
                        this.spawnFloatText(target.x, target.y - 38, `⚡ IMPALE -${Math.round(dmg)}!`, '#38bdf8');
                        return;
                    }
                } else if (u.fightingStyle === 'kungfu') {
                    // Cycle through 5 Authentic Martial Arts Forms!
                    const forms = ['hundred_palms', 'crane_kick', 'leg_sweep', 'hurricane_kick', 'dragon_uppercut'];
                    u.martialForm = forms[(u.comboStep + Math.floor(this.gameTime * 2)) % forms.length];
                    u.martialAnim = 1.0;

                    if (u.martialForm === 'hundred_palms') {
                        this.spawnThrustStreak(u.x, u.y - 18, target.x, target.y - 18, '#10b981', 7);
                        this.spawnFloatText(target.x, target.y - 36, '🖐️ 100-PALM FLURRY!', '#34d399');
                    } else if (u.martialForm === 'crane_kick') {
                        u.kickAnim = 1.0;
                        u.combatJumpZ = 20;
                        u.spineLean = -0.32;
                        this.spawnSlashRibbon(u.x, u.y - 22, u.facing, 1.1, -1.5, 32, '#fde047', 9, true);
                        this.spawnFloatText(target.x, target.y - 38, '🦩 CRANE SNAP KICK!', '#fde047');
                    } else if (u.martialForm === 'leg_sweep') {
                        u.kickAnim = 0.85;
                        u.spineLean = 0.38;
                        this.spawnSlashRibbon(u.x, u.y - 4, u.facing, -0.8, 1.6, 30, '#34d399', 8, false);
                        if (target.isEnemy) this.launchUnitRagdoll(target, u.facing * 35, 0, 115, -u.facing);
                        this.spawnFloatText(target.x, target.y - 36, '🧹 DRAGON TAIL SWEEP!', '#10b981');
                    } else if (u.martialForm === 'hurricane_kick') {
                        u.kickAnim = 1.0;
                        u.combatJumpZ = 24;
                        u.flightRollAnim = 1.0;
                        this.spawnSlashRibbon(u.x, u.y - 20, u.facing, -Math.PI, Math.PI, 34, '#34d399', 10, true);
                        this.spawnGroundShockwave(target.x, target.y, 48, '#10b981');
                        this.spawnFloatText(target.x, target.y - 38, '🌪️ HURRICANE SPLIT-KICK!', '#34d399');
                    } else {
                        // Rising Dragon Uppercut Finisher
                        u.combatJumpZ = 30;
                        this.spawnThrustStreak(u.x, u.y - 8, target.x + u.facing * 12, target.y - 48, '#fde047', 11);
                        this.spawnGroundShockwave(target.x, target.y, 56, '#10b981');
                        if (target.isEnemy) this.launchUnitRagdoll(target, u.facing * 110, (Math.random() - 0.5) * 40, 145, u.facing);
                        this.spawnFloatText(target.x, target.y - 40, `🐉 DRAGON UPPERCUT -${Math.round(dmg)}!`, '#10b981');
                        return;
                    }
                } else if (u.fightingStyle === 'juggernaut') {
                    if (isFinisher) {
                        u.combatJumpZ = 22;
                        this.addScreenShake(9, 0.30);
                        this.fissures.push({ x: target.x, y: target.y, angle: u.moveAngle, life: 1.8 });
                        this.spawnRockSpikeCluster(target.x, target.y, 3);
                        this.spawnGroundShockwave(target.x, target.y, 68, '#a855f7');
                        if (target.isEnemy) this.launchUnitRagdoll(target, u.facing * 95, (Math.random() - 0.5) * 60, 160, u.facing);
                        this.spawnFloatText(target.x, target.y - 40, `☄️ METEOR MAUL -${Math.round(dmg)}!`, '#c084fc');
                        return;
                    } else {
                        this.fissures.push({ x: target.x, y: target.y, angle: u.moveAngle, life: 1.2 });
                        this.spawnSlashRibbon(u.x, u.y - 18, u.facing, -1.35, 1.25, 32, '#a855f7', 10, false);
                    }
                }

                this.spawnFloatText(target.x, target.y - 30, `${styleSpec.icon} -${Math.round(dmg)}`, styleSpec.color);
            }

            updateSiegeEngines(dt) {
                for (let i = this.siegeEngines.length - 1; i >= 0; i--) {
                    const se = this.siegeEngines[i];
                    if (se.hp <= 0) {
                        this.siegeEngines.splice(i, 1);
                        continue;
                    }
                    se.attackTimer = Math.max(0, se.attackTimer - dt);
                    se.armAnim = Math.max(0, se.armAnim - dt * 2.2);
                    se.terrainZ = this.getTerrainElevation(se.x, se.y);

                    let target = null;
                    if (se.targetEntityId) {
                        target = this.enemies.find(e => e.id === se.targetEntityId && e.hp > 0) ||
                                 this.strongholds.find(s => s.id === se.targetEntityId && s.hp > 0);
                    }
                    if (!target) {
                        const near = this.spatialGrid.queryRadius(se.x, se.y, se.range + 140, e => e.isEnemy && e.isHostileToPlayer !== false && e.hp > 0);
                        if (near.length > 0) target = near[0];
                    }

                    if (target) {
                        const d = wrappedDist(se.x, se.y, target.x, target.y);
                        const dx = wrapDX(se.x, target.x);
                        const dy = target.y - se.y;
                        if (Math.abs(dx) > 2) se.facing = dx >= 0 ? 1 : -1;
                        se.moveAngle = Math.atan2(dy, dx);

                        if (d > se.range) {
                            const spd = se.kind === 'ram' ? 68 : 54;
                            se.x = wrapX(se.x + (dx / d) * spd * dt);
                            se.y = Math.max(180, Math.min(WORLD_H - 180, se.y + (dy / d) * spd * dt));
                            se.wheelPhase += dt * 6.5;
                        } else if (se.attackTimer <= 0) {
                            se.attackTimer = se.kind === 'trebuchet' ? 2.5 : 1.8;
                            se.armAnim = 1.0;
                            if (se.kind === 'trebuchet') {
                                this.projectiles.push({
                                    x: se.x,
                                    y: se.y - 42 - (se.terrainZ || 0),
                                    tx: target.x,
                                    ty: target.y,
                                    targetId: target.id,
                                    isEnemyProj: false,
                                    kind: 'fire',
                                    color: '#f97316',
                                    dmg: se.atk,
                                    progress: 0,
                                    speed: 1.6,
                                    arcHeight: 140
                                });
                            } else {
                                this.addScreenShake(9, 0.3);
                                target.hp -= se.atk;
                                this.spawnRockSpikeCluster(target.x, target.y, 3);
                                this.spawnFloatText(target.x, target.y - 36, `🦣 RAM -${se.atk}!`, '#fde047');
                            }
                        }
                        continue;
                    }

                    if (se.targetX !== null && se.targetY !== null) {
                        const d = wrappedDist(se.x, se.y, se.targetX, se.targetY);
                        if (d > 16) {
                            const dx = wrapDX(se.x, se.targetX);
                            const dy = se.targetY - se.y;
                            const spd = se.kind === 'ram' ? 68 : 54;
                            se.x = wrapX(se.x + (dx / d) * spd * dt);
                            se.y = Math.max(180, Math.min(WORLD_H - 180, se.y + (dy / d) * spd * dt));
                            if (Math.abs(dx) > 2) se.facing = dx >= 0 ? 1 : -1;
                            se.wheelPhase += dt * 6.5;
                        } else {
                            se.targetX = null;
                            se.targetY = null;
                        }
                    }
                }
            }

            updateEnemies(dt) {
                // 0. Autonomous AI Players Civilization Loop (Economy, Base Expansion, Age Up, Training & Expeditions)
                this.updateAIPlayersCivilizations(dt);

                for (let i = this.strongholds.length - 1; i >= 0; i--) {
                    const s = this.strongholds[i];
                    if (s.hp <= 0) {
                        const cont = CONTINENTS[s.continentIdx];
                        if (cont) cont.isPlayer = true;
                        const ai = this.aiPlayers.find(a => a.continentIdx === s.continentIdx);
                        if (ai) {
                            ai.stance = 'vassal';
                            ai.defeated = true;
                            this.enemies.forEach(e => {
                                if (e.aiOwnerId === ai.id) e.isHostileToPlayer = false;
                            });
                        }
                        this.empirePopBillions = +(this.empirePopBillions + 0.72).toFixed(2);
                        this.rivalPopBillions = Math.max(0, +(this.rivalPopBillions - 0.72).toFixed(2));
                        this.resources.gold += 150;
                        this.strongholds.splice(i, 1);
                        this.sfx.play('horn');
                        this.victoryCheerTimer = 4.0;
                        this.showBanner('🏆', `Conquered ${s.name}! ${ai ? ai.name + ' swore fealty as Ring Vassal!' : '+720M Population Annexed!'}`);
                        this.updateHUD();
                        this.renderDiplomacyPanel();
                    }
                }

                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    if (e.hp <= 0) {
                        // If an AI Sovereign falls while t101s is in Non-Lethal Spare Mode, subjugate their Empire as a Vassal!
                        if (e.isAISovereign && this.ringControlMode) {
                            const ai = this.aiPlayers.find(a => a.id === e.aiOwnerId);
                            if (ai && ai.stance !== 'vassal') {
                                ai.stance = 'vassal';
                                e.hp = e.maxHp;
                                e.isHostileToPlayer = false;
                                this.enemies.forEach(unit => {
                                    if (unit.aiOwnerId === ai.id) unit.isHostileToPlayer = false;
                                });
                                this.sfx.play('ring');
                                this.showBanner('💍', `t101s Subjugated ${ai.name} with The One Ring! The ${ai.empireName} is now your Allied Vassal!`);
                                this.renderDiplomacyPanel();
                                continue;
                            }
                        }
                        this.resources.gold += 6;
                        this.rivalPopBillions = Math.max(0, +(this.rivalPopBillions - 0.02).toFixed(2));
                        this.enemies.splice(i, 1);
                        this.updateHUD();
                        continue;
                    }

                    e.attackTimer = Math.max(0, e.attackTimer - dt);
                    e.swingAnim = Math.max(0, e.swingAnim - dt * 3.2);
                    e.kickAnim = Math.max(0, (e.kickAnim || 0) - dt * 3.0);
                    e.dodgeAnim = Math.max(0, (e.dodgeAnim || 0) - dt * 2.4);
                    e.blockAnim = Math.max(0, (e.blockAnim || 0) - dt * 2.5);
                    e.martialAnim = Math.max(0, (e.martialAnim || 0) - dt * 2.2);
                    e.flightRollAnim = Math.max(0, (e.flightRollAnim || 0) - dt * 2.0);
                    e.combatJumpZ = Math.max(0, (e.combatJumpZ || 0) - dt * 65);
                    e.spineLean = (e.spineLean || 0) * Math.pow(0.08, dt);
                    e.puppetTimer = Math.max(0, (e.puppetTimer || 0) - dt);
                    e.hitFlashTimer = Math.max(0, (e.hitFlashTimer || 0) - dt);
                    if (e.puppetTimer <= 0) e.bloodControlled = false;
                    e.terrainZ = this.getTerrainElevation(e.x, e.y);

                    if ((e.airborneZ || 0) > 0 || (e.velZ || 0) > 0) {
                        e.airborneZ = Math.max(0, (e.airborneZ || 0) + e.velZ * dt);
                        e.velZ -= 420 * dt;
                        if (e.airborneZ <= 0) {
                            e.airborneZ = 0;
                            e.velZ = 0;
                            e.ragdollSpin = 0;
                        }
                    }

                    // 1. Bloodbent Human Puppet State: Obeys t101s's movement & attack commands without dying!
                    if (e.puppetTimer > 0 || e.bloodControlled) {
                        e.airborneZ = Math.max(e.airborneZ || 0, 18 + Math.sin(this.gameTime * 7 + i) * 4);
                        const hero = this.villagers.find(v => v.isT101s);

                        let puppetTarget = null;
                        if (e.controlTargetEntityId) {
                            puppetTarget = this.enemies.find(o => o.id === e.controlTargetEntityId && o.id !== e.id && o.hp > 0) ||
                                           this.strongholds.find(s => s.id === e.controlTargetEntityId && s.hp > 0);
                        }
                        if (!puppetTarget) {
                            puppetTarget = this.enemies.find(o => o.id !== e.id && !o.bloodControlled && (o.puppetTimer || 0) <= 0 && wrappedDist(e.x, e.y, o.x, o.y) < 220);
                        }

                        if (puppetTarget) {
                            const d = wrappedDist(e.x, e.y, puppetTarget.x, puppetTarget.y);
                            const dx = wrapDX(e.x, puppetTarget.x);
                            const dy = puppetTarget.y - e.y;
                            if (Math.abs(dx) > 1) e.facing = dx >= 0 ? 1 : -1;
                            e.moveAngle = Math.atan2(dy, dx);
                            if (d > 48) {
                                e.x = wrapX(e.x + (dx / d) * 105 * dt);
                                e.y = Math.max(180, Math.min(WORLD_H - 180, e.y + (dy / d) * 105 * dt));
                                e.walkPhase = (e.walkPhase || 0) + dt * 10;
                            } else if (e.attackTimer <= 0) {
                                e.attackTimer = 0.85;
                                e.swingAnim = 1.0;
                                puppetTarget.hp -= e.atk * 1.4;
                                puppetTarget.hitFlashTimer = 0.16;
                                this.spawnSlashRibbon(e.x, e.y - 18, e.facing, -1.0, 1.0, 24, '#fde047');
                                this.spawnFloatText(puppetTarget.x, puppetTarget.y - 28, `👑 PUPPET STRIKE!`, '#fde047');
                            }
                            continue;
                        }

                        let destX = e.controlTargetX;
                        let destY = e.controlTargetY;
                        if ((destX === null || destY === null) && hero) {
                            const orbitAng = this.gameTime * 1.2 + i * 1.3;
                            destX = wrapX(hero.x + Math.cos(orbitAng) * 62);
                            destY = hero.y + Math.sin(orbitAng) * 44;
                        }
                        if (destX !== null && destY !== null) {
                            const d = wrappedDist(e.x, e.y, destX, destY);
                            if (d > 14) {
                                const dx = wrapDX(e.x, destX);
                                const dy = destY - e.y;
                                e.x = wrapX(e.x + (dx / d) * 112 * dt);
                                e.y = Math.max(180, Math.min(WORLD_H - 180, e.y + (dy / d) * 112 * dt));
                                e.facing = dx >= 0 ? 1 : -1;
                                e.moveAngle = Math.atan2(dy, dx);
                                e.walkPhase = (e.walkPhase || 0) + dt * 9;
                            }
                        }
                        continue;
                    }

                    // 2. AI Player Harvester Behavior (Gathers Wood/Stone/Gold for its AI Civilization!)
                    const ownerAI = this.aiPlayers.find(a => a.id === e.aiOwnerId);
                    if (e.isAIHarvester && ownerAI) {
                        const nearNodes = this.spatialGrid.queryRadius(e.x, e.y, 460, n => n.amount > 0);
                        if (nearNodes.length > 0) {
                            const node = nearNodes[0];
                            const d = wrappedDist(e.x, e.y, node.x, node.y);
                            const dx = wrapDX(e.x, node.x);
                            const dy = node.y - e.y;
                            if (d > 38) {
                                e.x = wrapX(e.x + (dx / d) * 72 * dt);
                                e.y = Math.max(180, Math.min(WORLD_H - 180, e.y + (dy / d) * 72 * dt));
                                e.facing = dx >= 0 ? 1 : -1;
                                e.moveAngle = Math.atan2(dy, dx);
                                e.walkPhase = (e.walkPhase || 0) + dt * 8.5;
                            } else if (e.attackTimer <= 0) {
                                e.attackTimer = 1.1;
                                e.swingAnim = 1.0;
                                node.hitShakeTimer = 0.22;
                                ownerAI.resources.wood += 6;
                                ownerAI.resources.stone += 5;
                                ownerAI.resources.food += 6;
                                ownerAI.resources.gold += 3;
                            }
                            continue;
                        }
                    }

                    // 3. AI Combat & Inter-Empire Target Acquisition
                    let target = null;
                    let bestD = Infinity;

                    const isAlliedOrVassal = ownerAI && (ownerAI.stance === 'allied' || ownerAI.stance === 'vassal');
                    const isNeutral = ownerAI && ownerAI.stance === 'neutral';

                    if (isAlliedOrVassal) {
                        // Allied & Vassal AI units hunt Hostile AI units to help the player!
                        for (let j = 0; j < this.enemies.length; j++) {
                            const other = this.enemies[j];
                            if (other.id === e.id || !other.isHostileToPlayer) continue;
                            const d = wrappedDist(e.x, e.y, other.x, other.y);
                            if (d < bestD) { bestD = d; target = other; }
                        }
                    } else if (isNeutral) {
                        // Neutral AI guards its capital territory (only fights hostile units within 340px)
                        for (let j = 0; j < this.enemies.length; j++) {
                            const other = this.enemies[j];
                            if (other.id === e.id || other.aiOwnerId === e.aiOwnerId || !other.isHostileToPlayer) continue;
                            const d = wrappedDist(e.x, e.y, other.x, other.y);
                            if (d < 340 && d < bestD) { bestD = d; target = other; }
                        }
                    } else {
                        // Hostile AI fights Player Villagers, Allied AI units, and Player Buildings
                        for (let j = 0; j < this.villagers.length; j++) {
                            const u = this.villagers[j];
                            const d = wrappedDist(e.x, e.y, u.x, u.y);
                            if (d < bestD) { bestD = d; target = u; }
                        }
                        for (let j = 0; j < this.enemies.length; j++) {
                            const other = this.enemies[j];
                            if (other.id === e.id || other.aiOwnerId === e.aiOwnerId) continue;
                            const otherAI = this.aiPlayers.find(a => a.id === other.aiOwnerId);
                            if (otherAI && (otherAI.stance === 'allied' || otherAI.stance === 'vassal')) {
                                const d = wrappedDist(e.x, e.y, other.x, other.y);
                                if (d < bestD) { bestD = d; target = other; }
                            }
                        }
                        if (bestD > 420 && this.buildings.length > 0) {
                            const b = this.buildings[0];
                            const d = wrappedDist(e.x, e.y, b.x, b.y);
                            if (d < bestD) { bestD = d; target = b; }
                        }
                    }

                    // Keep Sovereign Emperors & Neutral garrisons patrolling near their capital unless an enemy is close
                    if (ownerAI && (e.isAISovereign || isNeutral) && bestD > 380) {
                        const patrolAng = this.gameTime * 0.45 + (i % 5) * 1.2;
                        const px = wrapX(ownerAI.capitalX + Math.cos(patrolAng) * 115);
                        const py = ownerAI.capitalY + 65 + Math.sin(patrolAng) * 55;
                        const dCap = wrappedDist(e.x, e.y, px, py);
                        if (dCap > 18) {
                            const dx = wrapDX(e.x, px);
                            const dy = py - e.y;
                            e.x = wrapX(e.x + (dx / dCap) * 65 * dt);
                            e.y = Math.max(180, Math.min(WORLD_H - 180, e.y + (dy / dCap) * 65 * dt));
                            e.facing = dx >= 0 ? 1 : -1;
                            e.moveAngle = Math.atan2(dy, dx);
                            e.walkPhase = (e.walkPhase || 0) + dt * 7;
                        }
                        continue;
                    }

                    if (target) {
                        const hitRange = e.bender ? 175 : (e.fightingStyle === 'archery' ? 185 : 48);
                        if (bestD > hitRange) {
                            const dx = wrapDX(e.x, target.x);
                            const dy = target.y - e.y;
                            const dist = Math.hypot(dx, dy) || 1;
                            const spd = e.mountType ? 94 : 76;
                            e.x = wrapX(e.x + (dx / dist) * spd * dt);
                            e.y = Math.max(180, Math.min(WORLD_H - 180, e.y + (dy / dist) * spd * dt));
                            e.facing = dx >= 0 ? 1 : -1;
                            e.moveAngle = Math.atan2(dy, dx);
                            e.walkPhase = (e.walkPhase || 0) + dt * 8.5;
                        } else if (e.attackTimer <= 0) {
                            e.attackTimer = 1.15;
                            e.swingAnim = 1.0;
                            e.comboStep = ((e.comboStep || 0) + 1) % 3;
                            e.spineLean = 0.24;

                            if (e.bender || e.fightingStyle === 'archery') {
                                const bSpec = e.bender ? BENDING_SPECS[e.bender] : null;
                                const isArchery = !e.bender && e.fightingStyle === 'archery';
                                if (isArchery) {
                                    e.bowDrawAnim = 1.0;
                                    this.sfx.play('bow');
                                }
                                const distToTarget = Math.max(100, wrappedDist(e.x, e.y, target.x, target.y));
                                this.projectiles.push({
                                    x: e.x + (e.facing || 1) * 10,
                                    y: e.y - 20 - (e.terrainZ || 0),
                                    groundY0: e.y,
                                    tx: target.x,
                                    ty: target.y,
                                    targetId: target.id,
                                    isEnemyProj: true,
                                    kind: e.bender || (e.comboStep === 2 ? 'fire_arrow' : 'arrow'),
                                    color: bSpec ? bSpec.color : '#eab308',
                                    dmg: e.atk,
                                    progress: 0,
                                    speed: isArchery ? Math.max(0.95, Math.min(1.85, 300 / distToTarget)) : 2.3,
                                    arcHeight: isArchery ? 82 + Math.min(50, distToTarget * 0.12) : 28,
                                    trail: []
                                });
                                continue;
                            }

                            if (e.fightingStyle === 'kungfu' && e.comboStep === 1) {
                                e.kickAnim = 1.0;
                                e.combatJumpZ = 14;
                                e.martialForm = 'hurricane_kick';
                                e.martialAnim = 1.0;
                            }
                            const enemyStyle = FIGHTING_STYLES[e.fightingStyle] || FIGHTING_STYLES.berserker;
                            this.spawnSlashRibbon(e.x, e.y - 16, e.facing, -1.0, 1.0, 24, e.empireColor || '#f43f5e', 6, e.comboStep === 2);
                            const st = FIGHTING_STYLES[target.fightingStyle] || FIGHTING_STYLES.berserker;
                            const defendChance = Math.min(0.78, (st.blockChance || 0.20) + (target.isT101s ? 0.25 : 0.12));
                            if (target.name && Math.random() < defendChance) {
                                const preferDodge = target.fightingStyle === 'kungfu' || target.fightingStyle === 'archery' || target.bender === 'air' || (target.isT101s && Math.random() < 0.45);
                                if (preferDodge || Math.random() < 0.42) {
                                    this.triggerUnitDodge(target, e);
                                } else {
                                    this.triggerUnitBlock(target, e);
                                }
                            } else {
                                target.hp -= e.atk;
                                target.hitFlashTimer = 0.15;
                                this.spawnClashSparks(target.x, target.y - 16, enemyStyle.color, 5);
                            }
                        }
                    }
                }
            }

            updateAIPlayersCivilizations(dt) {
                for (let i = 0; i < this.aiPlayers.length; i++) {
                    const ai = this.aiPlayers[i];
                    if (ai.defeated) continue;
                    ai.decisionTimer -= dt;
                    if (ai.decisionTimer > 0) continue;
                    ai.decisionTimer = 9.5 + Math.random() * 4;

                    // Passive AI Civilization Economy Growth
                    ai.resources.wood += 28;
                    ai.resources.stone += 24;
                    ai.resources.food += 30;
                    ai.resources.gold += 16;

                    // 1. AI Epoch Age Advancement (Age I -> II -> III -> IV)
                    if (ai.ageLevel < 3 && ai.resources.food >= 180 && ai.resources.gold >= 90) {
                        ai.resources.food -= 140;
                        ai.resources.gold -= 70;
                        ai.ageLevel++;
                        const ep = EPOCHS[ai.ageLevel];
                        this.showBanner(ai.avatar, `AI Player ${ai.name} (${ai.empireName}) Advanced to ${ep.name}!`);
                    }

                    // 2. AI City Expansion (Constructs up to 7 satellite structures around its Capital)
                    if (ai.aiStructures && ai.aiStructures.length < 7 && ai.resources.wood >= 90 && ai.resources.stone >= 70) {
                        ai.resources.wood -= 60;
                        ai.resources.stone -= 50;
                        const idx = ai.aiStructures.length;
                        const ang = (idx / 7) * Math.PI * 2;
                        const bTypes = ['shrine', 'forge', 'tower', 'hut'];
                        ai.aiStructures.push({
                            type: bTypes[idx % bTypes.length],
                            x: wrapX(ai.capitalX + Math.cos(ang) * 165),
                            y: ai.capitalY + Math.sin(ang) * 115,
                            radius: 30
                        });
                        ai.buildingsCount = ai.aiStructures.length + 1;
                    }

                    // 3. AI Unit & Bender Training
                    const myUnits = this.enemies.filter(e => e.aiOwnerId === ai.id && e.hp > 0);
                    if (myUnits.length < 9 && ai.resources.food >= 60) {
                        ai.resources.food -= 50;
                        ai.popBillions = +(ai.popBillions + 0.04).toFixed(2);
                        const isBender = myUnits.length % 3 === 0;
                        this.enemies.push(this.createEnemyRaider(
                            ai.capitalX + (Math.random() - 0.5) * 140,
                            ai.capitalY + 85 + (Math.random() - 0.5) * 50,
                            ai.continentIdx,
                            {
                                aiOwnerId: ai.id,
                                name: `${ai.empireName.split(' ')[0]} ${isBender ? 'Bender' : 'Legionary'}`,
                                bender: isBender ? ai.bender : null,
                                fightingStyle: ai.preferredStyle,
                                isCommander: myUnits.length % 4 === 0,
                                mountType: myUnits.length % 4 === 0 ? 'sabre' : null,
                                empireColor: ai.color,
                                isHostileToPlayer: ai.stance === 'hostile'
                            }
                        ));
                    }

                    const panel = document.getElementById('diplomacyPanel');
                    if (panel && !panel.classList.contains('hidden')) {
                        this.renderDiplomacyPanel();
                    }
                }
            }

            triggerCannibalRaid() {
                const hostileAIs = this.aiPlayers.filter(a => a.stance === 'hostile' && !a.defeated);
                const senderAI = hostileAIs.length > 0
                    ? hostileAIs[this.wave % hostileAIs.length]
                    : null;

                const count = 4 + Math.min(6, this.wave);
                const spawnX = 1380;
                const spawnY = 2320;
                for (let i = 0; i < count; i++) {
                    this.enemies.push(this.createEnemyRaider(
                        spawnX + (Math.random() - 0.5) * 120,
                        spawnY + (Math.random() - 0.5) * 120,
                        senderAI ? senderAI.continentIdx : 1,
                        {
                            aiOwnerId: senderAI ? senderAI.id : 'ai_5',
                            name: senderAI ? `${senderAI.empireName.split(' ')[0]} Raider` : 'Cannibal Raider',
                            bender: (i === 0 && senderAI) ? senderAI.bender : null,
                            fightingStyle: senderAI && i % 2 === 0 ? senderAI.preferredStyle : 'berserker',
                            empireColor: senderAI ? senderAI.color : '#f43f5e',
                            isHostileToPlayer: true
                        }
                    ));
                }
                this.wave++;
                this.sfx.play('horn');
                this.showBanner(
                    senderAI ? senderAI.avatar : '⚠️',
                    senderAI
                        ? `${senderAI.name} (${senderAI.empireName}) launched Invasion Wave #${this.wave - 1}!`
                        : `Cannibal Legion Wave #${this.wave - 1} Invading from the East!`
                );
            }

            updateProjectilesAndFX(dt) {
                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const p = this.projectiles[i];
                    const prevProg = p.progress;
                    p.progress += dt * p.speed;

                    // Record smooth parabolic flight trail for arrows & elemental orbs
                    const dx = wrapDX(p.x, p.tx);
                    const dy = p.ty - p.y;
                    const clampedProg = Math.min(1, p.progress);
                    const curWX = wrapX(p.x + dx * clampedProg);
                    const arcOffset = Math.sin(clampedProg * Math.PI) * (p.arcHeight || 40);
                    const curWY = p.y + dy * clampedProg - arcOffset;
                    const groundY = (p.groundY0 !== undefined ? p.groundY0 : p.y) + (p.ty - (p.groundY0 !== undefined ? p.groundY0 : p.y)) * clampedProg;

                    if (!p.trail) p.trail = [];
                    p.trail.push({ x: curWX, y: curWY, groundY, prog: clampedProg });
                    if (p.trail.length > 14) p.trail.shift();

                    // Spawn in-flight ember / wind wake particles for arrows
                    const isArrowProj = p.kind === 'arrow' || p.kind === 'fire_arrow' || p.kind === 'wind_arrow';
                    if (isArrowProj && Math.random() < 0.55 && this.clashSparks.length < 90) {
                        this.clashSparks.push({
                            x: curWX,
                            y: curWY,
                            vx: -dx * 0.08 + (Math.random() - 0.5) * 24,
                            vy: (Math.random() - 0.5) * 24,
                            color: p.kind === 'fire_arrow' ? (Math.random() > 0.4 ? '#f97316' : '#fde047') : (p.kind === 'wind_arrow' ? '#34d399' : '#fef08a'),
                            life: 0.18,
                            maxLife: 0.18
                        });
                    }

                    if (p.progress >= 1) {
                        const target = p.isEnemyProj
                            ? (this.villagers.find(v => v.id === p.targetId) || this.enemies.find(e => e.id === p.targetId) || this.buildings.find(b => b.id === p.targetId))
                            : (this.enemies.find(e => e.id === p.targetId) || this.strongholds.find(s => s.id === p.targetId));
                        if (target && target.hp > 0) {
                            target.hp -= p.dmg;
                            target.hitFlashTimer = 0.16;
                            if (p.kind === 'fire' || p.kind === 'fire_arrow') this.spawnTerrainDecal(target.x, target.y, 'crater', 20);
                            else if (p.kind === 'water') this.spawnTerrainDecal(target.x, target.y, 'frost', 24);
                            else if (p.kind === 'earth') this.spawnRockSpikeCluster(target.x, target.y, 2);
                        }

                        // Stick quivering arrow into the battlefield / target on impact!
                        if (isArrowProj) {
                            const derivArc = Math.cos(Math.PI) * Math.PI * (p.arcHeight || 75);
                            const impactAngle = Math.atan2(dy - derivArc, dx);
                            this.sfx.play('arrow_hit');
                            this.spawnClashSparks(p.tx, p.ty - 10, p.color || '#fde047', p.kind === 'fire_arrow' ? 10 : 6);
                            if (p.kind === 'fire_arrow') {
                                this.spawnGroundShockwave(p.tx, p.ty, 34, '#f97316');
                            } else if (p.kind === 'wind_arrow') {
                                this.spawnGroundShockwave(p.tx, p.ty, 28, '#34d399');
                            }
                            if (this.embeddedArrows.length > 48) this.embeddedArrows.shift();
                            this.embeddedArrows.push({
                                x: wrapX(p.tx + (Math.random() - 0.5) * 8),
                                y: p.ty + (Math.random() - 0.5) * 6,
                                angle: impactAngle,
                                kind: p.kind,
                                quiverTimer: 0.55,
                                life: 3.2,
                                maxLife: 3.2
                            });
                        }
                        this.projectiles.splice(i, 1);
                    }
                }

                for (let i = this.embeddedArrows.length - 1; i >= 0; i--) {
                    const ea = this.embeddedArrows[i];
                    ea.quiverTimer = Math.max(0, ea.quiverTimer - dt);
                    ea.life -= dt;
                    if (ea.life <= 0) this.embeddedArrows.splice(i, 1);
                }

                for (let i = this.wildlife.length - 1; i >= 0; i--) {
                    const w = this.wildlife[i];
                    w.walkPhase += dt * 3.6;
                    const vx = Math.cos(this.gameTime * 0.4 + i) * 15;
                    const vy = Math.sin(this.gameTime * 0.35 + i) * 10;
                    w.x = wrapX(w.x + vx * dt);
                    w.y = Math.max(1500, Math.min(3100, w.y + vy * dt));
                    w.facing = vx >= 0 ? 1 : -1;
                    w.moveAngle = Math.atan2(vy, vx);
                    w.terrainZ = this.getTerrainElevation(w.x, w.y);
