            renderXRayOcclusionPass(ctx, invTilt) {
                for (let i = 0; i < this.villagers.length; i++) {
                    const u = this.villagers[i];
                    if (!u._isOccluded) continue;
                    u._isOccluded = false;
                    const rx = wrapDX(this.cam.x, u.x);
                    const ry = u.y - this.cam.y;
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(1, invTilt);
                    ctx.strokeStyle = u.isT101s ? '#fde047' : '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, -18, 12, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            renderCombatAndBendingVFX(ctx, invTilt) {
                // 0. Expanding Ground Impact Shockwaves (Meteor Maul, Leap Finishers, Earth Stomps)
                for (let i = 0; i < this.groundShockwaves.length; i++) {
                    const sw = this.groundShockwaves[i];
                    if (!this.isVisibleInFrustum(sw.x, sw.y, 90)) continue;
                    const rx = wrapDX(this.cam.x, sw.x);
                    const ry = sw.y - this.cam.y;
                    const prog = 1 - sw.life / sw.maxLife;
                    const curR = 8 + (sw.maxR - 8) * prog;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, sw.life / sw.maxLife);
                    ctx.strokeStyle = sw.color;
                    ctx.lineWidth = 3.2 * (1 - prog * 0.6);
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, curR, curR * 0.48, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // 0.5. Multi-Layer Tapered Crescent Weapon Slash Ribbons & Linear Spear/Chi Thrust Streaks
                for (let i = 0; i < this.slashRibbons.length; i++) {
                    const sr = this.slashRibbons[i];
                    if (!this.isVisibleInFrustum(sr.x, sr.y, 70)) continue;
                    const rx = wrapDX(this.cam.x, sr.x);
                    const ry = sr.y - this.cam.y;
                    const alpha = Math.max(0, sr.life / sr.maxLife);
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(sr.facing || 1, invTilt);
                    ctx.globalAlpha = alpha;
                    ctx.lineCap = 'round';

                    // Outer Elemental/Style Glow Arc
                    ctx.strokeStyle = sr.color;
                    ctx.lineWidth = (sr.thickness || 7) * 1.35;
                    ctx.beginPath();
                    ctx.arc(0, 0, sr.radius, sr.a0, sr.a1, sr.a1 < sr.a0);
                    ctx.stroke();

                    // White-Hot Inner Blade Edge
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = (sr.thickness || 7) * 0.45;
                    ctx.beginPath();
                    ctx.arc(0, 0, sr.radius * 0.94, sr.a0, sr.a1, sr.a1 < sr.a0);
                    ctx.stroke();
                    ctx.restore();
                }

                for (let i = 0; i < this.thrustStreaks.length; i++) {
                    const ts = this.thrustStreaks[i];
                    const x1 = wrapDX(this.cam.x, ts.x1);
                    const y1 = ts.y1 - this.cam.y;
                    const x2 = wrapDX(this.cam.x, ts.x2);
                    const y2 = ts.y2 - this.cam.y;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, ts.life / ts.maxLife);
                    ctx.strokeStyle = ts.color;
                    ctx.lineWidth = ts.width;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = ts.width * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    ctx.restore();
                }

                // 0.8. Directional Weapon Clash & Parry Sparks
                for (let i = 0; i < this.clashSparks.length; i++) {
                    const cs = this.clashSparks[i];
                    if (!this.isVisibleInFrustum(cs.x, cs.y, 40)) continue;
                    const rx = wrapDX(this.cam.x, cs.x);
                    const ry = cs.y - this.cam.y;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, cs.life / cs.maxLife);
                    ctx.strokeStyle = cs.color;
                    ctx.lineWidth = 2.0;
                    ctx.beginPath();
                    ctx.moveTo(rx, ry);
                    ctx.lineTo(rx - cs.vx * 0.035, ry - cs.vy * 0.035);
                    ctx.stroke();
                    ctx.restore();
                }

                // Translucent Motion-Blur Speed Afterimages
                for (let i = 0; i < this.afterimages.length; i++) {
                    const ai = this.afterimages[i];
                    if (!this.isVisibleInFrustum(ai.x, ai.y, 50)) continue;
                    const rx = wrapDX(this.cam.x, ai.x);
                    const ry = ai.y - this.cam.y;
                    ctx.save();
                    ctx.translate(rx, ry + (ai.elevY || 0));
                    ctx.scale(ai.facing || 1, invTilt);
                    ctx.globalAlpha = Math.max(0, (ai.life / ai.maxLife) * 0.42);
                    ctx.fillStyle = ai.color || '#38bdf8';
                    ctx.beginPath();
                    ctx.roundRect(-6, -22, 12, 14, 3);
                    ctx.arc(0, -26, 5.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                // Geometric Shield-Parry Deflection Rings
                for (let i = 0; i < this.parryRings.length; i++) {
                    const pr = this.parryRings[i];
                    if (!this.isVisibleInFrustum(pr.x, pr.y, 50)) continue;
                    const rx = wrapDX(this.cam.x, pr.x);
                    const ry = pr.y - this.cam.y;
                    const curR = pr.r + (pr.maxR - pr.r) * (1 - pr.life / 0.30);
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(1, invTilt);
                    ctx.strokeStyle = `rgba(56, 189, 248, ${Math.min(1, pr.life * 3.2)})`;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, curR, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // 5-Finger Bezier Bloodbending Puppet Strings from Hero t101s to Controlled Puppets & Levitated Allies
                const hero = this.villagers.find(u => u.isT101s);
                if (hero && this.isVisibleInFrustum(hero.x, hero.y, 360)) {
                    const hx = wrapDX(this.cam.x, hero.x) + (hero.facing || 1) * 10;
                    const hy = (hero.y - this.cam.y) - (hero.skySoar ? 42 : 30) * invTilt;
                    const drawPuppetTethers = (targetUnit, isFriendly) => {
                        const ex = wrapDX(this.cam.x, targetUnit.x);
                        const ey = (targetUnit.y - this.cam.y) - ((targetUnit.airborneZ || 16) + 16) * invTilt;
                        ctx.save();
                        for (let f = 0; f < 5; f++) {
                            const spread = (f - 2) * 5;
                            ctx.strokeStyle = f === 2 ? 'rgba(253, 224, 71, 0.9)' : (isFriendly ? 'rgba(56, 189, 248, 0.72)' : 'rgba(244, 63, 94, 0.82)');
                            ctx.lineWidth = f === 2 ? 2.0 : 1.2;
                            ctx.beginPath();
                            ctx.moveTo(hx, hy + f * 1.2);
                            ctx.quadraticCurveTo((hx + ex) * 0.5, Math.min(hy, ey) - 26 + spread, ex + spread, ey + (f - 2) * 3);
                            ctx.stroke();
                        }
                        ctx.restore();
                    };
                    for (let i = 0; i < this.enemies.length; i++) {
                        const e = this.enemies[i];
                        if ((e.puppetTimer || 0) > 0 || e.bloodControlled) drawPuppetTethers(e, false);
                    }
                    for (let i = 0; i < this.villagers.length; i++) {
                        const v = this.villagers[i];
                        if (!v.isT101s && (v.bloodLevitatedTimer || 0) > 0) drawPuppetTethers(v, true);
                    }
                }

                // Sky-Soar Sonic Boom Rings
                for (let i = 0; i < this.sonicRings.length; i++) {
                    const sr = this.sonicRings[i];
                    if (!this.isVisibleInFrustum(sr.x, sr.y, 90)) continue;
                    const rx = wrapDX(this.cam.x, sr.x);
                    const ry = sr.y - this.cam.y;
                    const curR = sr.r + (sr.maxR - sr.r) * (1 - sr.life);
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(1, invTilt);
                    ctx.strokeStyle = `rgba(253, 224, 71, ${sr.life * 0.8})`;
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, curR * 0.55, curR, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Quivering Embedded Arrows Stuck in Ground / Targets after Impact!
                for (let i = 0; i < this.embeddedArrows.length; i++) {
                    const ea = this.embeddedArrows[i];
                    if (!this.isVisibleInFrustum(ea.x, ea.y, 50)) continue;
                    const rx = wrapDX(this.cam.x, ea.x);
                    const ry = ea.y - this.cam.y;
                    const quiver = ea.quiverTimer > 0 ? Math.sin(this.gameTime * 68 + i) * 0.16 * (ea.quiverTimer / 0.55) : 0;

                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(1, invTilt);
                    ctx.globalAlpha = Math.min(1, ea.life / 0.8);

                    // Small Ground Contact Shadow
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
                    ctx.beginPath();
                    ctx.ellipse(0, 1, 5, 2.2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.rotate(ea.angle + quiver);
                    // Embedded Shaft sticking out from point of impact (tip buried at 0,0)
                    ctx.strokeStyle = '#fde68a';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-18, 0);
                    ctx.stroke();

                    // Tribal Feather Fletching at Tail
                    ctx.fillStyle = ea.kind === 'fire_arrow' ? '#f97316' : (ea.kind === 'wind_arrow' ? '#34d399' : '#f43f5e');
                    ctx.beginPath();
                    ctx.moveTo(-13, 0);
                    ctx.lineTo(-19, -4);
                    ctx.lineTo(-16, 0);
                    ctx.lineTo(-19, 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                // Active Projectiles (HD-2D Feathered Arrows with Parabolic Ribbon Trails, Ground Shadows & Elemental Orbs)
                for (let i = 0; i < this.projectiles.length; i++) {
                    const p = this.projectiles[i];
                    const dx = wrapDX(p.x, p.tx);
                    const dy = p.ty - p.y;
                    const wx = p.x + dx * p.progress;
                    const arcOffset = Math.sin(p.progress * Math.PI) * (p.arcHeight || 40);
                    const wy = p.y + dy * p.progress - arcOffset;
                    if (!this.isVisibleInFrustum(wx, wy, 90)) continue;
                    const rx = wrapDX(this.cam.x, wx);
                    const ry = wy - this.cam.y;

                    const isArrow = p.kind === 'arrow' || p.kind === 'fire_arrow' || p.kind === 'wind_arrow';

                    // 1. Render Ground Drop-Shadow & Curved Parabolic Ribbon Wake for Arrows
                    if (isArrow) {
                        const gY0 = p.groundY0 !== undefined ? p.groundY0 : p.y;
                        const curGroundY = gY0 + (p.ty - gY0) * p.progress;
                        const shadowRY = curGroundY - this.cam.y;

                        // Ground Shadow racing along terrain directly beneath the flying arrow
                        const derivArc = Math.cos(p.progress * Math.PI) * Math.PI * (p.arcHeight || 75);
                        const shadowAng = Math.atan2(p.ty - gY0, dx);
                        ctx.save();
                        ctx.translate(rx, shadowRY);
                        ctx.rotate(shadowAng);
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.36)';
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 12, 2.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();

                        // Smooth Multi-Segment Parabolic Ribbon Wake behind the Arrow
                        if (p.trail && p.trail.length > 1) {
                            ctx.save();
                            ctx.lineCap = 'round';
                            ctx.lineJoin = 'round';
                            for (let t = 1; t < p.trail.length; t++) {
                                const pt0 = p.trail[t - 1];
                                const pt1 = p.trail[t];
                                const frac = t / p.trail.length;
                                const tx0 = wrapDX(this.cam.x, pt0.x);
                                const ty0 = pt0.y - this.cam.y;
                                const tx1 = wrapDX(this.cam.x, pt1.x);
                                const ty1 = pt1.y - this.cam.y;

                                ctx.globalAlpha = frac * 0.78;
                                ctx.strokeStyle = p.kind === 'fire_arrow'
                                    ? (frac > 0.6 ? '#fef08a' : '#f97316')
                                    : (p.kind === 'wind_arrow' ? '#34d399' : '#fef9c3');
                                ctx.lineWidth = (p.kind === 'fire_arrow' ? 5.5 : 3.8) * frac;
                                ctx.beginPath();
                                ctx.moveTo(tx0, ty0);
                                ctx.lineTo(tx1, ty1);
                                ctx.stroke();
                            }
                            ctx.restore();
                        }
                    }

                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(1, invTilt);

                    if (isArrow) {
                        const derivArc = Math.cos(p.progress * Math.PI) * Math.PI * (p.arcHeight || 75);
                        const flightAng = Math.atan2(dy - derivArc, dx);
                        ctx.rotate(flightAng);

                        // Outer Glow Halo around Flying Arrow so it pops against all terrain
                        const glowGrad = ctx.createRadialGradient(2, 0, 1, 2, 0, 18);
                        if (p.kind === 'fire_arrow') {
                            glowGrad.addColorStop(0, 'rgba(251, 146, 60, 0.65)');
                            glowGrad.addColorStop(1, 'rgba(251, 146, 60, 0)');
                        } else if (p.kind === 'wind_arrow') {
                            glowGrad.addColorStop(0, 'rgba(52, 211, 153, 0.55)');
                            glowGrad.addColorStop(1, 'rgba(52, 211, 153, 0)');
                        } else {
                            glowGrad.addColorStop(0, 'rgba(254, 240, 138, 0.45)');
                            glowGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
                        }
                        ctx.fillStyle = glowGrad;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 20, 9, 0, 0, Math.PI * 2);
                        ctx.fill();

                        // Swirling Slipstream Vortex Ring around Wind / Phoenix Arrows
                        if (p.kind === 'wind_arrow' || p.kind === 'fire_arrow') {
                            ctx.strokeStyle = p.kind === 'fire_arrow' ? 'rgba(253, 224, 71, 0.85)' : 'rgba(167, 243, 208, 0.85)';
                            ctx.lineWidth = 1.6;
                            const spinOff = Math.sin(this.gameTime * 28 + i) * 3;
                            ctx.beginPath();
                            ctx.ellipse(spinOff, 0, 4, 7.5, 0, 0, Math.PI * 2);
                            ctx.stroke();
                        }

                        // Dark Silhouette Outline + Hardwood / Bamboo Arrow Shaft (26px total length for crisp visibility)
                        ctx.strokeStyle = '#1c1917';
                        ctx.lineWidth = 4.2;
                        ctx.beginPath();
                        ctx.moveTo(-14, 0);
                        ctx.lineTo(11, 0);
                        ctx.stroke();

                        ctx.strokeStyle = '#fde68a';
                        ctx.lineWidth = 2.4;
                        ctx.beginPath();
                        ctx.moveTo(-14, 0);
                        ctx.lineTo(11, 0);
                        ctx.stroke();

                        // Tribal 3-Feather Fletching at the Tail Nock
                        ctx.fillStyle = p.kind === 'fire_arrow' ? '#ef4444' : (p.kind === 'wind_arrow' ? '#10b981' : '#f43f5e');
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(-9, 0);
                        ctx.lineTo(-16, -4.8);
                        ctx.lineTo(-13, 0);
                        ctx.lineTo(-16, 4.8);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // Barbed Broadhead / Obsidian / Flame Arrowhead Tip
                        ctx.fillStyle = p.kind === 'fire_arrow' ? '#fde047' : (p.kind === 'wind_arrow' ? '#6ee7b7' : '#38bdf8');
                        ctx.strokeStyle = '#0f172a';
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(8, -4.2);
                        ctx.lineTo(17, 0);
                        ctx.lineTo(8, 4.2);
                        ctx.lineTo(10.5, 0);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // Supersonic Mach-Cone / Blazing Tip Glint
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                        ctx.lineWidth = 1.4;
                        ctx.beginPath();
                        ctx.moveTo(9, -6.5);
                        ctx.lineTo(18, 0);
                        ctx.lineTo(9, 6.5);
                        ctx.stroke();
                    } else if (p.kind === 'earth') {
                        ctx.rotate(this.gameTime * 9 + i);
                        ctx.fillStyle = '#78350f';
                        ctx.strokeStyle = '#fbbf24';
                        ctx.lineWidth = 1.6;
                        ctx.beginPath();
                        ctx.moveTo(-7, -3);
                        ctx.lineTo(-2, -8);
                        ctx.lineTo(6, -5);
                        ctx.lineTo(8, 3);
                        ctx.lineTo(1, 8);
                        ctx.lineTo(-6, 5);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    } else if (p.kind === 'water') {
                        ctx.rotate(Math.atan2(dy, dx));
                        ctx.strokeStyle = '#38bdf8';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(0, 0, 8, -0.9, 0.9);
                        ctx.stroke();
                        ctx.strokeStyle = '#e0f2fe';
                        ctx.lineWidth = 1.8;
                        ctx.beginPath();
                        ctx.arc(1, 0, 8, -0.6, 0.6);
                        ctx.stroke();
                    } else if (p.kind === 'air') {
                        ctx.strokeStyle = '#a7f3d0';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.ellipse(0, -4, 9, 4, this.gameTime * 12, 0, Math.PI * 2);
                        ctx.ellipse(0, 2, 6, 3, -this.gameTime * 12, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        // Swirling Fireball / Avatar Sphere with Trailing Flame Core
                        ctx.fillStyle = p.color || '#f97316';
                        ctx.beginPath();
                        ctx.arc(0, 0, 7.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#fef08a';
                        ctx.beginPath();
                        ctx.arc(1, -1, 4.0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                // One Ring Gravity Singularity Spheres
                for (let i = 0; i < this.singularities.length; i++) {
                    const sg = this.singularities[i];
                    if (!this.isVisibleInFrustum(sg.x, sg.y, 120)) continue;
                    const rx = wrapDX(this.cam.x, sg.x);
                    const ry = sg.y - this.cam.y;
                    const curR = sg.r + (sg.maxR - sg.r) * (1 - sg.life / 1.35);
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(1, invTilt);
                    ctx.strokeStyle = `rgba(244, 63, 94, ${Math.min(0.9, sg.life)})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, curR * 0.45, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = `rgba(253, 224, 71, ${Math.min(0.85, sg.life)})`;
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, curR * 0.65, curR * 0.25, this.gameTime * 4, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Forked Lightning & Spirit Healing Beams
                for (let i = 0; i < this.lightningArcs.length; i++) {
                    const la = this.lightningArcs[i];
                    const x1 = wrapDX(this.cam.x, la.x1);
                    const y1 = la.y1 - this.cam.y;
                    const x2 = wrapDX(this.cam.x, la.x2);
                    const y2 = la.y2 - this.cam.y;
                    ctx.save();
                    ctx.strokeStyle = la.color || '#f43f5e';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo((x1 + x2) * 0.5 + (Math.random() - 0.5) * 18, (y1 + y2) * 0.5 + (Math.random() - 0.5) * 18);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    ctx.restore();
                }

                for (let i = 0; i < this.healingBeams.length; i++) {
                    const hb = this.healingBeams[i];
                    const x1 = wrapDX(this.cam.x, hb.x1);
                    const y1 = hb.y1 - this.cam.y;
                    const x2 = wrapDX(this.cam.x, hb.x2);
                    const y2 = hb.y2 - this.cam.y;
                    ctx.save();
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.75)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.quadraticCurveTo((x1 + x2) * 0.5, Math.min(y1, y2) - 18, x2, y2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Target Feedback Rings
                for (let i = 0; i < this.targetRings.length; i++) {
                    const tr = this.targetRings[i];
                    const rx = wrapDX(this.cam.x, tr.x);
                    const ry = tr.y - this.cam.y;
                    ctx.save();
                    ctx.strokeStyle = tr.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, tr.maxRadius * (1 - tr.life * 0.5), tr.maxRadius * 0.5 * (1 - tr.life * 0.5), 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                for (let i = 0; i < this.floatTexts.length; i++) {
                    const ft = this.floatTexts[i];
                    const rx = wrapDX(this.cam.x, ft.x);
                    const ry = ft.y - this.cam.y - (1.1 - ft.life) * 28;
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(1, invTilt);
                    ctx.font = 'bold 11px Inter, sans-serif';
                    ctx.fillStyle = ft.color;
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, 0, 0);
                    ctx.restore();
                }
            }

            renderDynamicPointLightsAndEcosystem(ctx, invTilt, light) {
                // 1. Drifting Ground Cloud Shadows
                ctx.save();
                ctx.fillStyle = 'rgba(0, 0, 0, 0.14)';
                for (let i = 0; i < this.clouds.length; i++) {
                    const cl = this.clouds[i];
                    if (!this.isVisibleInFrustum(cl.x, cl.y, 180)) continue;
                    const rx = wrapDX(this.cam.x, cl.x);
                    const ry = cl.y - this.cam.y;
                    ctx.beginPath();
                    ctx.ellipse(rx, ry, cl.rx, cl.ry, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // 2. Soaring Prehistoric Eagles & Scattering Bird Flocks
                for (let i = 0; i < this.eagles.length; i++) {
                    const eg = this.eagles[i];
                    if (!this.isVisibleInFrustum(eg.x, eg.y, 90)) continue;
                    const rx = wrapDX(this.cam.x, eg.x);
                    const ry = eg.y - this.cam.y;
                    const flap = Math.sin(eg.wing) * 6;
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(1, invTilt);
                    ctx.strokeStyle = '#1c1917';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(-9, -42 + flap);
                    ctx.quadraticCurveTo(0, -46, 9, -42 + flap);
                    ctx.stroke();
                    ctx.restore();
                }

                // 3. Additive Point-Light Illumination Shader (Sunset, Night, Blood Moon & Crimson Eclipse)
                if (light && (light.isNight || light.isBloodMoon || this.lightingMode === 2 || this.crimsonEclipseTimer > 0)) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'lighter';
                    const drawGlow = (wx, wy, rad, rgba) => {
                        if (!this.isVisibleInFrustum(wx, wy, rad)) return;
                        const rx = wrapDX(this.cam.x, wx);
                        const ry = wy - this.cam.y;
                        const g = ctx.createRadialGradient(rx, ry, 4, rx, ry, rad);
                        g.addColorStop(0, rgba);
                        g.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(rx, ry, rad, 0, Math.PI * 2);
                        ctx.fill();
                    };

                    for (let i = 0; i < this.buildings.length; i++) {
                        const b = this.buildings[i];
                        if (b.built) drawGlow(b.x, b.y - 10, b.radius * 2.1, 'rgba(251, 146, 60, 0.22)');
                    }
                    for (let i = 0; i < this.villagers.length; i++) {
                        const u = this.villagers[i];
                        if (u.isT101s) {
                            drawGlow(u.x, u.y - 24, 110, 'rgba(244, 63, 94, 0.34)');
                        } else if (u.bender === 'fire' || u.bender === 'avatar') {
                            drawGlow(u.x, u.y - 18, 75, 'rgba(251, 146, 60, 0.26)');
                        }
                    }
                    ctx.restore();
                }
            }

            renderVolumetricGodRays(ctx, W, H, light) {
                ctx.save();
                const col = light && light.isBloodMoon ? 'rgba(244, 63, 94, 0.06)' : 'rgba(254, 240, 138, 0.05)';
                ctx.fillStyle = col;
                for (let i = 0; i < this.godRays.length; i++) {
                    const g = this.godRays[i];
                    const x0 = ((g.sx + Math.sin(this.gameTime * g.speed + g.phase) * 0.05) * W);
                    ctx.beginPath();
                    ctx.moveTo(x0, 0);
                    ctx.lineTo(x0 + g.width, 0);
                    ctx.lineTo(x0 + g.width + 180, H);
                    ctx.lineTo(x0 + 180, H);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }

            renderContinentalWeatherShader(ctx, W, H) {
                const cIdx = Math.floor(wrapX(this.cam.x) / 1600) % CONTINENTS.length;
                ctx.save();
                ctx.fillStyle = cIdx === 4 ? 'rgba(224, 242, 254, 0.7)' : (cIdx === 2 ? 'rgba(251, 146, 60, 0.65)' : 'rgba(186, 230, 253, 0.35)');
                for (let i = 0; i < this.weatherParticles.length; i++) {
                    const wp = this.weatherParticles[i];
                    const px = ((wp.x + this.gameTime * wp.spdX) % 1 + 1) % 1 * W;
                    const py = ((wp.y + this.gameTime * wp.spdY) % 1 + 1) % 1 * H;
                    ctx.beginPath();
                    ctx.arc(px, py, wp.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            renderHD2DPostProcess(ctx, W, H, light) {
                ctx.save();
                const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.32, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
                vig.addColorStop(0, 'rgba(0,0,0,0)');
                vig.addColorStop(1, this.crimsonEclipseTimer > 0 || (light && light.isBloodMoon) ? 'rgba(136, 19, 55, 0.38)' : 'rgba(9, 13, 22, 0.35)');
                ctx.fillStyle = vig;
                ctx.fillRect(0, 0, W, H);
                ctx.restore();
            }

            render3DSphericalGlobe(ctx, W, H) {
                ctx.fillStyle = '#050811';
                ctx.fillRect(0, 0, W, H);

                // Twinkling Starfield
                for (let i = 0; i < this.globeStars.length; i++) {
                    const st = this.globeStars[i];
                    ctx.fillStyle = `rgba(255,255,255,${0.4 + Math.sin(this.gameTime * 2 + st.phase) * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(st.x * W, st.y * H, st.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                const cx = W * 0.5;
                const cy = H * 0.5;
                const R = Math.min(W, H) * 0.34;

                const oceanGrad = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
                oceanGrad.addColorStop(0, '#0284c7');
                oceanGrad.addColorStop(1, '#082f49');
                ctx.fillStyle = oceanGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, R, 0, Math.PI * 2);
                ctx.fill();

                for (let c = 0; c < CONTINENTS.length; c++) {
                    const cont = CONTINENTS[c];
                    const lon = (c / CONTINENTS.length) * Math.PI * 2 + this.globeYaw;
                    const vis = Math.cos(lon);
                    if (vis < -0.1) continue;
                    const gx = cx + Math.sin(lon) * R * 0.72;
                    const gy = cy + (c % 2 === 0 ? -1 : 1) * R * 0.22;
                    ctx.fillStyle = cont.color;
                    ctx.strokeStyle = cont.accent;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(gx, gy, R * 0.26 * Math.max(0.25, vis), R * 0.22, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.font = 'bold 10px Inter, sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.fillText(cont.name, gx, gy - 4);
                    ctx.fillStyle = '#fde047';
                    ctx.fillText(`${cont.popBillions}B Pop`, gx, gy + 10);
                }
            }

            renderMinimap() {
                if (!this.miniCtx || !this.miniCanvas) return;
                const mctx = this.miniCtx;
                const mw = this.miniCanvas.width;
                const mh = this.miniCanvas.height;
                mctx.clearRect(0, 0, mw, mh);

                for (let c = 0; c < CONTINENTS.length; c++) {
                    const cont = CONTINENTS[c];
                    mctx.fillStyle = cont.color;
                    mctx.fillRect((cont.xStart / WORLD_W) * mw, 0, (1600 / WORLD_W) * mw, mh);
                }

                mctx.fillStyle = '#0284c7';
                mctx.fillRect(0, (2620 / WORLD_H) * mh, mw, 3);

                for (let i = 0; i < this.villagers.length; i++) {
                    const u = this.villagers[i];
                    mctx.fillStyle = u.isT101s ? '#fde047' : '#4ade80';
                    mctx.fillRect((u.x / WORLD_W) * mw - 1.5, (u.y / WORLD_H) * mh - 1.5, 3, 3);
                }
                for (let i = 0; i < this.enemies.length; i++) {
                    const e = this.enemies[i];
                    mctx.fillStyle = '#f43f5e';
                    mctx.fillRect((e.x / WORLD_W) * mw - 1.5, (e.y / WORLD_H) * mh - 1.5, 3, 3);
                }

                mctx.strokeStyle = '#ffffff';
                mctx.lineWidth = 1.2;
                mctx.strokeRect((this.cam.x / WORLD_W) * mw - 8, (this.cam.y / WORLD_H) * mh - 6, 16, 12);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.game = new PrehistoricPlanetaryGame();
        });
    })();
    </script>
