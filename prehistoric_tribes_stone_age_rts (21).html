<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Prehistoric Tribes: 2.5D Planetary Empire & The One Ring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        .tribal-font {
            font-family: 'Fredoka', cursive, sans-serif;
            letter-spacing: 0.02em;
        }
        #gameCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            touch-action: none;
        }
        .hud-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-interactive {
            pointer-events: auto;
        }
        .stone-panel {
            background: rgba(20, 17, 15, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(168, 162, 158, 0.35);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
        }
        .wood-btn {
            background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
            border: 1.5px solid #fbbf24;
            box-shadow: 0 2px 0 #451a03;
            transition: transform 0.08s ease, filter 0.12s ease;
        }
        .wood-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #451a03;
        }
        .stone-btn {
            background: linear-gradient(180deg, #44403c 0%, #292524 100%);
            border: 1.5px solid #78716c;
            box-shadow: 0 2px 0 #0c0a09;
            transition: transform 0.08s ease, filter 0.12s ease;
        }
        .stone-btn:active {
            transform: translateY(2px);
        }
        .ring-btn {
            background: linear-gradient(180deg, #991b1b 0%, #450a0a 100%);
            border: 1.5px solid #fde047;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.6), 0 2px 0 #270505;
        }
        .imperial-btn {
            background: linear-gradient(180deg, #6d28d9 0%, #3b0764 100%);
            border: 1.5px solid #c084fc;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.45), 0 2px 0 #1e0536;
        }
        .active-btn {
            outline: 2px solid #fde047;
            filter: brightness(1.15);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <!-- FULLSCREEN 2.5D PLANETARY & GLOBE CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD OVERLAY LAYER -->
    <div class="hud-layer p-1.5 sm:p-2">

        <!-- TOP BAR: EPOCH AGE, RESOURCES, PLANETARY POP & ENGINE CONTROLS -->
        <div class="flex flex-col gap-1 w-full">
            <div class="hud-interactive stone-panel rounded-xl px-2 py-1 flex items-center justify-between gap-1.5 overflow-x-auto no-scrollbar">

                <!-- AGE OF EMPIRES EPOCH ADVANCEMENT BUTTON -->
                <div class="flex items-center gap-1.5 shrink-0">
                    <button id="btnAdvanceAge" onclick="game.advanceAge()" class="wood-btn px-2 py-0.5 rounded-lg flex items-center gap-1 text-amber-100 text-[11px] font-bold" title="Advance Civilization Epoch">
                        <span id="ageIcon">🪨</span>
                        <span id="ageTitle" class="tribal-font tracking-wide">Age I: Stone</span>
                        <span id="ageUpgradeHint" class="text-[9px] bg-black/50 px-1 rounded text-amber-300">⬆️Up</span>
                    </button>
                </div>

                <!-- STOCKPILE & SUPPLY CHAIN RESOURCES -->
                <div class="flex items-center gap-1 sm:gap-1.5 text-[11px] font-bold shrink-0">
                    <div class="flex items-center gap-1 bg-stone-900/90 px-1.5 py-0.5 rounded-md border border-amber-700/40" title="Timber">
                        <span>🪵</span><span id="resWood" class="text-amber-300">250</span>
                    </div>
                    <div class="flex items-center gap-1 bg-stone-900/90 px-1.5 py-0.5 rounded-md border border-stone-500/40" title="Stone">
                        <span>🪨</span><span id="resStone" class="text-stone-200">200</span>
                    </div>
                    <div class="flex items-center gap-1 bg-stone-900/90 px-1.5 py-0.5 rounded-md border border-orange-500/40" title="Roasted Sabre-Ribs">
                        <span>🍖</span><span id="resFood" class="text-orange-300">220</span>
                    </div>
                    <div class="flex items-center gap-1 bg-stone-900/90 px-1.5 py-0.5 rounded-md border border-yellow-500/40" title="Gold">
                        <span>🪙</span><span id="resGold" class="text-yellow-300">120</span>
                    </div>
                    <div class="flex items-center gap-1 bg-stone-900/90 px-1.5 py-0.5 rounded-md border border-red-500/40" title="Forged Weapons">
                        <span>⚔️</span><span id="resWeapons" class="text-red-300">15</span>
                    </div>
                    <div class="flex items-center gap-1 bg-indigo-950/90 px-2 py-0.5 rounded-md border border-indigo-400/50" title="Planetary Empire Population vs Rival Hordes">
                        <span>🌍</span>
                        <span id="resEmpirePop" class="text-indigo-200">1.48B</span>
                        <span class="text-stone-400 text-[9px]">vs</span>
                        <span id="resRivalPop" class="text-rose-400">3.80B</span>
                    </div>
                </div>

                <!-- TOP RIGHT: GLOBE, LIGHTING, WEATHER, 2.5D TILT, LASSO, FULLSCREEN & SAVE -->
                <div class="flex items-center gap-1 shrink-0">
                    <button id="btnGlobeToggle" onclick="game.toggleGlobeMode()" class="imperial-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-purple-100 flex items-center gap-1" title="Toggle 3D Rotating Spherical Earth Globe">
                        <span>🌐</span><span id="globeBtnLabel">3D Globe</span>
                    </button>

                    <button id="btnLightingMode" onclick="game.cycleLightingMode()" class="stone-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-200 flex items-center gap-1" title="Cycle Day / Sunset / Night / Blood Moon">
                        <span id="lightingIcon">🌓</span><span id="lightingLabel">Cycle</span>
                    </button>

                    <button id="btnWeatherToggle" onclick="game.toggleWeather()" class="stone-btn active-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-sky-200 flex items-center gap-1" title="Toggle Continental Weather Shaders">
                        <span>🌦️</span><span id="weatherBtnLabel">Weather</span>
                    </button>

                    <button id="btnCameraTilt" onclick="game.cycleCameraTilt()" class="stone-btn active-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-indigo-200 flex items-center gap-1" title="Cycle 2.5D Isometric Camera Tilt">
                        <span>📐</span><span id="tiltModeLabel">2.5D 55°</span>
                    </button>

                    <button id="btnHd2dToggle" onclick="game.toggleHd2dShader()" class="imperial-btn active-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-200 flex items-center gap-1" title="Toggle HD-2D Rim-Light, IK & Bloom Shader">
                        <span>✨</span><span id="hd2dBtnLabel">HD-2D</span>
                    </button>

                    <button id="btnLassoMode" onclick="game.toggleLassoMode()" class="stone-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-200 flex items-center gap-1" title="Toggle Box-Select Lasso vs Camera Pan">
                        <span>🔲</span><span id="lassoModeLabel">Pan</span>
                    </button>

                    <button onclick="game.toggleFullscreenLandscape()" class="stone-btn px-1.5 py-0.5 rounded-lg text-[10px] text-amber-300 font-bold" title="Fullscreen">⛶</button>

                    <button id="btnSaveGame" onclick="game.saveGameManual()" class="stone-btn px-1.5 py-0.5 rounded-lg text-[10px] text-emerald-300 font-bold" title="Save">💾</button>

                    <button id="btnResetGame" onclick="game.resetGameTap()" class="stone-btn px-1.5 py-0.5 rounded-lg text-[10px] text-rose-300 font-bold" title="Tap twice to Reset">🗑️</button>
                </div>
            </div>

            <!-- SUB-BAR: QUICK HERO & ARMY COMMANDS + TELEMETRY -->
            <div class="flex items-center justify-between gap-1 pointer-events-none">
                <div class="hud-interactive flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5">
                    <button onclick="game.focusHeroT101s()" class="ring-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-yellow-200 flex items-center gap-1 shrink-0">
                        <span>💍</span><span>t101s (One Ring)</span>
                    </button>
                    <button onclick="game.focusCampfire()" class="stone-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-orange-200 shrink-0">
                        🔥 Hearth
                    </button>
                    <button onclick="game.selectAllWarriors()" class="stone-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-sky-200 shrink-0">
                        🛡️ All Army (<span id="armyCountLabel">8</span>)
                    </button>
                    <button onclick="game.trainCommander()" class="wood-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-100 shrink-0">
                        ⚔️ +Commander (40🍖 20🪙)
                    </button>
                    <button onclick="game.trainSiegeEngine()" class="imperial-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-200 shrink-0">
                        🪨 +Siege (70🪵 60🪨)
                    </button>
                    <button onclick="game.triggerSkyArrowVolley()" class="wood-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-yellow-200 border-yellow-400 shrink-0" title="Command all Archers & Watchtowers to loose a massive synchronized Arrow Volley!">
                        🏹 Sky-Volley
                    </button>
                    <button onclick="game.focusActiveDuel()" class="ring-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-100 shrink-0" title="Zoom in on active combat choreography">
                        🎥 Duel Cam
                    </button>
                    <button onclick="game.triggerMartialFlightShowcase()" class="imperial-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-emerald-200 shrink-0" title="Trigger a synchronized Martial Arts, Dodge, Block & Supersonic Flight Showcase!">
                        🥋 Martial & Flight Kata
                    </button>
                    <button onclick="game.toggleDiplomacyPanel()" class="wood-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-yellow-200 border-yellow-400 shrink-0" title="Open AI Players & Diplomacy Command">
                        👑 AI Players (<span id="aiEmpiresCountLabel">5</span>)
                    </button>
                    <button onclick="game.triggerAllOutCharge()" class="wood-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-red-100 border-red-400 shrink-0">
                        🔥 All-Out War!
                    </button>
                </div>

                <div class="stone-panel px-2 py-0.5 rounded-lg text-[9px] font-mono text-emerald-300 hidden md:flex items-center gap-2 shrink-0">
                    <span id="perfFps">60 FPS</span>
                    <span class="text-stone-500">|</span>
                    <span id="perfContinent" class="text-amber-300">Cradle of Aethelgard</span>
                </div>
            </div>

            <!-- AI PLAYERS & DIPLOMACY PANEL (TOGGLEABLE) -->
            <div id="diplomacyPanel" class="hidden hud-interactive stone-panel rounded-xl p-2 mt-1 border border-amber-400/50 max-w-3xl self-center w-full shadow-2xl">
                <div class="flex items-center justify-between border-b border-stone-700 pb-1 mb-1.5">
                    <div class="flex items-center gap-1.5">
                        <span class="text-sm">👑</span>
                        <span class="text-xs font-bold text-amber-200 tribal-font">Planetary AI Players & Sovereign Diplomacy</span>
                        <span class="text-[10px] text-stone-400 hidden sm:inline">• AI Empires harvest, build cities, advance Ages & wage war</span>
                    </div>
                    <button onclick="game.toggleDiplomacyPanel()" class="stone-btn px-2 py-0.5 rounded text-[10px] font-bold text-rose-300">✖ Close</button>
                </div>
                <div id="aiPlayersList" class="grid grid-cols-1 sm:grid-cols-5 gap-1.5 text-[10px]"></div>
            </div>
        </div>

        <!-- CENTER BANNER TOAST -->
        <div id="eventBanner" class="self-center stone-panel px-3 py-1 rounded-full border border-amber-400/60 text-amber-100 text-xs font-bold shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-1.5">
            <span id="bannerIcon">💍</span>
            <span id="bannerText">Welcome to Prehistoric Tribes!</span>
        </div>

        <!-- BUILD PLACEMENT CONFIRMATION BAR -->
        <div id="buildConfirmBar" class="hidden self-center hud-interactive stone-panel px-3 py-1.5 rounded-xl border-2 border-emerald-400 flex items-center gap-2 mb-1">
            <span id="buildConfirmTitle" class="text-xs font-bold text-emerald-200">Tap ground to place</span>
            <button onclick="game.confirmBuildPlacement()" class="wood-btn px-2.5 py-1 rounded-lg text-xs font-bold text-white border-emerald-300">✅ Build Here</button>
            <button onclick="game.cancelBuildMode()" class="stone-btn px-2 py-1 rounded-lg text-xs font-bold text-rose-300">✖ Cancel</button>
        </div>

        <!-- BOTTOM DOCK: UNIT INSPECTOR + SETTLERS & AOE BUILD MENU + MINIMAP -->
        <div class="flex items-end justify-between gap-1.5 w-full">

            <!-- SELECTED UNIT / HERO t101s / BENDER INSPECTOR -->
            <div id="inspectorPanel" class="hud-interactive stone-panel rounded-xl p-1.5 flex items-center gap-2 max-w-[54vw] sm:max-w-md overflow-x-auto no-scrollbar">
                <div class="flex items-center gap-1.5 shrink-0">
                    <div id="inspAvatar" class="w-8 h-8 rounded-lg bg-amber-900/70 border border-amber-400 flex items-center justify-center text-base">💍</div>
                    <div>
                        <div class="flex items-center gap-1">
                            <span id="inspName" class="text-xs font-bold text-amber-200 tribal-font">t101s</span>
                            <span id="inspRoleBadge" class="text-[9px] px-1 py-0.2 rounded bg-rose-900/90 text-yellow-200 border border-yellow-400/50">One Ring</span>
                        </div>
                        <div class="flex items-center gap-2 text-[10px] text-stone-300">
                            <span id="inspHp">HP 680/680</span>
                            <span id="inspStyle" class="text-amber-300">💍 Blood-Art</span>
                        </div>
                    </div>
                </div>

                <!-- DYNAMIC ACTION BUTTONS -->
                <div class="flex items-center gap-1 shrink-0">
                    <button id="btnT101sFlight" onclick="game.toggleHeroFlight()" class="ring-btn px-2 py-1 rounded-lg text-[10px] font-bold text-yellow-100 flex items-center gap-1">
                        <span>🪽</span><span id="flightStateLabel">Soaring</span>
                    </button>
                    <button id="btnT101sControlMode" onclick="game.toggleRingControlMode()" class="ring-btn active-btn px-2 py-1 rounded-lg text-[10px] font-bold text-amber-200 flex items-center gap-1" title="Toggle Non-Lethal Human Puppet Control vs Lethal Crush">
                        <span>👑</span><span id="ringModeLabel">Control: Spare</span>
                    </button>
                    <button id="btnT101sDominion" onclick="game.triggerRingDominion()" class="ring-btn px-2 py-1 rounded-lg text-[10px] font-bold text-rose-100 flex items-center gap-1" title="Mass Bloodbend & Puppet Nearby Humans">
                        <span>🩸</span><span>Dominion</span>
                    </button>
                    <button id="btnT101sConvert" onclick="game.convertControlledHumans()" class="imperial-btn px-2 py-1 rounded-lg text-[10px] font-bold text-emerald-200 flex items-center gap-1" title="Permanently Recruit Controlled Humans into Your Tribe">
                        <span>🤝</span><span>Recruit</span>
                    </button>
                    <button onclick="game.cycleSelectedFightingStyle()" class="stone-btn px-2 py-1 rounded-lg text-[10px] font-bold text-amber-200">
                        🥋 Style
                    </button>
                    <button onclick="game.awakenSelectedBender()" class="stone-btn px-2 py-1 rounded-lg text-[10px] font-bold text-cyan-200">
                        🌀 Awaken
                    </button>
                    <button onclick="game.ascendSelectedToAvatar()" class="imperial-btn px-2 py-1 rounded-lg text-[10px] font-bold text-yellow-200">
                        🌟 Avatar
                    </button>
                </div>
            </div>

            <!-- BUILD DOCK -->
            <div class="hud-interactive stone-panel rounded-xl p-1 flex items-center gap-1 overflow-x-auto no-scrollbar flex-1">
                <button id="btnMountsToggle" onclick="game.toggleMountsGlobal()" class="wood-btn px-2 py-1 rounded-lg flex flex-col items-center shrink-0 min-w-[50px]">
                    <span class="text-xs">🦣</span>
                    <span id="mountsBtnLabel" class="text-[9px] font-bold text-amber-100">Mounts</span>
                </button>
                <div id="buildButtonsContainer" class="flex items-center gap-1"></div>
            </div>

            <!-- WORLD WRAP MINIMAP -->
            <div class="hud-interactive stone-panel rounded-xl p-1 shrink-0 hidden sm:flex flex-col items-center">
                <div class="flex items-center justify-between w-full px-1 mb-0.5 text-[9px] text-amber-200 font-bold">
                    <span>🗺️ 6-Continent Map</span>
                    <span id="waveTimerLabel" class="text-rose-400">Raid: 55s</span>
                </div>
                <canvas id="minimapCanvas" width="168" height="68" class="rounded-lg border border-stone-600 cursor-pointer bg-slate-950"></canvas>
            </div>
        </div>
    </div>

        function wrapX(x) {
            return ((x % WORLD_W) + WORLD_W) % WORLD_W;
        }
        function wrapDX(x1, x2) {
            let dx = x2 - x1;
            if (dx > WORLD_W * 0.5) dx -= WORLD_W;
            if (dx < -WORLD_W * 0.5) dx += WORLD_W;
            return dx;
        }
        function wrappedDist(x1, y1, x2, y2) {
            return Math.hypot(wrapDX(x1, x2), y2 - y1);
        }

        // 2-Bone Analytical Inverse Kinematics Solver (Hip->Knee->Ankle & Shoulder->Elbow->Wrist)
        function solve2BoneIK(x0, y0, tx, ty, L1, L2, bendDir = 1) {
            const dx = tx - x0;
            const dy = ty - y0;
            const rawDist = Math.hypot(dx, dy) || 0.001;
            const maxReach = (L1 + L2) * 0.995;
            const minReach = Math.abs(L1 - L2) + 0.05;
            const d = Math.max(minReach, Math.min(maxReach, rawDist));

            const baseAng = Math.atan2(dy, dx);
            const cosAlpha = Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
            const alpha = Math.acos(cosAlpha);
            const jointAng = baseAng + bendDir * alpha;

            const jx = x0 + Math.cos(jointAng) * L1;
            const jy = y0 + Math.sin(jointAng) * L1;
            const ex = x0 + (dx / rawDist) * d;
            const ey = y0 + (dy / rawDist) * d;
            return { jx, jy, ex, ey, endAngle: Math.atan2(ey - jy, ex - jx) };
        }

        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            play(type) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    if (type === 'ring') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(520, now);
                        osc.frequency.exponentialRampToValueAtTime(190, now + 0.3);
                        gain.gain.setValueAtTime(0.11, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                    } else if (type === 'horn') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(140, now);
                        osc.frequency.linearRampToValueAtTime(220, now + 0.38);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                    } else if (type === 'chop') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(180, now);
                        osc.frequency.exponentialRampToValueAtTime(60, now + 0.09);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.09);
                        osc.start(now);
                        osc.stop(now + 0.09);
                    } else if (type === 'bow') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(420, now);
                        osc.frequency.exponentialRampToValueAtTime(140, now + 0.16);
                        gain.gain.setValueAtTime(0.09, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.16);
                        osc.start(now);
                        osc.stop(now + 0.16);
                    } else if (type === 'arrow_hit') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(210, now);
                        osc.frequency.exponentialRampToValueAtTime(55, now + 0.08);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.08);
                    } else {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(110, now + 0.11);
                        gain.gain.setValueAtTime(0.06, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.11);
                        osc.start(now);
                        osc.stop(now + 0.11);
                    }
                } catch (e) {}
            }
        }

        class SpatialGrid {
            constructor(cellSize = 320) {
                this.cellSize = cellSize;
                this.buckets = new Map();
            }
            clear() {
                this.buckets.clear();
            }
            _key(cx, cy) {
                return `${cx},${cy}`;
            }
            insert(entity) {
                const cx = Math.floor(wrapX(entity.x) / this.cellSize);
                const cy = Math.floor(entity.y / this.cellSize);
                const k = this._key(cx, cy);
                let arr = this.buckets.get(k);
                if (!arr) {
                    arr = [];
                    this.buckets.set(k, arr);
                }
                arr.push(entity);
            }
            queryRadius(x, y, radius, filterFn = null) {
                const results = [];
                const cellSpan = Math.ceil(radius / this.cellSize);
                const centerCX = Math.floor(wrapX(x) / this.cellSize);
                const centerCY = Math.floor(y / this.cellSize);
                const maxCols = Math.ceil(WORLD_W / this.cellSize);

                for (let dx = -cellSpan; dx <= cellSpan; dx++) {
                    const cx = ((centerCX + dx) % maxCols + maxCols) % maxCols;
                    for (let dy = -cellSpan; dy <= cellSpan; dy++) {
                        const cy = centerCY + dy;
                        const bucket = this.buckets.get(this._key(cx, cy));
                        if (!bucket) continue;
                        for (let i = 0; i < bucket.length; i++) {
                            const e = bucket[i];
                            if (wrappedDist(x, y, e.x, e.y) <= radius) {
                                if (!filterFn || filterFn(e)) results.push(e);
                            }
                        }
                    }
                }
                return results;
            }
        }

            screenToWorld(sx, sy) {
                const rx = (sx - this.canvas.width * 0.5) / this.cam.zoom;
                const ry = (sy - this.canvas.height * 0.5) / (this.cam.zoom * this.camTiltY);
                return {
                    x: wrapX(this.cam.x + rx),
                    y: Math.max(120, Math.min(WORLD_H - 120, this.cam.y + ry))
                };
            }

            worldToScreen(wx, wy) {
                const dx = wrapDX(this.cam.x, wx);
                const dy = wy - this.cam.y;
                return {
                    x: this.canvas.width * 0.5 + dx * this.cam.zoom,
                    y: this.canvas.height * 0.5 + dy * this.cam.zoom * this.camTiltY
                };
            }

            getRiverCenterY(x) {
                const localX = wrapX(x) % 1600;
                return 2650 + Math.sin((localX / 1600) * Math.PI * 2) * 32;
            }

            getTerrainElevation(x, y) {
                const localX = wrapX(x) % 1600;
                if (y < 1820) return 32;
                if (y >= 1820 && y <= 1900) {
                    const ramps = [340, 820, 1280];
                    for (let i = 0; i < ramps.length; i++) {
                        if (Math.abs(localX - ramps[i]) < 55) {
                            return Math.max(0, ((1900 - y) / 80) * 32);
                        }
                    }
                }
                const rY = this.getRiverCenterY(x);
                if (Math.abs(y - rY) < 62 && (Math.abs(localX - 480) < 42 || Math.abs(localX - 1140) < 42)) {
                    return 16;
                }
                return 0;
            }

            isPointNearRoad(x, y) {
                for (let i = 0; i < this.roads.length; i++) {
                    const r = this.roads[i];
                    const mx = (r.x1 + r.x2) * 0.5;
                    const my = (r.y1 + r.y2) * 0.5;
                    if (wrappedDist(x, y, mx, my) < 95) return true;
                }
                return false;
            }

            advanceAge() {
                if (this.ageLevel >= EPOCHS.length - 1) {
                    this.showBanner('👑', 'Already at Maximum Imperial Avatar Age!');
                    return;
                }
                const cur = EPOCHS[this.ageLevel];
                const cost = cur.cost;
                if (this.resources.food < cost.food || this.resources.wood < cost.wood || this.resources.stone < cost.stone || this.resources.gold < cost.gold) {
                    this.showBanner('⚠️', `Need ${cost.food}🍖 ${cost.wood}🪵 ${cost.stone}🪨 ${cost.gold}🪙 to Advance Age!`);
                    return;
                }
                this.resources.food -= cost.food;
                this.resources.wood -= cost.wood;
                this.resources.stone -= cost.stone;
                this.resources.gold -= cost.gold;
                this.ageLevel++;
                const nextEp = EPOCHS[this.ageLevel];
                this.villagers.forEach(u => {
                    u.maxHp = Math.round(u.maxHp * 1.22);
                    u.hp = u.maxHp;
                    u.atk = Math.round(u.atk * 1.22);
                });
                this.sfx.play('horn');
                this.addScreenShake(8, 0.35);
                this.showBanner(nextEp.icon, `Advanced to ${nextEp.name}! All Units & Architecture Upgraded!`);
                this.updateHUD();
                this.saveGame();
            }

                this.showBanner('💍', 'Focused on Hero t101s — Bearer of The One Ring!');
            }

            focusCampfire() {
                this.globeMode = false;
                this.cam.targetX = 840;
                this.cam.targetY = 2340;
                this.cam.targetZoom = 1.05;
                this.showBanner('🔥', 'Centered on Tribal Hearth Campfire');
            }

            selectAllWarriors() {
                this.selectedIds = this.villagers.map(u => u.id);
                this.updateInspector();
                this.showBanner('🛡️', `Selected All ${this.villagers.length} Tribe Heroes, Benders & Commanders!`);

            trainCommander() {
                if (this.resources.food < 40 || this.resources.gold < 20) {
                    this.showBanner('⚠️', 'Need 40🍖 Food & 20🪙 Gold to recruit a Mounted Legion Commander!');
                    return;
                }
                this.resources.food -= 40;
                this.resources.gold -= 20;
                const styles = ['berserker', 'phalanx', 'kungfu', 'archery', 'juggernaut'];
                const st = styles[this.villagers.length % styles.length];
                const mount = this.mountsEnabled ? (this.villagers.length % 2 === 0 ? 'mammoth' : 'sabre') : null;
                const cmd = this.createVillager({
                    name: `Commander #${this.villagers.length + 1}`,
                    role: 'Legion Commander',
                    isCommander: true,
                    mountType: mount,
                    fightingStyle: st,
                    x: 840 + (Math.random() - 0.5) * 120,
                    y: 2420 + (Math.random() - 0.5) * 60
                });
                this.villagers.push(cmd);
                this.empirePopBillions = +(this.empirePopBillions + 0.12).toFixed(2);
                this.selectedIds = [cmd.id];
                this.sfx.play('horn');
                this.updateHUD();
                this.updateInspector();
                this.showBanner('⚔️', `Recruited ${cmd.name} (+120M Legion Squad)!`);
            }

            trainSiegeEngine() {
                if (this.resources.wood < 70 || this.resources.stone < 60) {
                    this.showBanner('⚠️', 'Need 70🪵 Wood & 60🪨 Stone to construct a 2.5D Siege Engine!');
                    return;
                }
                this.resources.wood -= 70;
                this.resources.stone -= 60;
                const kind = this.siegeEngines.length % 2 === 0 ? 'trebuchet' : 'ram';
                const se = this.createSiegeEngine({
                    kind,
                    x: 840 + (Math.random() - 0.5) * 120,
                    y: 2380 + (Math.random() - 0.5) * 60
                });
                this.siegeEngines.push(se);
                this.selectedIds = [se.id];
                this.sfx.play('horn');
                this.updateHUD();
                this.showBanner('🪨', `Constructed 2.5D ${se.name}!`);
            }

            triggerSkyArrowVolley() {
                this.globeMode = false;
                let primaryTarget = this.enemies.find(e => e.isHostileToPlayer !== false && e.hp > 0) ||
                                    this.enemies[0] ||
                                    this.strongholds[0];
                const archers = this.villagers.filter(u => u.fightingStyle === 'archery' || u.isCommander || u.isT101s);
                const shooters = archers.length > 0 ? archers : this.villagers;

                const targetX = primaryTarget ? primaryTarget.x : wrapX(this.cam.x + 240);
                const targetY = primaryTarget ? primaryTarget.y : this.cam.y;

                shooters.forEach((u, idx) => {
                    const dx = wrapDX(u.x, targetX);
                    const dy = targetY - u.y;
                    if (Math.abs(dx) > 2) u.facing = dx >= 0 ? 1 : -1;
                    u.moveAngle = Math.atan2(dy, dx);
                    u.aimPitch = -0.35;
                    u.swingAnim = 1.0;
                    u.bowDrawAnim = 1.0;

                    const arrowTypes = ['arrow', 'wind_arrow', 'fire_arrow'];
                    for (let a = 0; a < 3; a++) {
                        const spreadX = (Math.random() - 0.5) * 90 + (a - 1) * 24;
                        const spreadY = (Math.random() - 0.5) * 60;
                        const tx = wrapX(targetX + spreadX);
                        const ty = Math.max(200, Math.min(WORLD_H - 200, targetY + spreadY));
                        const dist = Math.max(120, wrappedDist(u.x, u.y, tx, ty));
                        const aKind = arrowTypes[(idx + a) % arrowTypes.length];
                        this.projectiles.push({
                            x: u.x + (u.facing || 1) * 10,
                            y: u.y - 22 - (u.terrainZ || 0),
                            groundY0: u.y,
                            tx,
                            ty,
                            targetId: primaryTarget ? primaryTarget.id : null,
                            isEnemyProj: false,
                            kind: aKind,
                            color: aKind === 'fire_arrow' ? '#f97316' : (aKind === 'wind_arrow' ? '#34d399' : '#fde047'),
                            dmg: u.atk * 0.85,
                            progress: 0,
                            speed: Math.max(0.85, Math.min(1.65, 310 / dist)),
                            arcHeight: 115 + a * 26 + (idx % 3) * 18,
                            trail: []
                        });
                    }
                });

                this.sfx.play('bow');
                this.showBanner('🏹', `SKY-VOLLEY UNLEASHED! ${shooters.length * 3} High-Arc Arrows Racing Across the Sky!`);
            }

            focusActiveDuel() {
                this.globeMode = false;
                let bestPair = null;
                let bestDist = Infinity;
                for (let i = 0; i < this.villagers.length; i++) {
                    const u = this.villagers[i];
                    for (let j = 0; j < this.enemies.length; j++) {
                        const e = this.enemies[j];
                        const d = wrappedDist(u.x, u.y, e.x, e.y);
                        if (d < bestDist) {
                            bestDist = d;
                            bestPair = { u, e };
                        }
                    }
                }
                if (bestPair && bestDist < 360) {
                    this.selectedIds = [bestPair.u.id];
                    this.cam.targetX = wrapX(bestPair.u.x + wrapDX(bestPair.u.x, bestPair.e.x) * 0.5);
                    this.cam.targetY = (bestPair.u.y + bestPair.e.y) * 0.5;
                    this.cam.targetZoom = 1.42;
                    this.updateInspector();
                    this.showBanner('🎥', `Duel Cam Locked: ${bestPair.u.name} vs ${bestPair.e.name}!`);
                } else {
                    this.triggerAllOutCharge();
                    const hero = this.villagers.find(v => v.isT101s) || this.villagers[0];
                    if (hero) {
                        this.cam.targetX = hero.x;
                        this.cam.targetY = hero.y;
                        this.cam.targetZoom = 1.32;
                    }
                    this.showBanner('🎥', 'Duel Cam Active — Charging Nearest Enemy Squad!');
                }
            }

            triggerMartialFlightShowcase() {
                this.globeMode = false;
                const forms = ['hundred_palms', 'crane_kick', 'hurricane_kick', 'dragon_uppercut', 'leg_sweep', 'avatar_kata'];
                const dodges = ['backflip', 'sidestep', 'roll', 'matrix_lean', 'air_spin'];
                const blocks = ['shield_wall', 'cross_blade', 'palm_deflect', 'earth_wall', 'ring_barrier'];

                this.villagers.forEach((u, idx) => {
                    if (u.isT101s) {
                        u.skySoar = true;
                        u.flightRollAnim = 1.0;
                        u.diveAnim = 1.0;
                        u.blockAnim = 0.95;
                        u.blockType = 'ring_barrier';
                        this.sonicRings.push({ x: u.x, y: u.y - 28, r: 8, maxR: 82, life: 1.0 });
                        this.spawnFloatText(u.x, u.y - 48, '🪽 SUPERSONIC FLIGHT & RING AEGIS!', '#fde047');
                    } else if (idx % 3 === 0) {
                        const f = forms[idx % forms.length];
                        u.martialForm = f;
                        u.martialAnim = 1.0;
                        u.swingAnim = 1.0;
                        if (f === 'hurricane_kick' || f === 'dragon_uppercut' || f === 'crane_kick') {
                            u.combatJumpZ = 26;
                            u.kickAnim = 1.0;
                        }
                        this.spawnFloatText(u.x, u.y - 38, `🥋 ${f.replace('_', ' ').toUpperCase()}!`, '#34d399');
                    } else if (idx % 3 === 1) {
                        this.triggerUnitDodge(u, null, dodges[idx % dodges.length]);
                    } else {
                        this.triggerUnitBlock(u, null, blocks[idx % blocks.length]);
                    }
                });

                const hero = this.villagers.find(v => v.isT101s) || this.villagers[0];
                if (hero) {
                    this.cam.targetX = hero.x;
                    this.cam.targetY = hero.y;
                    this.cam.targetZoom = 1.28;
                }
                this.sfx.play('ring');
                this.showBanner('🥋', 'Martial Arts Kata, Dodges, Shield Blocks & Supersonic Flight Unleashed!');
            }

            triggerUnitDodge(u, attacker = null, forcedType = null) {
                const dodgeTypes = u.isT101s || u.bender === 'air'
                    ? ['air_spin', 'sidestep', 'backflip']
                    : (u.fightingStyle === 'kungfu'
                        ? ['backflip', 'matrix_lean', 'sidestep']
                        : ['roll', 'sidestep', 'backflip', 'matrix_lean']);
                const dType = forcedType || dodgeTypes[Math.floor(Math.random() * dodgeTypes.length)];
                u.dodgeType = dType;
                u.dodgeAnim = 1.0;

                const awayDir = -(u.facing || 1);
                if (dType === 'backflip') {
                    u.combatJumpZ = 28;
                    u.x = wrapX(u.x + awayDir * 22);
                    this.spawnFloatText(u.x, u.y - 38, '🤸 BACKFLIP DODGE!', '#fde047');
                } else if (dType === 'roll') {
                    u.x = wrapX(u.x + (u.facing || 1) * 24);
                    this.spawnFloatText(u.x, u.y - 34, '🛞 TACTICAL ROLL!', '#fbbf24');
                } else if (dType === 'sidestep') {
                    // Leave 3 phantom mirage afterimages along the dash path
                    for (let m = 0; m < 3; m++) {
                        this.afterimages.push({
                            x: wrapX(u.x + awayDir * m * 9),
                            y: u.y + (m - 1) * 6,
                            facing: u.facing || 1,
                            elevY: -(u.terrainZ || 0),
                            color: u.isT101s ? '#f43f5e' : '#38bdf8',
                            life: 0.34,
                            maxLife: 0.34
                        });
                    }
                    u.x = wrapX(u.x + awayDir * 26);
                    u.y = Math.max(180, Math.min(WORLD_H - 180, u.y + (Math.random() > 0.5 ? 18 : -18)));
                    this.spawnFloatText(u.x, u.y - 36, '💨 PHANTOM STEP!', '#38bdf8');
                } else if (dType === 'matrix_lean') {
                    u.spineLean = -1.15;
                    this.spawnFloatText(u.x, u.y - 36, '⚡ MATRIX WEAVE!', '#34d399');
                } else if (dType === 'air_spin') {
                    u.combatJumpZ = 24;
                    u.flightRollAnim = 1.0;
                    this.sonicRings.push({ x: u.x, y: u.y - 22, r: 5, maxR: 44, life: 0.65 });
                    this.spawnFloatText(u.x, u.y - 40, '🌪️ SKY BARREL-EVADE!', '#a7f3d0');
                }
            }

            triggerUnitBlock(u, attacker = null, forcedType = null) {
                let bType = forcedType;
                if (!bType) {
                    if (u.isT101s) bType = 'ring_barrier';
                    else if (u.bender === 'earth' || u.fightingStyle === 'juggernaut') bType = 'earth_wall';
                    else if (u.fightingStyle === 'phalanx') bType = 'shield_wall';
                    else if (u.fightingStyle === 'kungfu' || u.bender === 'water' || u.bender === 'air') bType = 'palm_deflect';
                    else bType = 'cross_blade';
                }
                u.blockType = bType;
                u.blockAnim = 1.0;

                const midX = attacker ? (u.x + wrapDX(u.x, attacker.x) * 0.5) : u.x + (u.facing || 1) * 14;
                const midY = attacker ? (u.y + attacker.y) * 0.5 - 16 : u.y - 16;

                if (bType === 'ring_barrier') {
                    this.parryRings.push({ x: u.x, y: u.y - 22, r: 10, maxR: 46, life: 0.38 });
                    this.spawnClashSparks(midX, midY, '#f43f5e', 12);
                    this.spawnFloatText(u.x, u.y - 40, '💍 ONE RING AEGIS!', '#fde047');
                } else if (bType === 'earth_wall') {
                    this.spawnRockSpikeCluster(u.x + (u.facing || 1) * 16, u.y, 2);
                    this.spawnClashSparks(midX, midY, '#d97706', 9);
                    this.spawnFloatText(u.x, u.y - 36, '🪨 STONE BULWARK!', '#fbbf24');
                } else if (bType === 'shield_wall') {
                    this.parryRings.push({ x: midX, y: midY, r: 8, maxR: 38, life: 0.34 });
                    this.spawnClashSparks(midX, midY, '#38bdf8', 10);
                    this.spawnFloatText(u.x, u.y - 36, '🛡️ PHALANX GUARD!', '#38bdf8');
                } else if (bType === 'palm_deflect') {
                    this.parryRings.push({ x: midX, y: midY, r: 6, maxR: 34, life: 0.32 });
                    this.spawnClashSparks(midX, midY, '#10b981', 8);
                    this.spawnFloatText(u.x, u.y - 36, '☯️ CHI REDIRECT!', '#34d399');
                } else {
                    this.spawnClashSparks(midX, midY, '#fde047', 11);
                    this.spawnFloatText(u.x, u.y - 36, '⚔️ TWIN-BLADE PARRY!', '#f97316');
                }
            }

            triggerAllOutCharge() {
                let target = this.enemies.find(e => e.isHostileToPlayer !== false) ||
                             this.strongholds.find(s => {
                                 const ai = this.aiPlayers.find(a => a.continentIdx === s.continentIdx);
                                 return !ai || ai.stance === 'hostile';
                             });
                if (!target) {
                    this.triggerCannibalRaid();
                    target = this.enemies[0];
                }
                if (!target) return;
                this.villagers.forEach(u => {
                    u.targetEntityId = target.id;
                    u.targetX = null;
                    u.targetY = null;
                });
                this.siegeEngines.forEach(se => {
                    se.targetEntityId = target.id;
                    se.targetX = null;
                    se.targetY = null;
                });
                this.sfx.play('horn');
                this.showBanner('🔥', `ALL-OUT WAR! ${this.empirePopBillions.toFixed(2)}B Empire Charging ${target.name}!`);
            }

            toggleDiplomacyPanel() {
                const panel = document.getElementById('diplomacyPanel');
                if (!panel) return;
                panel.classList.toggle('hidden');
                if (!panel.classList.contains('hidden')) {
                    this.renderDiplomacyPanel();
                }
            }

            renderDiplomacyPanel() {
                const list = document.getElementById('aiPlayersList');
                if (!list || !this.aiPlayers) return;
                const aliveCount = this.aiPlayers.filter(a => !a.defeated).length;
                const countEl = document.getElementById('aiEmpiresCountLabel');
                if (countEl) countEl.textContent = aliveCount;

                let html = '';
                for (let i = 0; i < this.aiPlayers.length; i++) {
                    const ai = this.aiPlayers[i];
                    const ep = EPOCHS[ai.ageLevel || 0];
                    let stanceBadge = '<span class="px-1 py-0.2 rounded bg-rose-950/90 text-rose-300 border border-rose-500/50">⚔️ Hostile</span>';
                    if (ai.stance === 'allied') {
                        stanceBadge = '<span class="px-1 py-0.2 rounded bg-emerald-900/90 text-emerald-300 border border-emerald-500/50">🤝 Allied</span>';
                    } else if (ai.stance === 'vassal') {
                        stanceBadge = '<span class="px-1 py-0.2 rounded bg-amber-900/90 text-yellow-200 border border-yellow-400/60">💍 Ring Vassal</span>';
                    } else if (ai.stance === 'neutral') {
                        stanceBadge = '<span class="px-1 py-0.2 rounded bg-sky-900/90 text-sky-200 border border-sky-400/50">⚖️ Neutral</span>';
                    }

                    const unitCount = this.enemies.filter(e => e.aiOwnerId === ai.id && e.hp > 0).length;
                    let allyBtn = '';
                    if (ai.stance !== 'allied' && ai.stance !== 'vassal') {
                        allyBtn = '<button onclick="game.sendAITribute(\'' + ai.id + '\')" class="wood-btn px-1.5 py-0.5 rounded text-[9px] font-bold text-emerald-200 flex-1" title="Pay 45 Gold to Improve Relations / Ally">🤝 Ally (45🪙)</button>';
                    }
                    let warBtn = '';
                    if (ai.stance !== 'hostile') {
                        warBtn = '<button onclick="game.declareAIWar(\'' + ai.id + '\')" class="stone-btn px-1.5 py-0.5 rounded text-[9px] font-bold text-rose-300" title="Declare War">⚔️</button>';
                    }

                    html += '<div class="bg-stone-900/95 border border-stone-700 rounded-lg p-1.5 flex flex-col justify-between gap-1">' +
                        '<div>' +
                            '<div class="flex items-center justify-between gap-1">' +
                                '<span class="font-bold text-amber-200 truncate">' + ai.avatar + ' ' + ai.name + '</span>' +
                                stanceBadge +
                            '</div>' +
                            '<div class="text-[9px] text-stone-400 truncate">' + ai.empireName + '</div>' +
                            '<div class="flex items-center justify-between text-[9px] mt-1 text-stone-300">' +
                                '<span>' + ep.icon + ' ' + ep.name.split(':')[0] + '</span>' +
                                '<span class="text-indigo-300">🌍 ' + ai.popBillions.toFixed(2) + 'B</span>' +
                            '</div>' +
                            '<div class="flex items-center justify-between text-[9px] text-amber-300/90">' +
                                '<span>⚔️ Units: ' + unitCount + '</span>' +
                                '<span>🏛️ Blds: ' + (ai.buildingsCount || 4) + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<div class="flex items-center gap-1 mt-1">' +
                            '<button onclick="game.spectateAIPlayer(\'' + ai.id + '\')" class="stone-btn px-1.5 py-0.5 rounded text-[9px] font-bold text-sky-200 flex-1" title="Jump camera to AI Capital">📷 View</button>' +
                            allyBtn +
                            warBtn +
                        '</div>' +
                    '</div>';
                }
                list.innerHTML = html;
            }

            spectateAIPlayer(aiId) {
                const ai = this.aiPlayers.find(a => a.id === aiId);
                if (!ai) return;
                this.globeMode = false;
                this.cam.targetX = ai.capitalX;
                this.cam.targetY = ai.capitalY;
                this.cam.targetZoom = 0.88;
                this.showBanner(ai.avatar, `Spectating ${ai.name} (${ai.empireName}) — ${EPOCHS[ai.ageLevel].name}`);
            }

            sendAITribute(aiId) {
                const ai = this.aiPlayers.find(a => a.id === aiId);
                if (!ai) return;
                if (this.resources.gold < 45) {
                    this.showBanner('⚠️', 'Need 45🪙 Gold to send diplomatic tribute!');
                    return;
                }
                this.resources.gold -= 45;
                ai.resources.gold += 45;
                if (ai.stance === 'hostile') {
                    ai.stance = 'neutral';
                    this.showBanner('⚖️', `${ai.name} accepted your 45🪙 Gold! Stance is now NEUTRAL Truce.`);
                } else {
                    ai.stance = 'allied';
                    this.showBanner('🤝', `${ai.name} (${ai.empireName}) forged a Military ALLIANCE with your Tribe!`);
                }
                // Update hostility flags on all units belonging to this AI player
                this.enemies.forEach(e => {
                    if (e.aiOwnerId === ai.id) {
                        e.isHostileToPlayer = (ai.stance === 'hostile');
                    }
                });
                this.sfx.play('horn');
                this.updateHUD();
                this.renderDiplomacyPanel();
            }

            declareAIWar(aiId) {
                const ai = this.aiPlayers.find(a => a.id === aiId);
                if (!ai) return;
                ai.stance = 'hostile';
                this.enemies.forEach(e => {
                    if (e.aiOwnerId === ai.id) {
                        e.isHostileToPlayer = true;
                    }
                });
                this.sfx.play('horn');
                this.renderDiplomacyPanel();
                this.showBanner('⚔️', `War Declared against ${ai.name} (${ai.empireName})!`);
            }

            toggleMountsGlobal() {
                this.mountsEnabled = !this.mountsEnabled;
                this.villagers.forEach((u, idx) => {
                    if (u.isT101s) return;
                    if (this.mountsEnabled && (u.isCommander || idx % 2 === 0)) {
                        u.mountType = idx % 2 === 0 ? 'mammoth' : 'sabre';
                    } else {
                        u.mountType = null;
                    }
                });
                const lbl = document.getElementById('mountsBtnLabel');
                if (lbl) lbl.textContent = this.mountsEnabled ? 'Mounts ON' : 'Mounts OFF';
                this.showBanner('🦣', `War-Mammoth & Sabre-Tooth Cavalry Mounts ${this.mountsEnabled ? 'MOUNTED' : 'DISMOUNTED'}!`);
            }

            toggleHeroFlight() {
                const hero = this.villagers.find(u => u.isT101s);
                if (!hero) return;
                hero.skySoar = !hero.skySoar;
                this.sonicRings.push({ x: hero.x, y: hero.y - 22, r: 8, maxR: 68, life: 1.0 });
                this.sfx.play('ring');
                this.updateInspector();
                this.showBanner('🪽', hero.skySoar ? 't101s Ascended into High-Altitude Sky-Soar Flight (+55% Speed & Range)!' : 't101s Hovering at Low Altitude');
            }

            toggleRingControlMode() {
                this.ringControlMode = !this.ringControlMode;
                const btn = document.getElementById('btnT101sControlMode');
                const lbl = document.getElementById('ringModeLabel');
                if (btn) btn.classList.toggle('active-btn', this.ringControlMode);
                if (lbl) lbl.textContent = this.ringControlMode ? 'Control: Spare' : 'Mode: Lethal';
                this.sfx.play('ring');
                this.showBanner(
                    this.ringControlMode ? '👑' : '🩸',
                    this.ringControlMode
                        ? 'One Ring Non-Lethal Human Control ON: t101s spares & commands humans as living Blood-Puppets!'
                        : 'One Ring Lethal Crush ON: t101s crushes enemies with full Bloodbending damage!'
                );
            }

            convertControlledHumans() {
                let converted = 0;
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    if ((e.puppetTimer || 0) > 0 || e.bloodControlled) {
                        const newVillager = this.createVillager({
                            name: `Thrall ${this.villagers.length + 1}`,
                            role: 'Ring-Sworn Warrior',
                            fightingStyle: e.fightingStyle || 'berserker',
                            x: e.x,
                            y: e.y,
                            hp: e.maxHp,
                            maxHp: e.maxHp
                        });
                        newVillager.bloodLevitatedTimer = 6.0;
                        this.villagers.push(newVillager);
                        this.enemies.splice(i, 1);
                        converted++;
                        this.spawnFloatText(newVillager.x, newVillager.y - 36, '👑 RECRUITED!', '#fde047');
                    }
                }
                if (converted > 0) {
                    this.sfx.play('ring');
                    this.empirePopBillions = +(this.empirePopBillions + converted * 0.04).toFixed(2);
                    this.updateHUD();
                    this.updateInspector();
                    this.showBanner('🤝', `t101s Permanently Converted ${converted} Blood-Controlled Humans into Loyal Tribe Warriors!`);
                } else {
                    this.showBanner('💍', 'No active Blood-Puppets yet — use t101s or tap 🩸 Dominion to capture humans first!');
                }
            }

            triggerRingDominion() {
                const hero = this.villagers.find(u => u.isT101s);
                if (!hero) return;
                this.sfx.play('ring');
                this.addScreenShake(12, 0.45);
                this.crimsonEclipseTimer = 2.8;
                this.singularities.push({ x: hero.x, y: hero.y - 28, r: 12, maxR: 260, life: 1.35 });

                let hitCount = 0;
                this.enemies.forEach(e => {
                    if (wrappedDist(hero.x, hero.y, e.x, e.y) <= 340) {
                        hitCount++;
                        e.puppetTimer = this.ringControlMode ? 22.0 : 5.0;
                        e.bloodControlled = this.ringControlMode;
                        e.puppetCasterId = hero.id;
                        e.hitFlashTimer = 0.22;
                        if (this.ringControlMode) {
                            e.hp = Math.max(Math.round(e.maxHp * 0.35), e.hp - hero.atk * 0.35);
                            this.spawnFloatText(e.x, e.y - 38, '👑 MIND CONTROLLED!', '#fde047');
                        } else {
                            e.hp -= hero.atk * 2.1;
                            this.launchUnitRagdoll(e, (Math.random() - 0.5) * 140, (Math.random() - 0.5) * 100, 185, 1);
                        }
                        this.lightningArcs.push({ x1: hero.x, y1: hero.y - 28, x2: e.x, y2: e.y - 18, color: '#f43f5e', life: 0.45 });
                    }
                });

                this.villagers.forEach(u => {
                    u.hp = Math.min(u.maxHp, u.hp + 45);
                    if (!u.isT101s && wrappedDist(hero.x, hero.y, u.x, u.y) <= 260) {
                        u.bloodLevitatedTimer = 10.0;
                    }
                });

                this.showBanner(
                    this.ringControlMode ? '👑' : '🩸',
                    this.ringControlMode
                        ? `ONE RING DOMINION! t101s Enslaved ${hitCount} Living Humans as Controllable Blood-Puppets & Levitated Allies!`
                        : `t101s Unleashed ONE RING DOMINION! Bloodbent ${hitCount} Raiders & Siphoned Life!`
                );
            }

            cycleSelectedFightingStyle() {
                const keys = ['berserker', 'phalanx', 'kungfu', 'archery', 'juggernaut'];
                const unit = this.getSelectedUnit();
                if (!unit) return;
                if (unit.isT101s) {
                    this.showBanner('💍', 't101s exclusively masters Sovereign One Ring Blood-Art!');
                    return;
                }
                const idx = keys.indexOf(unit.fightingStyle);
                const nextKey = keys[(idx + 1) % keys.length];
                unit.fightingStyle = nextKey;
                const spec = FIGHTING_STYLES[nextKey];
                this.updateInspector();
                this.showBanner(spec.icon, `${unit.name} switched to ${spec.name}!`);
            }

            awakenSelectedBender() {
                const unit = this.getSelectedUnit();
                if (!unit || unit.isT101s) return;
                const elems = ['water', 'earth', 'fire', 'air'];
                const curIdx = elems.indexOf(unit.bender);
                unit.bender = elems[(curIdx + 1) % elems.length];
                const bSpec = BENDING_SPECS[unit.bender];
                this.sfx.play('ring');
                this.updateInspector();
                this.showBanner(bSpec.icon, `${unit.name} Awakened as a Master ${bSpec.name}!`);
            }

            ascendSelectedToAvatar() {
                const unit = this.getSelectedUnit();
                if (!unit || unit.isT101s) return;
                if (this.resources.gold < 40) {
                    this.showBanner('⚠️', 'Need 40🪙 Gold to Ascend a Bender to the Avatar State!');
                    return;
                }
                this.resources.gold -= 40;
                unit.bender = 'avatar';
                unit.maxHp += 180;
                unit.hp = unit.maxHp;
                unit.atk += 24;
                this.sfx.play('horn');
                this.addScreenShake(9, 0.35);
                this.updateHUD();
                this.updateInspector();
                this.showBanner('🌟', `${unit.name} Ascended to the Prehistoric Avatar State!`);
            }

            startBuildMode(type) {
                const spec = BUILDING_SPECS[type];
                if (!spec) return;
                if (this.resources.wood < spec.cost.wood || this.resources.stone < spec.cost.stone) {
                    this.showBanner('⚠️', `Need ${spec.cost.wood}🪵 Wood & ${spec.cost.stone}🪨 Stone for ${spec.name}!`);
                    return;
                }
                this.buildMode = type;
                this.buildPos = { x: wrapX(this.cam.x), y: this.cam.y };
                const bar = document.getElementById('buildConfirmBar');
                const title = document.getElementById('buildConfirmTitle');
                if (bar) bar.classList.remove('hidden');
                if (title) title.textContent = `${spec.icon} Tap map to position ${spec.name}`;
            }

            cancelBuildMode() {
                this.buildMode = null;
                const bar = document.getElementById('buildConfirmBar');
                if (bar) bar.classList.add('hidden');
            }

            confirmBuildPlacement() {
                if (!this.buildMode) return;
                const spec = BUILDING_SPECS[this.buildMode];
                if (this.resources.wood < spec.cost.wood || this.resources.stone < spec.cost.stone) {
                    this.showBanner('⚠️', 'Not enough resources!');
                    this.cancelBuildMode();
                    return;
                }
                this.resources.wood -= spec.cost.wood;
                this.resources.stone -= spec.cost.stone;
                const b = this.placeBuildingImmediate(this.buildMode, this.buildPos.x, this.buildPos.y, false);
                this.cancelBuildMode();
                this.sfx.play('chop');
                this.updateHUD();
                this.showBanner(spec.icon, `Constructing ${spec.name} + Linked Cobblestone Road!`);
                this.saveGame();
            }

            getSelectedUnit() {
                if (this.selectedIds.length === 0) return this.villagers[0] || null;
                return this.villagers.find(u => u.id === this.selectedIds[0]) || this.villagers[0] || null;
            }

            updateHUD() {
                const setTxt = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = val;
                };
                setTxt('resWood', Math.floor(this.resources.wood));
                setTxt('resStone', Math.floor(this.resources.stone));
                setTxt('resFood', Math.floor(this.resources.food));
                setTxt('resGold', Math.floor(this.resources.gold));
                setTxt('resWeapons', Math.floor(this.resources.weapons));
                setTxt('resEmpirePop', `${this.empirePopBillions.toFixed(2)}B`);
                setTxt('resRivalPop', `${this.rivalPopBillions.toFixed(2)}B`);
                setTxt('armyCountLabel', this.villagers.length);

                const ep = EPOCHS[this.ageLevel];
                setTxt('ageIcon', ep.icon);
                setTxt('ageTitle', ep.name);
                setTxt('ageUpgradeHint', ep.cost ? `${ep.cost.food}🍖` : 'MAX');
            }

            updateInspector() {
                const u = this.getSelectedUnit();
                if (!u) return;
                const setTxt = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = val;
                };
                const styleSpec = FIGHTING_STYLES[u.fightingStyle] || FIGHTING_STYLES.berserker;
                const bSpec = u.bender ? BENDING_SPECS[u.bender] : null;

                setTxt('inspAvatar', u.isT101s ? '💍' : (bSpec ? bSpec.icon : styleSpec.icon));
                setTxt('inspName', u.name);
                setTxt('inspRoleBadge', u.isT101s ? 'One Ring 🪽' : (bSpec ? bSpec.name : (u.mountType ? `Mounted ${u.mountType}` : u.role)));
                setTxt('inspHp', `HP ${Math.ceil(u.hp)}/${u.maxHp}`);
                setTxt('inspStyle', `${styleSpec.icon} ${styleSpec.name.split(' ')[0]}`);
                setTxt('flightStateLabel', u.skySoar ? 'Sky-Soar ON' : 'Hovering');
                setTxt('ringModeLabel', this.ringControlMode ? 'Control: Spare' : 'Mode: Lethal');
            }

            // =====================================================================
            // SAVE & LOAD SYSTEM (localStorage)
            // =====================================================================
            saveGame() {
                try {
                    const state = {
                        ageLevel: this.ageLevel,
                        resources: this.resources,
                        empirePopBillions: this.empirePopBillions,
                        rivalPopBillions: this.rivalPopBillions,
                        wave: this.wave,
                        villagers: this.villagers,
                        siegeEngines: this.siegeEngines,
                        buildings: this.buildings,
                        roads: this.roads,
                        aiPlayers: this.aiPlayers
                    };
                    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
                } catch (e) {}
            }

            saveGameManual() {
                this.saveGame();
                this.showBanner('💾', 'Planetary Empire, AI Players, Benders & Hero t101s Saved!');
            }

            loadGame() {
                try {
                    const raw = localStorage.getItem(SAVE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (!data || !Array.isArray(data.villagers) || data.villagers.length === 0) return false;
                    this.initFreshPlanet();
                    this.ageLevel = data.ageLevel || 0;
                    this.resources = Object.assign(this.resources, data.resources || {});
                    this.empirePopBillions = data.empirePopBillions || 1.48;
                    this.rivalPopBillions = data.rivalPopBillions || 3.80;
                    this.wave = data.wave || 1;
                    this.villagers = data.villagers;
                    if (Array.isArray(data.siegeEngines) && data.siegeEngines.length > 0) {
                        this.siegeEngines = data.siegeEngines;
                    }
                    if (Array.isArray(data.buildings) && data.buildings.length > 0) {
                        this.buildings = data.buildings;
                    }
                    if (Array.isArray(data.roads) && data.roads.length > 0) {
                        this.roads = data.roads;
                    }
                    if (Array.isArray(data.aiPlayers) && data.aiPlayers.length > 0) {
                        this.aiPlayers = data.aiPlayers;
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            }

            resetGameTap() {
                if (this.resetConfirmTimer > 0) {
                    localStorage.removeItem(SAVE_KEY);
                    this.ageLevel = 0;
                    this.resources = { wood: 260, stone: 220, food: 240, gold: 130, weapons: 16 };
                    this.initFreshPlanet();
                    this.resetConfirmTimer = 0;
                    this.updateHUD();
                    this.updateInspector();
                    this.showBanner('🔄', 'Planet Reset to Fresh Stone Age Valley!');
                } else {
                    this.resetConfirmTimer = 3.5;
                    this.showBanner('⚠️', 'Tap 🗑️ Reset again within 3s to confirm fresh restart');
                }
            }

            // =====================================================================
            // WORLD INITIALIZATION & ENTITY FACTORIES
            // =====================================================================
            initFreshPlanet() {
                this.villagers = [];
                this.siegeEngines = [];
                this.buildings = [];
                this.roads = [];
                this.porters = [];
                this.nodes = [];
                this.wildlife = [];
                this.enemies = [];
                this.strongholds = [];
                this.aiPlayers = [];

                // Starting Settlement Buildings
                this.placeBuildingImmediate('town_center', 840, 2210, true);
                this.placeBuildingImmediate('hut', 690, 2260, true);
                this.placeBuildingImmediate('sawmill', 670, 2410, true);
                this.placeBuildingImmediate('kitchen', 980, 2270, true);
                this.placeBuildingImmediate('forge', 1010, 2420, true);
                this.placeBuildingImmediate('shrine', 840, 2080, true);
                this.placeBuildingImmediate('tower', 1120, 2330, true);

                // 1. Unique Hero: t101s — Bearer of The One Ring
                this.villagers.push(this.createVillager({
                    name: 't101s',
                    role: 'One Ring Sovereign',
                    isT101s: true,
                    hasTheOneRing: true,
                    skySoar: true,
                    fightingStyle: 'blood_ring',
                    x: 840,
                    y: 2350,
                    hp: 680,
                    maxHp: 680,
                    atk: 46
                }));

                // 2. Starting Elemental Benders & Mounted Commanders
                const roster = [
                    { name: 'Tophia', role: 'Earthbender', bender: 'earth', fightingStyle: 'juggernaut', mountType: null, x: 780, y: 2360 },
                    { name: 'Zukor',  role: 'Firebender',  bender: 'fire',  fightingStyle: 'kungfu',     mountType: null, x: 900, y: 2360 },
                    { name: 'Katari', role: 'Waterbender', bender: 'water', fightingStyle: 'phalanx',    mountType: null, x: 760, y: 2420 },
                    { name: 'Aangus', role: 'Airbender',   bender: 'air',   fightingStyle: 'kungfu',     mountType: null, x: 920, y: 2420 },
                    { name: 'Korruk', role: 'Prehistoric Avatar', bender: 'avatar', fightingStyle: 'berserker', mountType: 'sabre', x: 840, y: 2440 },
                    { name: 'Gromm',  role: 'Legion Commander', isCommander: true, fightingStyle: 'phalanx', mountType: 'mammoth', x: 960, y: 2340 },
                    { name: 'Sylva',  role: 'Legion Commander', isCommander: true, fightingStyle: 'archery', mountType: 'sabre',   x: 720, y: 2340 }
                ];
                roster.forEach(cfg => this.villagers.push(this.createVillager(cfg)));

                // Starting 2.5D Siege Engines
                this.siegeEngines.push(this.createSiegeEngine({ kind: 'trebuchet', x: 1050, y: 2360 }));
                this.siegeEngines.push(this.createSiegeEngine({ kind: 'ram',       x: 1090, y: 2420 }));

                // Resource Clusters across all 6 Continents
                const types = ['wood', 'stone', 'gold', 'berry'];
                for (let c = 0; c < CONTINENTS.length; c++) {
                    const cont = CONTINENTS[c];
                    for (let i = 0; i < 24; i++) {
                        const nx = cont.xStart + 110 + ((i * 173 + c * 97) % 1380);
                        const ny = 1580 + ((i * 229 + c * 53) % 1360);
                        if (Math.abs(ny - 2650) < 95) continue;
                        if (c === 0 && Math.hypot(nx - 840, ny - 2300) < 220) continue;
                        this.nodes.push({
                            id: `node_${c}_${i}`,
                            type: types[(i + c) % types.length],
                            x: nx,
                            y: ny,
                            amount: 140
                        });
                    }

                    // Prehistoric Wildlife
                    for (let w = 0; w < 5; w++) {
                        const kinds = ['mammoth', 'sabre', 'stag'];
                        this.wildlife.push({
                            id: `wild_${c}_${w}`,
                            kind: kinds[w % kinds.length],
                            x: cont.xStart + 250 + w * 260,
                            y: 1980 + (w % 2) * 480,
                            facing: 1,
                            moveAngle: 0,
                            walkPhase: Math.random() * 6,
                            terrainZ: 0
                        });
                    }

                    // Initialize 5 Autonomous AI Players (Rival & Allied Civilizations) on Continents 1..5
                    if (c > 0) {
                        const spec = AI_PLAYER_SPECS[c - 1];
                        const sx = cont.xStart + 820;
                        const sy = 2280;

                        const aiPlayer = {
                            id: spec.id,
                            continentIdx: c,
                            name: spec.name,
                            empireName: spec.empireName,
                            avatar: spec.avatar,
                            color: spec.color,
                            bannerColor: spec.bannerColor,
                            bender: spec.bender,
                            preferredStyle: spec.preferredStyle,
                            stance: spec.initialStance,
                            personality: spec.personality,
                            ageLevel: c >= 4 ? 1 : 0,
                            popBillions: cont.popBillions,
                            resources: { wood: 240, stone: 200, food: 240, gold: 140 },
                            capitalX: sx,
                            capitalY: sy,
                            buildingsCount: 4,
                            aiStructures: [
                                { type: 'hut',     x: sx - 130, y: sy - 85,  radius: 28 },
                                { type: 'sawmill', x: sx + 135, y: sy - 80,  radius: 32 },
                                { type: 'barracks',x: sx - 140, y: sy + 95,  radius: 38 },
                                { type: 'tower',   x: sx + 140, y: sy + 95,  radius: 26 }
                            ],
                            decisionTimer: 6 + c * 1.5,
                            defeated: false
                        };
                        this.aiPlayers.push(aiPlayer);

                        // AI Capital Town Center / Citadel
                        this.strongholds.push({
                            id: `sh_${c}`,
                            aiOwnerId: aiPlayer.id,
                            name: `${spec.empireName} Capital`,
                            emperorName: spec.name,
                            avatar: spec.avatar,
                            bannerColor: spec.bannerColor,
                            continentIdx: c,
                            x: sx,
                            y: sy,
                            radius: 56,
                            hp: 1800 + c * 400,
                            maxHp: 1800 + c * 400
                        });

                        // 1. Spawn the AI Sovereign Emperor Hero
                        this.enemies.push(this.createEnemyRaider(sx, sy + 72, c, {
                            aiOwnerId: aiPlayer.id,
                            name: spec.name,
                            role: 'AI Sovereign',
                            isAISovereign: true,
                            bender: spec.bender,
                            fightingStyle: spec.preferredStyle,
                            mountType: c % 2 === 0 ? 'mammoth' : 'sabre',
                            maxHp: 520 + c * 60,
                            atk: 32 + c * 4,
                            empireColor: spec.color,
                            isHostileToPlayer: spec.initialStance === 'hostile'
                        }));

                        // 2. Spawn AI Harvesters (gather wood/stone/gold for the AI Empire)
                        for (let h = 0; h < 2; h++) {
                            this.enemies.push(this.createEnemyRaider(sx - 90 + h * 180, sy - 40, c, {
                                aiOwnerId: aiPlayer.id,
                                name: `${spec.empireName.split(' ')[0]} Harvester`,
                                role: 'AI Harvester',
                                isAIHarvester: true,
                                fightingStyle: 'berserker',
                                empireColor: spec.color,
                                isHostileToPlayer: spec.initialStance === 'hostile'
                            }));
                        }

                        // 3. Spawn AI Army Garrison & Elemental Benders
                        for (let e = 0; e < 4; e++) {
                            this.enemies.push(this.createEnemyRaider(sx - 110 + e * 70, sy + 115 + (e % 2) * 30, c, {
                                aiOwnerId: aiPlayer.id,
                                name: `${spec.empireName.split(' ')[0]} ${e === 0 ? 'Bender' : 'Warrior'}`,
                                bender: e === 0 ? spec.bender : null,
                                fightingStyle: e % 2 === 0 ? spec.preferredStyle : 'phalanx',
                                isCommander: e === 1,
                                empireColor: spec.color,
                                isHostileToPlayer: spec.initialStance === 'hostile'
                            }));
                        }
                    }
                }

                // Initial scouting raid party from Hostile AI #2 (Fire-Lord Ozaius) outside Aethelgard
                const hostileAI = this.aiPlayers.find(a => a.stance === 'hostile') || this.aiPlayers[1];
                for (let e = 0; e < 3; e++) {
                    this.enemies.push(this.createEnemyRaider(1380 + e * 36, 2320 + (e % 2) * 42, 2, {
                        aiOwnerId: hostileAI ? hostileAI.id : 'ai_2',
                        name: 'Ashland Scout Raider',
                        fightingStyle: e === 0 ? 'kungfu' : 'berserker',
                        bender: e === 0 ? 'fire' : null,
                        empireColor: '#f97316',
                        isHostileToPlayer: true
                    }));
                }
            }

            placeBuildingImmediate(type, x, y, built = false) {
                const spec = BUILDING_SPECS[type] || BUILDING_SPECS.hut;
                const b = {
                    id: 'bld_' + Math.random().toString(36).slice(2, 9),
                    type,
                    name: spec.name,
                    x: wrapX(x),
                    y,
                    radius: spec.radius,
                    hp: spec.hp,
                    maxHp: spec.hp,
                    built,
                    progress: built ? 100 : 10,
                    prodTimer: 0,
                    attackTimer: 0
                };
                this.buildings.push(b);

                // Auto-link Settlers Cobblestone Road & Porter to Town Center
                const tc = this.buildings[0];
                if (tc && tc.id !== b.id) {
                    this.roads.push({ x1: tc.x, y1: tc.y, x2: b.x, y2: b.y });
                    this.porters.push({
                        x1: tc.x,
                        y1: tc.y,
                        x2: b.x,
                        y2: b.y,
                        t: Math.random(),
                        dir: 1,
                        wheelPhase: 0
                    });
                }
                return b;
            }

                    hitFlashTimer: 0,
                    stunTimer: 0,
                    airborneZ: 0,
                    velZ: 0,

                };
            }

            bindInputEvents() {
                let isPointerDown = false;
                let startX = 0, startY = 0;
                let lastX = 0, lastY = 0;
                let movedDist = 0;
                let pinchDist0 = 0;
