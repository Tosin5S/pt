                    renderQueue.push({ sortY: s.y + s.radius * 0.4, kind: 'stronghold', ref: s, rx: wrapDX(this.cam.x, s.x), ry: s.y - this.cam.y });
                }
                for (let i = 0; i < this.wildlife.length; i++) {
                    const w = this.wildlife[i];
                    if (!this.isVisibleInFrustum(w.x, w.y, 80)) continue;
                    renderQueue.push({ sortY: w.y, kind: 'wildlife', ref: w, rx: wrapDX(this.cam.x, w.x), ry: w.y - this.cam.y });
                }
                for (let i = 0; i < this.enemies.length; i++) {
                    const e = this.enemies[i];
                    if (!this.isVisibleInFrustum(e.x, e.y, 90)) continue;
                    renderQueue.push({ sortY: e.y + 4, kind: 'enemy', ref: e, rx: wrapDX(this.cam.x, e.x), ry: e.y - this.cam.y });
                }
                for (let i = 0; i < this.villagers.length; i++) {
                    const u = this.villagers[i];
                    if (!this.isVisibleInFrustum(u.x, u.y, 100)) continue;
                    renderQueue.push({ sortY: u.y + 5, kind: 'villager', ref: u, rx: wrapDX(this.cam.x, u.x), ry: u.y - this.cam.y });
                }
                for (let i = 0; i < this.siegeEngines.length; i++) {
                    const se = this.siegeEngines[i];
                    if (!this.isVisibleInFrustum(se.x, se.y, 110)) continue;
                    renderQueue.push({ sortY: se.y + 8, kind: 'siege', ref: se, rx: wrapDX(this.cam.x, se.x), ry: se.y - this.cam.y });
                }
                for (let i = 0; i < this.rockSpikes.length; i++) {
                    const rs = this.rockSpikes[i];
                    if (!this.isVisibleInFrustum(rs.x, rs.y, 60)) continue;
                    renderQueue.push({ sortY: rs.y + 2, kind: 'rockSpike', ref: rs, rx: wrapDX(this.cam.x, rs.x), ry: rs.y - this.cam.y });
                }

                renderQueue.sort((a, b) => a.sortY - b.sortY);

                const invTilt = 1 / Math.max(0.62, this.camTiltY);

                for (let i = 0; i < renderQueue.length; i++) {
                    const item = renderQueue[i];
                    ctx.save();
                    ctx.translate(item.rx, item.ry);
                    ctx.scale(1, invTilt);
                    if (item.kind === 'campfire') this.drawTribalHearthCampfire(ctx);
                    else if (item.kind === 'porter') this.drawSinglePorter(ctx, item.ref, light);
                    else if (item.kind === 'node') this.drawResourceNode(ctx, item.ref, light);
                    else if (item.kind === 'fallingTree') this.drawTimberFallingTree(ctx, item.ref);
                    else if (item.kind === 'building') this.drawBuilding(ctx, item.ref, light);
                    else if (item.kind === 'stronghold') this.drawRivalStronghold(ctx, item.ref, light);
                    else if (item.kind === 'wildlife') this.drawArticulatedBeast(ctx, item.ref, 0, 0, light);
                    else if (item.kind === 'enemy') this.drawArticulatedHuman(ctx, item.ref, 0, 0, true, light);
                    else if (item.kind === 'villager') this.drawArticulatedHuman(ctx, item.ref, 0, 0, false, light);
                    else if (item.kind === 'siege') this.drawArticulatedSiegeEngine(ctx, item.ref, light);
                    else if (item.kind === 'rockSpike') this.drawExtrudedRockSpike(ctx, item.ref);
                    ctx.restore();
                }

                // 5. Age of Empires X-Ray Occlusion Silhouette Pass
                this.renderXRayOcclusionPass(ctx, invTilt);

                // 6. Combat Projectiles, Bloodbending Puppet Strings, Lightning & Atmosphere
                this.renderCombatAndBendingVFX(ctx, invTilt);

                // 7. Build Placement Ghost Preview
                if (this.buildMode) {
                    const spec = BUILDING_SPECS[this.buildMode];
                    const bx = wrapDX(this.cam.x, this.buildPos.x);
                    const by = this.buildPos.y - this.cam.y;
                    ctx.save();
                    ctx.translate(bx, by);
                    ctx.fillStyle = 'rgba(74, 222, 128, 0.28)';
                    ctx.strokeStyle = '#4ade80';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, spec.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.restore();

                // 8. Screen-Space Celestial Tint, Volumetric God-Rays & Weather Shaders
                if (light.tint) {
                    ctx.fillStyle = light.tint;
                    ctx.fillRect(0, 0, W, H);
                }
                this.renderVolumetricGodRays(ctx, W, H, light);
                if (this.weatherEnabled) {
                    this.renderContinentalWeatherShader(ctx, W, H);
                }

                // 9. Lasso Selection Box
                if (this.lassoRect) {
                    const r = this.lassoRect;
                    ctx.fillStyle = 'rgba(253, 224, 71, 0.15)';
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2;
                    ctx.fillRect(Math.min(r.x1, r.x2), Math.min(r.y1, r.y2), Math.abs(r.x2 - r.x1), Math.abs(r.y2 - r.y1));
                    ctx.strokeRect(Math.min(r.x1, r.x2), Math.min(r.y1, r.y2), Math.abs(r.x2 - r.x1), Math.abs(r.y2 - r.y1));
                }

                this.renderMinimap();
            }

            renderVisibleContinents(ctx) {
                for (let c = 0; c < CONTINENTS.length; c++) {
                    const cont = CONTINENTS[c];
                    const center = (cont.xStart + cont.xEnd) * 0.5;
                    const dx = wrapDX(this.cam.x, center);
                    if (Math.abs(dx) > 2200) continue;

                    const leftX = dx - 800;
                    ctx.save();
                    ctx.translate(leftX, -this.cam.y);

                    // Continental Ground Fill
                    ctx.fillStyle = cont.color;
                    ctx.fillRect(0, 0, 1602, WORLD_H);

                    // Checkerboard Biome Texture Patches
                    ctx.fillStyle = cont.groundAlt;
                    for (let gx = 80; gx < 1520; gx += 240) {
                        for (let gy = 1400; gy < 3200; gy += 240) {
                            ctx.beginPath();
                            ctx.ellipse(gx, gy, 85, 52, 0, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // Winding Turquoise River & Shimmering Reflections
                    ctx.fillStyle = '#0284c7';
                    ctx.beginPath();
                    ctx.moveTo(0, 2600);
                    for (let rx = 0; rx <= 1600; rx += 80) {
                        ctx.lineTo(rx, 2600 + Math.sin((rx / 1600) * Math.PI * 2) * 32);
                    }
                    for (let rx = 1600; rx >= 0; rx -= 80) {
                        ctx.lineTo(rx, 2700 + Math.sin((rx / 1600) * Math.PI * 2) * 32);
                    }
                    ctx.closePath();
                    ctx.fill();

                    // Elevated Northern Highland Cliff Ridge, 3 Carved Stone Ramps, Waterfall & 2 Rope Suspension Bridges
                    this.drawContinentalCliffsAndWaterfalls(ctx);

                    ctx.restore();
                }

                // Patrolling River Fleet
                for (let b = 0; b < this.riverBoats.length; b++) {
                    const boat = this.riverBoats[b];
                    const ry = this.getRiverCenterY(boat.x);
                    if (!this.isVisibleInFrustum(boat.x, ry, 80)) continue;
                    const rx = wrapDX(this.cam.x, boat.x);
                    ctx.save();
                    ctx.translate(rx, ry - this.cam.y);
                    ctx.scale(boat.dir, 1);
                    ctx.fillStyle = '#78350f';
                    ctx.strokeStyle = '#fde68a';
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 22, 7, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    const oarSwing = Math.sin(boat.oarPhase) * 6;
                    ctx.strokeStyle = '#fef3c7';
                    for (let o = -12; o <= 12; o += 8) {
                        ctx.beginPath();
                        ctx.moveTo(o, -5); ctx.lineTo(o - oarSwing, -13);
                        ctx.moveTo(o, 5);  ctx.lineTo(o - oarSwing, 13);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }

            drawContinentalCliffsAndWaterfalls(ctx) {
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
                ctx.fillRect(60, 1520, 1480, 235);

                ctx.fillStyle = '#44403c';
                ctx.strokeStyle = '#1c1917';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(60, 1760);
                ctx.lineTo(380, 1710);
                ctx.lineTo(820, 1745);
                ctx.lineTo(1240, 1705);
                ctx.lineTo(1540, 1755);
                ctx.lineTo(1540, 1825);
                ctx.lineTo(60, 1825);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 3 Walkable Carved Stone Staircase Ramps
                const rampXs = [320, 800, 1280];
                for (let r = 0; r < rampXs.length; r++) {
                    const rx = rampXs[r];
                    ctx.fillStyle = '#78716c';
                    ctx.strokeStyle = '#292524';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(rx - 44, 1748);
                    ctx.lineTo(rx + 44, 1748);
                    ctx.lineTo(rx + 54, 1845);
                    ctx.lineTo(rx - 54, 1845);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.strokeStyle = '#d6d3d1';
                    ctx.lineWidth = 1.6;
                    for (let st = 0; st < 6; st++) {
                        const sy = 1758 + st * 14;
                        ctx.beginPath();
                        ctx.moveTo(rx - 42, sy);
                        ctx.lineTo(rx + 42, sy);
                        ctx.stroke();
                    }
                }

                // Cascading Highland Waterfall at x = 520
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(495, 1730, 50, 95);
                ctx.fillStyle = 'rgba(255,255,255,0.65)';
                const foamOff = (this.gameTime * 60) % 24;
                for (let fy = 1735 + foamOff; fy < 1820; fy += 24) {
                    ctx.fillRect(500, fy, 40, 6);
                }

                // 2 Swaying Rope-and-Plank Suspension Bridges over the River (at x = 610, 990)
                const bridgeXs = [610, 990];
                for (let b = 0; b < bridgeXs.length; b++) {
                    const bx = bridgeXs[b];
                    const sway = Math.sin(this.gameTime * 2.5 + b) * 3;
                    for (let p = 0; p < 11; p++) {
                        const py = 2592 + p * 11;
                        const archOffset = Math.sin((p / 10) * Math.PI) * sway;
                        ctx.fillStyle = p % 2 === 0 ? '#92400e' : '#78350f';
                        ctx.fillRect(bx - 24 + archOffset, py, 48, 8);
                    }
                    ctx.strokeStyle = '#fde68a';
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.moveTo(bx - 25, 2585);
                    ctx.quadraticCurveTo(bx - 25 + sway, 2650, bx - 25, 2714);
                    ctx.moveTo(bx + 25, 2585);
                    ctx.quadraticCurveTo(bx + 25 + sway, 2650, bx + 25, 2714);
                    ctx.stroke();
                }
                ctx.restore();
            }

            renderTerrainDecalsAndFissures(ctx) {
                for (let i = 0; i < this.terrainDecals.length; i++) {
                    const d = this.terrainDecals[i];
                    if (!this.isVisibleInFrustum(d.x, d.y, 50)) continue;
                    const rx = wrapDX(this.cam.x, d.x);
                    const ry = d.y - this.cam.y;
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.globalAlpha = Math.min(1, d.life / 4);
                    ctx.fillStyle = d.kind === 'frost' ? 'rgba(56, 189, 248, 0.35)' : 'rgba(28, 25, 23, 0.55)';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, d.radius, d.radius * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                for (let i = 0; i < this.fissures.length; i++) {
                    const f = this.fissures[i];
                    if (!this.isVisibleInFrustum(f.x, f.y, 70)) continue;
                    const rx = wrapDX(this.cam.x, f.x);
                    const ry = f.y - this.cam.y;
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.rotate(f.angle || 0);
                    ctx.strokeStyle = '#fb923c';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-25, 0); ctx.lineTo(0, -6); ctx.lineTo(25, 4);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            renderRoadNetwork(ctx) {
                ctx.save();
                for (let i = 0; i < this.roads.length; i++) {
                    const r = this.roads[i];
                    const x1 = wrapDX(this.cam.x, r.x1);
                    const y1 = r.y1 - this.cam.y;
                    const x2 = x1 + wrapDX(r.x1, r.x2);
                    const y2 = r.y2 - this.cam.y;
                    ctx.strokeStyle = this.ageLevel >= 2 ? '#a8a29e' : '#78350f';
                    ctx.lineWidth = 14;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    ctx.strokeStyle = '#d6d3d1';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 8]);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                ctx.restore();
            }

            drawTribalHearthCampfire(ctx) {
                ctx.save();
                const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, 68);
                grad.addColorStop(0, 'rgba(251, 146, 60, 0.45)');
                grad.addColorStop(1, 'rgba(251, 146, 60, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, 68, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#78350f';
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2;
                    ctx.save();
                    ctx.translate(Math.cos(a) * 32, Math.sin(a) * 20);
                    ctx.rotate(a + Math.PI * 0.5);
                    ctx.fillRect(-10, -3, 20, 6);
                    ctx.restore();
                }

                const flicker = Math.sin(this.gameTime * 14) * 3;
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(-12, 4);
                ctx.quadraticCurveTo(0, -26 - flicker, 12, 4);
                ctx.fill();
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.moveTo(-6, 4);
                ctx.quadraticCurveTo(0, -16 + flicker, 6, 4);
                ctx.fill();
                ctx.restore();
            }

            drawSinglePorter(ctx, p) {
                ctx.save();
                ctx.scale(p.dir, 1);
                ctx.fillStyle = '#78350f';
                ctx.strokeStyle = '#fde68a';
                ctx.lineWidth = 1.5;
                ctx.fillRect(-12, -10, 20, 9);
                ctx.strokeRect(-12, -10, 20, 9);

                ctx.save();
                ctx.translate(-4, 0);
                ctx.rotate(p.wheelPhase || 0);
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                ctx.fillStyle = '#e6b88a';
                ctx.beginPath();
                ctx.arc(12, -14, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawResourceNode(ctx, n, light) {
                ctx.save();
                const shake = (n.hitShakeTimer || 0) > 0 ? Math.sin(this.gameTime * 50) * 3 : 0;
                n.hitShakeTimer = Math.max(0, (n.hitShakeTimer || 0) - 0.016);
                ctx.translate(shake, 0);

                // Cutaway transparency if friendly unit is walking behind tree
                if (n.type === 'wood') {
                    for (let i = 0; i < this.villagers.length; i++) {
                        const u = this.villagers[i];
                        if (u.y < n.y && u.y > n.y - 54 && Math.abs(wrapDX(n.x, u.x)) < 28) {
                            ctx.globalAlpha = 0.52;
                            u._isOccluded = true;
                            break;
                        }
                    }
                }

                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.32})`;
                ctx.beginPath();
                ctx.ellipse(6, 5, 18, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                if (n.type === 'wood') {
                    ctx.fillStyle = '#5c2808';
                    ctx.fillRect(-5, -24, 10, 26);
                    const sway = Math.sin(this.gameTime * 2.2 + n.x) * 2.5;
                    ctx.fillStyle = '#15803d';
                    ctx.beginPath();
                    ctx.arc(sway, -34, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.arc(sway - 5, -38, 13, 0, Math.PI * 2);
                    ctx.fill();
                } else if (n.type === 'stone' || n.type === 'gold') {
                    ctx.fillStyle = n.type === 'gold' ? '#eab308' : '#78716c';
                    ctx.strokeStyle = '#1c1917';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-18, 4);
                    ctx.lineTo(-10, -20);
                    ctx.lineTo(8, -22);
                    ctx.lineTo(18, 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#166534';
                    ctx.beginPath();
                    ctx.arc(0, -10, 15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.arc(-5, -12, 3.5, 0, Math.PI * 2);
                    ctx.arc(5, -9, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            drawTimberFallingTree(ctx, ft) {
                ctx.save();
                ctx.rotate(ft.dir * ft.angle);
                ctx.fillStyle = '#5c2808';
                ctx.fillRect(-4, -26, 8, 26);
                ctx.fillStyle = '#15803d';
                ctx.beginPath();
                ctx.arc(0, -34, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            drawBuilding(ctx, b, light) {
                const ep = EPOCHS[this.ageLevel];
                ctx.save();

                for (let i = 0; i < this.villagers.length; i++) {
                    const u = this.villagers[i];
                    if (u.y < b.y + b.radius * 0.25 && u.y > b.y - b.radius * 1.45 && Math.abs(wrapDX(b.x, u.x)) < b.radius * 0.95) {
                        ctx.globalAlpha = 0.56;
                        u._isOccluded = true;
                        break;
                    }
                }

                const r = b.radius;
                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.38})`;
                ctx.beginPath();
                ctx.ellipse(8, 8, r * 1.15, r * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = ep.wallColor;
                ctx.strokeStyle = '#1c1917';
                ctx.lineWidth = 2.5;
                ctx.fillRect(-r * 0.8, -r * 0.85, r * 1.6, r * 1.0);
                ctx.strokeRect(-r * 0.8, -r * 0.85, r * 1.6, r * 1.0);

                ctx.fillStyle = ep.roofColor;
                ctx.beginPath();
                ctx.moveTo(-r * 0.98, -r * 0.8);
                ctx.lineTo(0, -r * 1.65);
                ctx.lineTo(r * 0.98, -r * 0.8);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                const spec = BUILDING_SPECS[b.type] || BUILDING_SPECS.hut;
                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(spec.icon, 0, -r * 0.25);

                if (!b.built) {
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-r * 0.85, -r * 1.4, r * 1.7, r * 1.5);
                }
                ctx.restore();
            }

            drawRivalStronghold(ctx, s, light) {
                const r = s.radius;
                ctx.save();
                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.45})`;
                ctx.beginPath();
                ctx.ellipse(10, 10, r * 1.2, r * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#450a0a';
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, -12, r * 0.85, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                const pct = Math.max(0, s.hp / s.maxHp);
                ctx.fillStyle = '#1c1917';
                ctx.fillRect(-36, -r - 22, 72, 7);
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(-35, -r - 21, 70 * pct, 5);

                ctx.font = 'bold 11px Inter, sans-serif';
                ctx.fillStyle = '#fecdd3';
                ctx.textAlign = 'center';
                ctx.fillText(`💀 ${s.name}`, 0, -r - 28);
                ctx.restore();
            }

            drawExtrudedRockSpike(ctx, rs) {
                ctx.save();
                ctx.rotate(rs.tilt || 0);
                ctx.fillStyle = '#78716c';
                ctx.strokeStyle = '#292524';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(-rs.w, 0);
                ctx.lineTo(0, -rs.h);
                ctx.lineTo(rs.w, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            drawArticulatedBeast(ctx, w, x, y, light) {
                ctx.save();
                const elevY = -(w.terrainZ || 0);
                ctx.translate(x, y + elevY);
                const isMammoth = w.kind === 'mammoth';
                const isSabre = w.kind === 'sabre';
                const r = isMammoth ? 22 : 14;

                const moveAng = w.moveAngle !== undefined ? w.moveAngle : 0;
                const horizPerspective = 0.68 + Math.abs(Math.cos(moveAng)) * 0.32;

                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.34})`;
                ctx.beginPath();
                ctx.ellipse(5, 8, r * 1.2 * horizPerspective, r * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.scale((w.facing || 1) * horizPerspective, 1);
                const wp = w.walkPhase || 0;

                ctx.strokeStyle = isMammoth ? '#451a03' : '#b45309';
                ctx.lineWidth = isMammoth ? 4.5 : 3;
                for (let l = -1; l <= 1; l += 2) {
                    const swing = Math.sin(wp + l) * 5;
                    ctx.beginPath();
                    ctx.moveTo(l * 8, -4);
                    ctx.lineTo(l * 8 + swing, 8);
                    ctx.stroke();
                }

                ctx.fillStyle = isMammoth ? '#5c2808' : (isSabre ? '#d97706' : '#a16207');
                ctx.beginPath();
                ctx.ellipse(0, -10, r, r * 0.72, 0, 0, Math.PI * 2);
                ctx.fill();

                if (isMammoth) {
                    ctx.strokeStyle = '#fef3c7';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(r - 4, -8);
                    ctx.quadraticCurveTo(r + 12, -2, r + 14, -14);
                    ctx.stroke();
                }
                ctx.restore();
            }

            drawArticulatedHuman(ctx, u, x, y, isEnemy, light) {
                ctx.save();
                ctx.translate(x, y);

                const isSelected = !isEnemy && this.selectedIds.includes(u.id);
                const elevZ = u.terrainZ || 0;
                if (isSelected) {
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.ellipse(0, 4 - elevZ, 20, 10, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }

                const mAng = u.moveAngle !== undefined ? u.moveAngle : 0;
                const sinA = Math.sin(mAng);
                const isBackView = sinA < -0.58 && (u.swingAnim || 0) <= 0.1;
                const isFrontView = sinA > 0.58 && (u.swingAnim || 0) <= 0.1;

                let mountLiftY = 0;
                if (!isEnemy && u.mountType && (u.airborneZ || 0) <= 1) {
                    this.drawArticulatedBeast(ctx, {
                        kind: u.mountType,
                        facing: u.facing || 1,
                        moveAngle: mAng,
                        walkPhase: u.walkPhase || 0,
                        terrainZ: elevZ
                    }, 0, 4, light);
                    mountLiftY = u.mountType === 'mammoth' ? -18 : -11;
                }

                let hoverY = -(u.airborneZ || 0) - elevZ + mountLiftY;
                if (u.isT101s) {
                    hoverY -= (u.skySoar ? 24 : 12) + Math.sin(this.gameTime * 5) * 4;
                }

                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.35})`;
                ctx.beginPath();
                ctx.ellipse(5, 5 - elevZ * 0.8, 11, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.translate(0, hoverY);

                // Elemental Stance Aura Underlay
                if (!isEnemy && (u.bender || u.isT101s)) {
                    this.drawElementalStanceAura(ctx, u);
                }

                ctx.save();
                ctx.scale(u.facing || 1, 1);
                if (u.ragdollSpin) ctx.rotate(this.gameTime * u.ragdollSpin);

                const walk = u.walkPhase || 0;
                const breath = Math.sin(this.gameTime * 4 + (u.x * 0.05)) * 0.8;

                // Flowing Mantle Cape for t101s or Commanders
                if (u.isT101s || u.isCommander) {
                    ctx.fillStyle = u.isT101s ? '#991b1b' : '#1e3a8a';
                    const capeWave = Math.sin(this.gameTime * 8 + walk) * 4;
                    ctx.beginPath();
                    ctx.moveTo(-4, -20);
                    ctx.quadraticCurveTo(-15, -8 + capeWave, -12, 2 + capeWave);
                    ctx.lineTo(-2, -6);
                    ctx.closePath();
                    ctx.fill();
                }

                // 2-Segment Articulated Legs & Feet
                ctx.strokeStyle = '#d6a173';
                ctx.lineWidth = 3.2;
                ctx.lineCap = 'round';
                for (let side = -1; side <= 1; side += 2) {
                    const stride = Math.sin(walk + (side === 1 ? 0 : Math.PI)) * 6;
                    ctx.beginPath();
                    ctx.moveTo(side * 3, -7);
                    ctx.lineTo(side * 3 + stride * 0.6, -1);
                    ctx.lineTo(side * 3 + stride, 5);
                    ctx.stroke();
                }

                // Torso Tunic / Armor
                ctx.fillStyle = isEnemy ? '#991b1b' : (u.isT101s ? '#7f1d1d' : (u.bender ? BENDING_SPECS[u.bender].color : '#b45309'));
                ctx.beginPath();
                ctx.roundRect(-6.5, -21 - breath * 0.5, 13, 15, 3);
                ctx.fill();

                if (isFrontView) {
                    ctx.fillStyle = '#fde047';
                    ctx.fillRect(-2.2, -9.5, 4.4, 3);
                } else if (isBackView) {
                    ctx.fillStyle = '#475569';
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.ellipse(0, -15, 5, 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }

                // Head, Hair & Expressive Eyes
                ctx.fillStyle = '#e6b88a';
                ctx.beginPath();
                ctx.arc(0, -26.5 - breath * 0.5, 6.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = u.isT101s ? '#fbbf24' : (isEnemy ? '#1c1917' : '#451a03');
                ctx.beginPath();
                if (isBackView) {
                    ctx.arc(0, -26.8 - breath * 0.5, 6.6, 0, Math.PI * 2);
                } else {
                    ctx.arc(0, -28.5 - breath * 0.5, 6.5, Math.PI, 0);
                }
                ctx.fill();

                if (!isBackView) {
                    ctx.fillStyle = (u.isT101s || u.bender === 'avatar') ? '#38bdf8' : '#1c1917';
                    if (isFrontView) {
                        ctx.fillRect(-3.2, -27.5, 2, 2);
                        ctx.fillRect(1.4, -27.5, 2, 2);
                    } else {
                        ctx.fillRect(2, -27.5, 2.2, 2.2);
                    }
                }

                // Articulated Front Arm, Hand, Weapon & THE ONE RING on t101s
                const swing = Math.sin((u.swingAnim || 0) * Math.PI) * 1.3;
                const pitch = (u.aimPitch || 0) - swing;
                const handX = 4 + Math.cos(pitch) * 11;
                const handY = -16 + Math.sin(pitch) * 11;

                ctx.strokeStyle = '#e6b88a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(2, -18);
                ctx.lineTo(handX, handY);
                ctx.stroke();

                if (u.isT101s && u.hasTheOneRing) {
                    // Gleaming Gold Band & Crimson Gem of The One Ring
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.arc(handX, handY, 4.2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.arc(handX, handY, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.strokeStyle = '#e2e8f0';
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.moveTo(handX, handY);
                    ctx.lineTo(handX + 10, handY - 9);
                    ctx.stroke();
                }

                ctx.restore();

                // Overhead Unit Badges & Health Bar
                const pct = Math.max(0, u.hp / u.maxHp);
                ctx.fillStyle = '#1c1917';
                ctx.fillRect(-15, -39, 30, 4);
                ctx.fillStyle = isEnemy ? '#f43f5e' : (u.isT101s ? '#fde047' : '#4ade80');
                ctx.fillRect(-14, -38, 28 * pct, 2.5);

                if (u.isT101s) {
                    ctx.font = 'bold 10px Inter, sans-serif';
                    ctx.fillStyle = '#fde047';
                    ctx.textAlign = 'center';
                    ctx.fillText('💍 t101s • One Ring 🪽', 0, -44);
                } else if (isEnemy && (u.puppetTimer || 0) > 0) {
                    ctx.font = 'bold 9px Inter, sans-serif';
                    ctx.fillStyle = '#fb7185';
                    ctx.textAlign = 'center';
                    ctx.fillText('🩸 PUPPET!', 0, -43);
                } else if (elevZ >= 16 && !isEnemy) {
                    ctx.font = 'bold 9px Inter, sans-serif';
                    ctx.fillStyle = '#38bdf8';
                    ctx.textAlign = 'center';
                    ctx.fillText('⛰️ HIGH GROUND +25%', 0, -43);
                }

                ctx.restore();
            }

            drawElementalStanceAura(ctx, u) {
                ctx.save();
                if (u.isT101s) {
                    ctx.strokeStyle = 'rgba(244, 63, 94, 0.75)';
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.ellipse(0, -14, 18, 8, this.gameTime * 2.5, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (u.bender) {
                    const bSpec = BENDING_SPECS[u.bender];
                    ctx.strokeStyle = bSpec.color;
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.ellipse(0, -14, 16, 7, this.gameTime * 3, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            }

            drawArticulatedSiegeEngine(ctx, se, light) {
                ctx.save();
                const elevY = -(se.terrainZ || 0);
                ctx.translate(0, elevY);

                if (this.selectedIds.includes(se.id)) {
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.ellipse(0, 6, 34, 16, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = `rgba(0,0,0,${light ? light.shadowAlpha : 0.42})`;
                ctx.beginPath();
                ctx.ellipse(8, 9, 32, 13, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.scale(se.facing || 1, 1);

                if (se.kind === 'trebuchet') {
                    ctx.fillStyle = '#5c2808';
                    ctx.fillRect(-24, 0, 48, 7);
                    ctx.strokeStyle = '#78350f';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(-16, 2); ctx.lineTo(0, -32); ctx.lineTo(16, 2);
                    ctx.stroke();

                    const swingAng = -0.5 + Math.sin(se.armAnim * Math.PI) * 1.4;
                    ctx.save();
                    ctx.translate(0, -30);
                    ctx.rotate(swingAng);
                    ctx.strokeStyle = '#b45309';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(-12, 0); ctx.lineTo(28, 0);
                    ctx.stroke();
                    ctx.fillStyle = '#57534e';
                    ctx.fillRect(-16, 2, 10, 10);
                    ctx.restore();
                } else {
                    const ramSurge = Math.sin(se.armAnim * Math.PI) * 11;
                    ctx.fillStyle = '#451a03';
                    ctx.fillRect(-20 + ramSurge, -13, 40, 7);
                    ctx.fillStyle = '#e7e5e4';
                    ctx.beginPath();
                    ctx.arc(20 + ramSurge, -10, 7.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#78350f';
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-24, -6); ctx.lineTo(0, -22); ctx.lineTo(24, -6);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                [-15, 15].forEach(wx => {
                    ctx.save();
                    ctx.translate(wx, 6);
                    ctx.rotate(se.wheelPhase || 0);
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 7, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                });

                ctx.restore();
            }

            renderXRayOcclusionPass(ctx, invTilt) {
                for (let i = 0; i < this.villagers.length; i++) {
                    const u = this.villagers[i];
                    if (!u._isOccluded) continue;
                    u._isOccluded = false;
                    if (!this.isVisibleInFrustum(u.x, u.y, 80)) continue;
                    const rx = wrapDX(this.cam.x, u.x);
                    const ry = u.y - this.cam.y;
                    const elevY = -(u.terrainZ || 0) - (u.isT101s ? (u.skySoar ? 24 : 12) : 0);

                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(1, invTilt);
                    ctx.translate(0, elevY);
                    ctx.strokeStyle = u.isT101s ? '#fde047' : '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([3, 2]);
                    ctx.beginPath();
                    ctx.arc(0, -26, 6.5, 0, Math.PI * 2);
                    ctx.roundRect(-6.5, -20, 13, 15, 3);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.restore();
                }
            }

            renderCombatAndBendingVFX(ctx, invTilt) {
                const hero = this.villagers.find(u => u.isT101s);
                if (hero) {
                    const hx = wrapDX(this.cam.x, hero.x);
                    const hy = hero.y - this.cam.y - 28;
                    for (let i = 0; i < this.enemies.length; i++) {
                        const e = this.enemies[i];
                        if ((e.puppetTimer || 0) <= 0) continue;
                        const ex = wrapDX(this.cam.x, e.x);
                        const ey = e.y - this.cam.y - 22;
                        ctx.strokeStyle = 'rgba(244, 63, 94, 0.85)';
                        ctx.lineWidth = 1.6;
                        for (let f = -2; f <= 2; f++) {
                            ctx.beginPath();
                            ctx.moveTo(hx + f * 2, hy);
                            ctx.quadraticCurveTo((hx + ex) * 0.5, Math.min(hy, ey) - 28 + f * 6, ex + f * 3, ey);
                            ctx.stroke();
                        }
                    }
                }

                for (let i = 0; i < this.singularities.length; i++) {
                    const sg = this.singularities[i];
                    const rx = wrapDX(this.cam.x, sg.x);
                    const ry = sg.y - this.cam.y;
                    const curR = sg.maxR * (1 - sg.life / 1.35);
                    ctx.strokeStyle = '#f43f5e';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(rx, ry, curR, 0, Math.PI * 2);
                    ctx.stroke();
                }

                for (let i = 0; i < this.lightningArcs.length; i++) {
                    const la = this.lightningArcs[i];
                    const x1 = wrapDX(this.cam.x, la.x1), y1 = la.y1 - this.cam.y;
                    const x2 = wrapDX(this.cam.x, la.x2), y2 = la.y2 - this.cam.y;
                    ctx.strokeStyle = la.color || '#f43f5e';
                    ctx.lineWidth = 2.4;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo((x1 + x2) * 0.5 + (Math.random() - 0.5) * 18, (y1 + y2) * 0.5 + (Math.random() - 0.5) * 18);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }

                for (let i = 0; i < this.healingBeams.length; i++) {
                    const hb = this.healingBeams[i];
                    const x1 = wrapDX(this.cam.x, hb.x1), y1 = hb.y1 - this.cam.y;
                    const x2 = wrapDX(this.cam.x, hb.x2), y2 = hb.y2 - this.cam.y;
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.quadraticCurveTo((x1 + x2) * 0.5, (y1 + y2) * 0.5 - 16, x2, y2);
                    ctx.stroke();
                }

                for (let i = 0; i < this.projectiles.length; i++) {
                    const p = this.projectiles[i];
                    const wx = p.x + wrapDX(p.x, p.tx) * p.progress;
                    const wy = p.y + (p.ty - p.y) * p.progress - Math.sin(p.progress * Math.PI) * p.arcHeight;
                    const rx = wrapDX(this.cam.x, wx);
                    const ry = wy - this.cam.y;
                    ctx.fillStyle = p.color || '#fde047';
                    ctx.beginPath();
                    ctx.arc(rx, ry, p.kind === 'arrow' ? 3.5 : 6.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (let i = 0; i < this.targetRings.length; i++) {
                    const tr = this.targetRings[i];
                    const rx = wrapDX(this.cam.x, tr.x);
                    const ry = tr.y - this.cam.y;
                    ctx.strokeStyle = tr.color;
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.arc(rx, ry, tr.maxRadius * (1 - tr.life * 0.5), 0, Math.PI * 2);
                    ctx.stroke();
                }

                for (let i = 0; i < this.floatTexts.length; i++) {
                    const ft = this.floatTexts[i];
                    const rx = wrapDX(this.cam.x, ft.x);
                    const ry = ft.y - this.cam.y - (1.1 - ft.life) * 28;
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.scale(1, invTilt);
                    ctx.font = 'bold 11px Inter, sans-serif';
                    ctx.fillStyle = ft.color;
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, 0, 0);
                    ctx.restore();
                }
            }

            renderVolumetricGodRays(ctx, W, H, light) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const rgb = light.isBloodMoon ? '244, 63, 94' : (light.isNight ? '56, 189, 248' : '253, 224, 71');
                const baseAlpha = light.isBloodMoon ? 0.09 : 0.06;

                for (let i = 0; i < this.godRays.length; i++) {
                    const gr = this.godRays[i];
                    const topX = ((gr.sx + this.gameTime * 0.004) % 1.1 - 0.05) * W;
                    const botX = topX + H * 0.4;
                    const grad = ctx.createLinearGradient(topX, 0, botX, H);
                    grad.addColorStop(0, `rgba(${rgb}, ${baseAlpha})`);
                    grad.addColorStop(1, `rgba(${rgb}, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(topX - gr.width * 0.4, 0);
                    ctx.lineTo(topX + gr.width * 0.4, 0);
                    ctx.lineTo(botX + gr.width, H);
                    ctx.lineTo(botX - gr.width, H);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }

            renderContinentalWeatherShader(ctx, W, H) {
                const cIdx = Math.floor(wrapX(this.cam.x) / 1600) % CONTINENTS.length;
                const colors = ['#bae6fd', '#fef08a', '#fb923c', '#fbcfe8', '#ffffff', '#fda4af'];
                ctx.fillStyle = colors[cIdx] || '#ffffff';
                for (let i = 0; i < this.weatherParticles.length; i++) {
                    const wp = this.weatherParticles[i];
                    const px = ((wp.x + this.gameTime * wp.spdX) % 1 + 1) % 1 * W;
                    const py = ((wp.y + this.gameTime * wp.spdY) % 1 + 1) % 1 * H;
                    ctx.beginPath();
                    ctx.arc(px, py, wp.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            render3DSphericalGlobe(ctx, W, H) {
                ctx.fillStyle = '#030712';
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = '#e2e8f0';
                for (let i = 0; i < this.globeStars.length; i++) {
                    const st = this.globeStars[i];
                    ctx.beginPath();
                    ctx.arc(st.x * W, st.y * H, st.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                const cx = W * 0.5, cy = H * 0.5;
                const R = Math.min(W, H) * 0.34;

                const oceanGrad = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
                oceanGrad.addColorStop(0, '#0284c7');
                oceanGrad.addColorStop(1, '#082f49');
                ctx.fillStyle = oceanGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, R, 0, Math.PI * 2);
                ctx.fill();

                for (let c = 0; c < CONTINENTS.length; c++) {
                    const cont = CONTINENTS[c];
                    const lon = (c / CONTINENTS.length) * Math.PI * 2 + this.globeYaw;
                    const z = Math.cos(lon);
                    if (z < -0.1) continue;
                    const sx = cx + Math.sin(lon) * R * 0.76;
                    const sy = cy + Math.sin(c * 1.2) * R * 0.22;

                    ctx.fillStyle = cont.color;
                    ctx.strokeStyle = cont.accent;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(sx, sy, R * 0.25 * Math.max(0.3, z), R * 0.32, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.font = 'bold 11px Inter, sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.fillText(cont.name, sx, sy - 6);
                    ctx.fillStyle = cont.isPlayer ? '#4ade80' : '#fb7185';
                    ctx.fillText(`${cont.popBillions.toFixed(2)}B Pop`, sx, sy + 10);
                }
            }

            renderMinimap() {
                if (!this.miniCtx || !this.miniCanvas) return;
                const mctx = this.miniCtx;
                const mw = this.miniCanvas.width;
                const mh = this.miniCanvas.height;
                mctx.clearRect(0, 0, mw, mh);

                for (let c = 0; c < CONTINENTS.length; c++) {
                    const cont = CONTINENTS[c];
                    mctx.fillStyle = cont.color;
                    mctx.fillRect((cont.xStart / WORLD_W) * mw, 0, (1600 / WORLD_W) * mw, mh);
                }

                mctx.fillStyle = '#0284c7';
                mctx.fillRect(0, (2620 / WORLD_H) * mh, mw, 3);

                for (let i = 0; i < this.villagers.length; i++) {
                    const u = this.villagers[i];
                    mctx.fillStyle = u.isT101s ? '#fde047' : '#4ade80';
                    mctx.fillRect((u.x / WORLD_W) * mw - 1.5, (u.y / WORLD_H) * mh - 1.5, 3, 3);
                }
                for (let i = 0; i < this.enemies.length; i++) {
                    const e = this.enemies[i];
                    mctx.fillStyle = '#f43f5e';
                    mctx.fillRect((e.x / WORLD_W) * mw - 1.5, (e.y / WORLD_H) * mh - 1.5, 3, 3);
                }

                mctx.strokeStyle = '#ffffff';
                mctx.lineWidth = 1.2;
                mctx.strokeRect((this.cam.x / WORLD_W) * mw - 8, (this.cam.y / WORLD_H) * mh - 6, 16, 12);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.game = new PrehistoricPlanetaryGame();
        });
    })();
    </script>
