<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Prehistoric Tribes: 2.5D Planetary Empire & The One Ring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        .tribal-font {
            font-family: 'Fredoka', cursive, sans-serif;
            letter-spacing: 0.02em;
        }
        #gameCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            touch-action: none;
        }
        .hud-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-interactive {
            pointer-events: auto;
        }
        .stone-panel {
            background: rgba(20, 17, 15, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(168, 162, 158, 0.35);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
        }
        .wood-btn {
            background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
            border: 1.5px solid #fbbf24;
            box-shadow: 0 2px 0 #451a03;
            transition: transform 0.08s ease, filter 0.12s ease;
        }
        .wood-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #451a03;
        }
        .stone-btn {
            background: linear-gradient(180deg, #44403c 0%, #292524 100%);
            border: 1.5px solid #78716c;
            box-shadow: 0 2px 0 #0c0a09;
            transition: transform 0.08s ease, filter 0.12s ease;
        }
        .stone-btn:active {
            transform: translateY(2px);
        }
        .ring-btn {
            background: linear-gradient(180deg, #991b1b 0%, #450a0a 100%);
            border: 1.5px solid #fde047;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.6), 0 2px 0 #270505;
        }
        .imperial-btn {
            background: linear-gradient(180deg, #6d28d9 0%, #3b0764 100%);
            border: 1.5px solid #c084fc;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.45), 0 2px 0 #1e0536;
        }
        .active-btn {
            outline: 2px solid #fde047;
            filter: brightness(1.15);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <!-- FULLSCREEN 2.5D PLANETARY & GLOBE CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- HUD OVERLAY LAYER -->
    <div class="hud-layer p-1.5 sm:p-2">

        <!-- TOP BAR: EPOCH AGE, RESOURCES, PLANETARY POP & ENGINE CONTROLS -->
        <div class="flex flex-col gap-1 w-full">
            <div class="hud-interactive stone-panel rounded-xl px-2 py-1 flex items-center justify-between gap-1.5 overflow-x-auto no-scrollbar">

                <!-- AGE OF EMPIRES EPOCH ADVANCEMENT BUTTON -->
                <div class="flex items-center gap-1.5 shrink-0">
                    <button id="btnAdvanceAge" onclick="game.advanceAge()" class="wood-btn px-2 py-0.5 rounded-lg flex items-center gap-1 text-amber-100 text-[11px] font-bold" title="Advance Civilization Epoch">
                        <span id="ageIcon">🪨</span>
                        <span id="ageTitle" class="tribal-font tracking-wide">Age I: Stone</span>
                        <span id="ageUpgradeHint" class="text-[9px] bg-black/50 px-1 rounded text-amber-300">⬆️Up</span>
                    </button>
                </div>

                <!-- STOCKPILE & SUPPLY CHAIN RESOURCES -->
                <div class="flex items-center gap-1 sm:gap-1.5 text-[11px] font-bold shrink-0">
                    <div class="flex items-center gap-1 bg-stone-900/90 px-1.5 py-0.5 rounded-md border border-amber-700/40" title="Timber">
                        <span>🪵</span><span id="resWood" class="text-amber-300">250</span>
                    </div>
                    <div class="flex items-center gap-1 bg-stone-900/90 px-1.5 py-0.5 rounded-md border border-stone-500/40" title="Stone">
                        <span>🪨</span><span id="resStone" class="text-stone-200">200</span>
                    </div>
                    <div class="flex items-center gap-1 bg-stone-900/90 px-1.5 py-0.5 rounded-md border border-orange-500/40" title="Roasted Sabre-Ribs">
                        <span>🍖</span><span id="resFood" class="text-orange-300">220</span>
                    </div>
                    <div class="flex items-center gap-1 bg-stone-900/90 px-1.5 py-0.5 rounded-md border border-yellow-500/40" title="Gold">
                        <span>🪙</span><span id="resGold" class="text-yellow-300">120</span>
                    </div>
                    <div class="flex items-center gap-1 bg-stone-900/90 px-1.5 py-0.5 rounded-md border border-red-500/40" title="Forged Weapons">
                        <span>⚔️</span><span id="resWeapons" class="text-red-300">15</span>
                    </div>
                    <div class="flex items-center gap-1 bg-indigo-950/90 px-2 py-0.5 rounded-md border border-indigo-400/50" title="Planetary Empire Population vs Rival Hordes">
                        <span>🌍</span>
                        <span id="resEmpirePop" class="text-indigo-200">1.48B</span>
                        <span class="text-stone-400 text-[9px]">vs</span>
                        <span id="resRivalPop" class="text-rose-400">3.80B</span>
                    </div>
                </div>

                <!-- TOP RIGHT: GLOBE, LIGHTING, WEATHER, 2.5D TILT, LASSO, FULLSCREEN & SAVE -->
                <div class="flex items-center gap-1 shrink-0">
                    <button id="btnGlobeToggle" onclick="game.toggleGlobeMode()" class="imperial-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-purple-100 flex items-center gap-1" title="Toggle 3D Rotating Spherical Earth Globe">
                        <span>🌐</span><span id="globeBtnLabel">3D Globe</span>
                    </button>

                    <button id="btnLightingMode" onclick="game.cycleLightingMode()" class="stone-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-200 flex items-center gap-1" title="Cycle Day / Sunset / Night / Blood Moon">
                        <span id="lightingIcon">🌓</span><span id="lightingLabel">Cycle</span>
                    </button>

                    <button id="btnWeatherToggle" onclick="game.toggleWeather()" class="stone-btn active-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-sky-200 flex items-center gap-1" title="Toggle Continental Weather Shaders">
                        <span>🌦️</span><span id="weatherBtnLabel">Weather</span>
                    </button>

                    <button id="btnCameraTilt" onclick="game.cycleCameraTilt()" class="stone-btn active-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-indigo-200 flex items-center gap-1" title="Cycle 2.5D Isometric Camera Tilt">
                        <span>📐</span><span id="tiltModeLabel">2.5D 55°</span>

                    <button id="btnLassoMode" onclick="game.toggleLassoMode()" class="stone-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-200 flex items-center gap-1" title="Toggle Box-Select Lasso vs Camera Pan">

                    <button onclick="game.toggleFullscreenLandscape()" class="stone-btn px-1.5 py-0.5 rounded-lg text-[10px] text-amber-300 font-bold" title="Fullscreen">⛶</button>

                    <button id="btnSaveGame" onclick="game.saveGameManual()" class="stone-btn px-1.5 py-0.5 rounded-lg text-[10px] text-emerald-300 font-bold" title="Save">💾</button>

                    <button id="btnResetGame" onclick="game.resetGameTap()" class="stone-btn px-1.5 py-0.5 rounded-lg text-[10px] text-rose-300 font-bold" title="Tap twice to Reset">🗑️</button>
                </div>
            </div>

            <!-- SUB-BAR: QUICK HERO & ARMY COMMANDS + TELEMETRY -->
            <div class="flex items-center justify-between gap-1 pointer-events-none">
                <div class="hud-interactive flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5">
                    <button onclick="game.focusHeroT101s()" class="ring-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-yellow-200 flex items-center gap-1 shrink-0">
                        <span>💍</span><span>t101s (One Ring)</span>
                    </button>
                    <button onclick="game.focusCampfire()" class="stone-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-orange-200 shrink-0">
                        🔥 Hearth
                    </button>
                    <button onclick="game.selectAllWarriors()" class="stone-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-sky-200 shrink-0">

                    </button>
                    <button onclick="game.trainCommander()" class="wood-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-100 shrink-0">

                    <button onclick="game.trainSiegeEngine()" class="imperial-btn px-2 py-0.5 rounded-lg text-[10px] font-bold text-amber-200 shrink-0">

                        🌀 Awaken
                    </button>
                    <button onclick="game.ascendSelectedToAvatar()" class="imperial-btn px-2 py-1 rounded-lg text-[10px] font-bold text-yellow-200">
                        🌟 Avatar
                    </button>

            </div>

            <!-- BUILD DOCK -->
            <div class="hud-interactive stone-panel rounded-xl p-1 flex items-center gap-1 overflow-x-auto no-scrollbar flex-1">
                <button id="btnMountsToggle" onclick="game.toggleMountsGlobal()" class="wood-btn px-2 py-1 rounded-lg flex flex-col items-center shrink-0 min-w-[50px]">
                    <span class="text-xs">🦣</span>
                    <span id="mountsBtnLabel" class="text-[9px] font-bold text-amber-100">Mounts</span>
                </button>
                <div id="buildButtonsContainer" class="flex items-center gap-1"></div>
            </div>

            <!-- WORLD WRAP MINIMAP -->
            <div class="hud-interactive stone-panel rounded-xl p-1 shrink-0 hidden sm:flex flex-col items-center">
                <div class="flex items-center justify-between w-full px-1 mb-0.5 text-[9px] text-amber-200 font-bold">
                    <span>🗺️ 6-Continent Map</span>
                    <span id="waveTimerLabel" class="text-rose-400">Raid: 55s</span>
                </div>
                <canvas id="minimapCanvas" width="168" height="68" class="rounded-lg border border-stone-600 cursor-pointer bg-slate-950"></canvas>

    <script>
    (() => {
        const WORLD_W = 9600;
        const WORLD_H = 4800;
        const SAVE_KEY = 'prehistoric_tribes_25d_playable_v1';

        const CONTINENTS = [
            { id: 0, name: 'Cradle of Aethelgard', xStart: 0,    xEnd: 1600, color: '#2e5a27', groundAlt: '#3b6e33', accent: '#4ade80', popBillions: 1.48, isPlayer: true },
            { id: 1, name: 'Gondwana Savanna',     xStart: 1600, xEnd: 3200, color: '#785c22', groundAlt: '#8f6e29', accent: '#facc15', popBillions: 0.75, isPlayer: false },
            { id: 2, name: 'Obsidian Ashlands',    xStart: 3200, xEnd: 4800, color: '#3b2322', groundAlt: '#4c2c2a', accent: '#f87171', popBillions: 0.82, isPlayer: false },
            { id: 3, name: 'Jade Highlands',       xStart: 4800, xEnd: 6400, color: '#1b4d3e', groundAlt: '#236350', accent: '#34d399', popBillions: 0.68, isPlayer: false },
            { id: 4, name: 'Boreal Mammoth Tundra',xStart: 6400, xEnd: 8000, color: '#334e58', groundAlt: '#436470', accent: '#38bdf8', popBillions: 0.65, isPlayer: false },
            { id: 5, name: 'Crimson Skull Empire', xStart: 8000, xEnd: 9600, color: '#451a23', groundAlt: '#5c222e', accent: '#fb7185', popBillions: 0.90, isPlayer: false }
        ];

        const EPOCHS = [
            { level: 0, name: 'Age I: Stone',    icon: '🪨', cost: { food: 120, wood: 120, stone: 80,  gold: 0 },   atkMult: 1.0,  hpMult: 1.0,  roofColor: '#92400e', wallColor: '#78350f' },
            { level: 1, name: 'Age II: Tool',    icon: '🪓', cost: { food: 220, wood: 200, stone: 160, gold: 60 },  atkMult: 1.25, hpMult: 1.25, roofColor: '#b45309', wallColor: '#57534e' },
            { level: 2, name: 'Age III: Bronze', icon: '🛡️', cost: { food: 360, wood: 300, stone: 260, gold: 150 }, atkMult: 1.55, hpMult: 1.55, roofColor: '#047857', wallColor: '#78716c' },
            { level: 3, name: 'Age IV: Imperial',icon: '👑', cost: null,                                            atkMult: 2.0,  hpMult: 2.0,  roofColor: '#6d28d9', wallColor: '#fbbf24' }
        ];

        const BUILDING_SPECS = {
            town_center: { name: 'Town Center',  icon: '🏛️', cost: { wood: 140, stone: 120 }, radius: 48, hp: 1200 },
            hut:         { name: 'Fur Hut',      icon: '🛖', cost: { wood: 35,  stone: 15  }, radius: 28, hp: 380  },
            sawmill:     { name: 'Sawmill',      icon: '🪚', cost: { wood: 40,  stone: 25  }, radius: 32, hp: 440  },
            quarry:      { name: 'Stone Quarry', icon: '⛏️', cost: { wood: 45,  stone: 25  }, radius: 32, hp: 460  },
            kitchen:     { name: 'Rib Kitchen',  icon: '🍖', cost: { wood: 45,  stone: 35  }, radius: 32, hp: 450  },
            forge:       { name: 'Bronze Forge', icon: '⚒️', cost: { wood: 55,  stone: 55  }, radius: 34, hp: 540  },
            barracks:    { name: 'War Citadel',  icon: '⚔️', cost: { wood: 75,  stone: 65  }, radius: 40, hp: 780  },
            shrine:      { name: 'Bender Shrine',icon: '🌀', cost: { wood: 65,  stone: 75  }, radius: 34, hp: 620  },
            tower:       { name: 'Watchtower',   icon: '🏹', cost: { wood: 50,  stone: 60  }, radius: 26, hp: 640  }
        };

        const FIGHTING_STYLES = {
            berserker:  { id: 'berserker',  name: 'Twin-Fang Berserker', icon: '🗡️', range: 44,  dmgMult: 1.25, speedMult: 1.15, blockChance: 0.12, color: '#f97316' },
            phalanx:    { id: 'phalanx',    name: 'Phalanx Shield-Wall', icon: '🛡️', range: 54,  dmgMult: 0.95, speedMult: 0.92, blockChance: 0.72, color: '#38bdf8' },
            kungfu:     { id: 'kungfu',     name: 'Crane & Mantis Kung-Fu', icon: '🥋', range: 48, dmgMult: 1.15, speedMult: 1.28, blockChance: 0.45, color: '#10b981' },
            archery:    { id: 'archery',    name: 'Sky-Volley Bowman',   icon: '🏹', range: 215, dmgMult: 1.05, speedMult: 1.05, blockChance: 0.10, color: '#eab308' },
            juggernaut: { id: 'juggernaut', name: 'Mammoth-Maul Juggernaut', icon: '🔨', range: 52, dmgMult: 1.65, speedMult: 0.86, blockChance: 0.30, color: '#a855f7' },
            blood_ring: { id: 'blood_ring', name: 'One Ring Blood-Art',  icon: '💍', range: 245, dmgMult: 1.85, speedMult: 1.45, blockChance: 0.65, color: '#f43f5e' }
        };

        const BENDING_SPECS = {
            water:  { name: 'Waterbender',  icon: '💧', color: '#38bdf8', range: 195 },
            earth:  { name: 'Earthbender',  icon: '🪨', color: '#d97706', range: 185 },
            fire:   { name: 'Firebender',   icon: '🔥', color: '#f97316', range: 205 },
            air:    { name: 'Airbender',    icon: '🌪️', color: '#a7f3d0', range: 210 },
            avatar: { name: 'Avatar State', icon: '🌟', color: '#fde047', range: 255 }
        };

        function wrapX(x) {
            return ((x % WORLD_W) + WORLD_W) % WORLD_W;
        }
        function wrapDX(x1, x2) {
            let dx = x2 - x1;
            if (dx > WORLD_W * 0.5) dx -= WORLD_W;
            if (dx < -WORLD_W * 0.5) dx += WORLD_W;
            return dx;
        }
        function wrappedDist(x1, y1, x2, y2) {
            return Math.hypot(wrapDX(x1, x2), y2 - y1);
        }

        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) this.ctx = new AC();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            play(type) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    if (type === 'ring') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(520, now);
                        osc.frequency.exponentialRampToValueAtTime(190, now + 0.3);
                        gain.gain.setValueAtTime(0.11, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                    } else if (type === 'horn') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(140, now);
                        osc.frequency.linearRampToValueAtTime(220, now + 0.38);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                    } else if (type === 'chop') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(180, now);
                        osc.frequency.exponentialRampToValueAtTime(60, now + 0.09);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.09);
                        osc.start(now);
                        osc.stop(now + 0.09);
                    } else {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(110, now + 0.11);
                        gain.gain.setValueAtTime(0.06, now);
                        gain.gain.linearRampToValueAtTime(0.001, now + 0.11);
                        osc.start(now);
                        osc.stop(now + 0.11);
                    }
                } catch (e) {}
            }
        }

        class SpatialGrid {
            constructor(cellSize = 320) {
                this.cellSize = cellSize;
                this.buckets = new Map();
            }
            clear() {
                this.buckets.clear();
            }
            _key(cx, cy) {
                return `${cx},${cy}`;
            }
            insert(entity) {
                const cx = Math.floor(wrapX(entity.x) / this.cellSize);
                const cy = Math.floor(entity.y / this.cellSize);
                const k = this._key(cx, cy);
                let arr = this.buckets.get(k);
                if (!arr) {
                    arr = [];
                    this.buckets.set(k, arr);
                }
                arr.push(entity);
            }
            queryRadius(x, y, radius, filterFn = null) {
                const results = [];
                const cellSpan = Math.ceil(radius / this.cellSize);
                const centerCX = Math.floor(wrapX(x) / this.cellSize);
                const centerCY = Math.floor(y / this.cellSize);
                const maxCols = Math.ceil(WORLD_W / this.cellSize);

                for (let dx = -cellSpan; dx <= cellSpan; dx++) {
                    const cx = ((centerCX + dx) % maxCols + maxCols) % maxCols;
                    for (let dy = -cellSpan; dy <= cellSpan; dy++) {
                        const cy = centerCY + dy;
                        const bucket = this.buckets.get(this._key(cx, cy));
                        if (!bucket) continue;
                        for (let i = 0; i < bucket.length; i++) {
                            const e = bucket[i];
                            if (wrappedDist(x, y, e.x, e.y) <= radius) {
                                if (!filterFn || filterFn(e)) results.push(e);
                            }
                        }
                    }
                }
                return results;
            }
        }

            getTerrainElevation(x, y) {
                const localX = ((wrapX(x) % 1600) + 1600) % 1600;
                if (y >= 1520 && y <= 1755) return 32;
                if (y > 1755 && y <= 1845) {
                    if (Math.abs(localX - 320) < 52 || Math.abs(localX - 800) < 58 || Math.abs(localX - 1280) < 52) {
                        const t = 1 - (y - 1755) / 90;
                        return Math.round(t * 32);
                    }
                }
                if (y >= 2585 && y <= 2715) {
                    if (Math.abs(localX - 610) < 38 || Math.abs(localX - 990) < 38) {
                        const arch = Math.sin(((y - 2585) / 130) * Math.PI);
                        return Math.round(14 + arch * 12);
                    }
                }
                return 0;
            }

            getRiverCenterY(x) {
                const localX = ((wrapX(x) % 1600) + 1600) % 1600;
                return 2650 + Math.sin((localX / 1600) * Math.PI * 2) * 32;
            }

            autoLinkSettlerRoad(newB) {
                if (this.buildings.length <= 1) return;
                let nearest = null;
                let bestD = Infinity;
                for (let i = 0; i < this.buildings.length; i++) {
                    const b = this.buildings[i];
                    if (b.id === newB.id) continue;
                    const d = wrappedDist(newB.x, newB.y, b.x, b.y);
                    if (d < bestD && d < 650) {
                        bestD = d;
                        nearest = b;
                    }
                }
                if (nearest) {
                    const road = { id: 'rd_' + this.roads.length, x1: nearest.x, y1: nearest.y, x2: newB.x, y2: newB.y };
                    this.roads.push(road);
                    const cargoTypes = ['wood', 'stone', 'food', 'weapons'];
                    this.porters.push({
                        roadId: road.id,
                        x1: road.x1,
                        y1: road.y1,
                        x2: road.x2,
                        y2: road.y2,
                        t: Math.random(),
                        dir: 1,
                        cargo: cargoTypes[this.porters.length % cargoTypes.length],
                        wheelPhase: 0
                    });
                }
            }

            isPointNearRoad(x, y) {
                for (let i = 0; i < this.roads.length; i++) {
                    const r = this.roads[i];
                    const mx = (r.x1 + r.x2) * 0.5;
                    const my = (r.y1 + r.y2) * 0.5;
                    if (wrappedDist(x, y, mx, my) < 95) return true;
                }
                return false;
            }

            advanceAge() {
                if (this.ageLevel >= EPOCHS.length - 1) {
                    this.showBanner('👑', 'Already at Maximum Imperial Avatar Age!');
                    return;
                }
                const cur = EPOCHS[this.ageLevel];
                const cost = cur.cost;
                if (this.resources.food < cost.food || this.resources.wood < cost.wood || this.resources.stone < cost.stone || this.resources.gold < cost.gold) {
                    this.showBanner('⚠️', `Need ${cost.food}🍖 ${cost.wood}🪵 ${cost.stone}🪨 ${cost.gold}🪙 to Advance Age!`);
                    return;
                }
                this.resources.food -= cost.food;
                this.resources.wood -= cost.wood;
                this.resources.stone -= cost.stone;
                this.resources.gold -= cost.gold;
                this.ageLevel++;
                const nextEp = EPOCHS[this.ageLevel];
                this.villagers.forEach(u => {
                    u.maxHp = Math.round(u.maxHp * 1.22);
                    u.hp = u.maxHp;
                    u.atk = Math.round(u.atk * 1.22);
                });
                this.sfx.play('horn');
                this.addScreenShake(8, 0.35);
                this.showBanner(nextEp.icon, `Advanced to ${nextEp.name}! All Units & Architecture Upgraded!`);
                this.updateHUD();
                this.saveGame();

            getLightingState() {
                let mode = this.lightingMode;
                if (mode === 0) {
                    const phase = (this.gameTime % 120) / 120;
                    if (phase < 0.45) mode = 1;
                    else if (phase < 0.65) mode = 2;
                    else if (phase < 0.85) mode = 3;
                    else mode = 4;
                }
                if (mode === 1) return { isNight: false, isBloodMoon: false, shadowDX: 9, shadowDY: 5, shadowAlpha: 0.34, tint: null };
                if (mode === 2) return { isNight: false, isBloodMoon: false, shadowDX: 15, shadowDY: 6, shadowAlpha: 0.42, tint: 'rgba(249, 115, 22, 0.12)' };
                if (mode === 3) return { isNight: true,  isBloodMoon: false, shadowDX: -8, shadowDY: 5, shadowAlpha: 0.46, tint: 'rgba(15, 23, 42, 0.38)' };
                return { isNight: true, isBloodMoon: true, shadowDX: -10, shadowDY: 6, shadowAlpha: 0.48, tint: 'rgba(159, 18, 57, 0.24)' };
            }

                const curIdx = elems.indexOf(unit.bender);

                    this.showBanner('⚠️', `Need ${spec.cost.wood}🪵 Wood & ${spec.cost.stone}🪨 Stone for ${spec.name}!`);
                    return;
                }
                this.buildMode = type;
                this.buildPos = { x: wrapX(this.cam.x), y: this.cam.y };
                const bar = document.getElementById('buildConfirmBar');
                const title = document.getElementById('buildConfirmTitle');
                if (bar) bar.classList.remove('hidden');
                if (title) title.textContent = `${spec.icon} Tap map to position ${spec.name}`;
            }

            cancelBuildMode() {
                this.buildMode = null;
                const bar = document.getElementById('buildConfirmBar');
                if (bar) bar.classList.add('hidden');
            }

            confirmBuildPlacement() {
                if (!this.buildMode) return;
                const spec = BUILDING_SPECS[this.buildMode];
                if (this.resources.wood < spec.cost.wood || this.resources.stone < spec.cost.stone) {
                    this.showBanner('⚠️', 'Not enough resources!');
                    this.cancelBuildMode();
                    return;
                }
                this.resources.wood -= spec.cost.wood;
                this.resources.stone -= spec.cost.stone;
                const b = this.placeBuildingImmediate(this.buildMode, this.buildPos.x, this.buildPos.y, false);
                this.cancelBuildMode();
                this.sfx.play('chop');
                this.updateHUD();
                this.showBanner(spec.icon, `Constructing ${spec.name} + Linked Cobblestone Road!`);
                this.saveGame();

                setTxt('resWood', Math.floor(this.resources.wood));
                setTxt('resStone', Math.floor(this.resources.stone));
                setTxt('resFood', Math.floor(this.resources.food));
                setTxt('resGold', Math.floor(this.resources.gold));
                setTxt('resWeapons', Math.floor(this.resources.weapons));
                setTxt('resEmpirePop', `${this.empirePopBillions.toFixed(2)}B`);
                setTxt('resRivalPop', `${this.rivalPopBillions.toFixed(2)}B`);
                setTxt('armyCountLabel', this.villagers.length);

                const ep = EPOCHS[this.ageLevel];
                setTxt('ageIcon', ep.icon);
                setTxt('ageTitle', ep.name);
                setTxt('ageUpgradeHint', ep.cost ? `${ep.cost.food}🍖` : 'MAX');

            updateInspector() {
                const u = this.getSelectedUnit();
                if (!u) return;
                const setTxt = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = val;
                };
                const styleSpec = FIGHTING_STYLES[u.fightingStyle] || FIGHTING_STYLES.berserker;
                const bSpec = u.bender ? BENDING_SPECS[u.bender] : null;

                setTxt('inspAvatar', u.isT101s ? '💍' : (bSpec ? bSpec.icon : styleSpec.icon));
                setTxt('inspName', u.name);
                setTxt('inspRoleBadge', u.isT101s ? 'One Ring 🪽' : (bSpec ? bSpec.name : (u.mountType ? `Mounted ${u.mountType}` : u.role)));
                setTxt('inspHp', `HP ${Math.ceil(u.hp)}/${u.maxHp}`);
                setTxt('inspStyle', `${styleSpec.icon} ${styleSpec.name.split(' ')[0]}`);
                setTxt('flightStateLabel', u.skySoar ? 'Sky-Soar ON' : 'Hovering');

            // =====================================================================
            // SAVE & LOAD SYSTEM (localStorage)
            // =====================================================================
            saveGame() {
                try {
                    const state = {
                        ageLevel: this.ageLevel,
                        resources: this.resources,
                        empirePopBillions: this.empirePopBillions,
                        rivalPopBillions: this.rivalPopBillions,
                        wave: this.wave,
                        villagers: this.villagers,
                        siegeEngines: this.siegeEngines,
                        buildings: this.buildings,
                        roads: this.roads
                    };
                    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
                } catch (e) {}
            }

            saveGameManual() {
                this.saveGame();
                this.showBanner('💾', 'Planetary Empire, Benders & Hero t101s Saved!');
            }

            loadGame() {
                try {
                    const raw = localStorage.getItem(SAVE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (!data || !Array.isArray(data.villagers) || data.villagers.length === 0) return false;
                    this. initFreshPlanet();
                    this.ageLevel = data.ageLevel || 0;
                    this.resources = Object.assign(this.resources, data.resources || {});
                    this.empirePopBillions = data.empirePopBillions || 1.48;
                    this.rivalPopBillions = data.rivalPopBillions || 3.80;
                    this.wave = data.wave || 1;
                    this.villagers = data.villagers;
                    if (Array.isArray(data.siegeEngines) && data.siegeEngines.length > 0) {
                        this.siegeEngines = data.siegeEngines;
                    }
                    if (Array.isArray(data.buildings) && data.buildings.length > 0) {
                        this.buildings = data.buildings;
                    }
                    if (Array.isArray(data.roads) && data.roads.length > 0) {
                        this.roads = data.roads;
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            }

            resetGameTap() {
                if (this.resetConfirmTimer > 0) {
                    localStorage.removeItem(SAVE_KEY);
                    this.ageLevel = 0;
                    this.resources = { wood: 260, stone: 220, food: 240, gold: 130, weapons: 16 };
                    this.initFreshPlanet();
                    this.resetConfirmTimer = 0;
                    this.updateHUD();
                    this.updateInspector();
                    this.showBanner('🔄', 'Planet Reset to Fresh Stone Age Valley!');
                } else {
                    this.resetConfirmTimer = 3.5;
                    this.showBanner('⚠️', 'Tap 🗑️ Reset again within 3s to confirm fresh restart');
                }
            }

            // =====================================================================
            // INPUT & MULTI-TOUCH / MOUSE CONTROLS
            // =====================================================================
            bindInputEvents() {
                let isPointerDown = false;
                let startX = 0, startY = 0;
                let lastX = 0, lastY = 0;
                let movedDist = 0;
                let pinchDist0 = 0;
                let pinchZoom0 = 0.72;

                this.canvas.addEventListener('pointerdown', (e) => {
                    this.sfx.init();
                    isPointerDown = true;
                    startX = lastX = e.clientX;
                    startY = lastY = e.clientY;
                    movedDist = 0;
                    if (this.lassoMode && !this.globeMode) {
                        this.lassoRect = { x1: startX, y1: startY, x2: startX, y2: startY };
                    }
                });

                window.addEventListener('pointermove', (e) => {
                    if (!isPointerDown) return;
                    const dx = e.clientX - lastX;
                    const dy = e.clientY - lastY;
                    lastX = e.clientX;
                    lastY = e.clientY;
                    movedDist += Math.hypot(dx, dy);

                    if (this.globeMode) {
                        this.globeYaw -= dx * 0.007;
                        return;
                    }

                    if (this.lassoMode && this.lassoRect) {
                        this.lassoRect.x2 = e.clientX;
                        this.lassoRect.y2 = e.clientY;
                        return;
                    }

                    this.cam.targetX = wrapX(this.cam.targetX - dx / this.cam.zoom);
                    this.cam.targetY = Math.max(250, Math.min(WORLD_H - 250, this.cam.targetY - dy / (this.cam.zoom * this.camTiltY)));
                });

                window.addEventListener('pointerup', (e) => {
                    if (!isPointerDown) return;
                    isPointerDown = false;

                    if (this.lassoMode && this.lassoRect && movedDist > 14) {
                        this.finishLassoSelection();
                        this.lassoRect = null;
                        return;
                    }
                    this.lassoRect = null;

                    if (movedDist < 12) {
                        if (this.globeMode) {
                            this.handleGlobeTap(e.clientX, e.clientY);
                        } else {
                            this.handleWorldTap(e.clientX, e.clientY);
                        }
                    }
                });

                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const factor = e.deltaY > 0 ? 0.9 : 1.1;
                    this.cam.targetZoom = Math.max(0.28, Math.min(1.65, this.cam.targetZoom * factor));
                }, { passive: false });

                this.canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        pinchDist0 = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        pinchZoom0 = this.cam.targetZoom;
                    }
                }, { passive: true });

                this.canvas.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && pinchDist0 > 10) {
                        const d = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        this.cam.targetZoom = Math.max(0.28, Math.min(1.65, pinchZoom0 * (d / pinchDist0)));
                    }
                }, { passive: true });

                if (this.miniCanvas) {
                    this.miniCanvas.addEventListener('pointerdown', (e) => {
                        const rect = this.miniCanvas.getBoundingClientRect();
                        const rx = (e.clientX - rect.left) / rect.width;
                        const ry = (e.clientY - rect.top) / rect.height;
                        this.globeMode = false;
                        this.cam.targetX = wrapX(rx * WORLD_W);
                        this.cam.targetY = Math.max(300, Math.min(WORLD_H - 300, ry * WORLD_H));
                    });
                }
            }

            finishLassoSelection() {
                const r = this.lassoRect;
                if (!r) return;
                const minX = Math.min(r.x1, r.x2), maxX = Math.max(r.x1, r.x2);
                const minY = Math.min(r.y1, r.y2), maxY = Math.max(r.y1, r.y2);
                const picked = [];
                this.villagers.forEach(u => {
                    const sp = this.getScreenPos(u.x, u.y);
                    if (sp.sx >= minX && sp.sx <= maxX && sp.sy >= minY && sp.sy <= maxY) {
                        picked.push(u.id);
                    }
                });
                if (picked.length > 0) {
                    this.selectedIds = picked;
                    this.updateInspector();
                    this.showBanner('🔲', `Selected ${picked.length} Units!`);
                }
            }

            screenToWorld(sx, sy) {
                const dx = (sx - this.canvas.width * 0.5) / this.cam.zoom;
                const dy = (sy - this.canvas.height * 0.5) / (this.cam.zoom * this.camTiltY);
                return {
                    x: wrapX(this.cam.x + dx),
                    y: Math.max(180, Math.min(WORLD_H - 180, this.cam.y + dy))
                };
            }

            getScreenPos(wx, wy) {
                const dx = wrapDX(this.cam.x, wx);
                const dy = wy - this.cam.y;
                return {
                    sx: this.canvas.width * 0.5 + dx * this.cam.zoom,
                    sy: this.canvas.height * 0.5 + dy * this.cam.zoom * this.camTiltY
                };
            }

            handleGlobeTap(sx, sy) {
                const cx = this.canvas.width * 0.5;
                const cy = this.canvas.height * 0.5;
                const R = Math.min(this.canvas.width, this.canvas.height) * 0.34;
                if (Math.hypot(sx - cx, sy - cy) <= R * 1.15) {
                    const relX = (sx - cx) / R;
                    const lon = Math.asin(Math.max(-1, Math.min(1, relX))) - this.globeYaw;
                    const norm = ((lon / (Math.PI * 2)) % 1 + 1) % 1;
                    this.cam.targetX = wrapX(norm * WORLD_W);
                    this.cam.targetY = 2340;
                    this.globeMode = false;
                    const cIdx = Math.floor(this.cam.targetX / 1600) % CONTINENTS.length;
                    this.showBanner('🌍', `Dropped into ${CONTINENTS[cIdx].name}!`);
                }
            }

            handleWorldTap(sx, sy) {
                const wp = this.screenToWorld(sx, sy);

                if (this.buildMode) {
                    this.buildPos = wp;
                    return;
                }

                // 1. Select friendly unit or Siege Engine
                const tappedUnit = this.villagers.find(u => wrappedDist(wp.x, wp.y, u.x, u.y) < 36) ||
                                   this.siegeEngines.find(se => wrappedDist(wp.x, wp.y, se.x, se.y) < 44);
                if (tappedUnit) {
                    this.selectedIds = [tappedUnit.id];
                    this.updateInspector();
                    return;
                }

                // 2. Attack enemy raider or stronghold
                const tappedEnemy = this.enemies.find(e => wrappedDist(wp.x, wp.y, e.x, e.y) < 42) ||
                                    this.strongholds.find(s => wrappedDist(wp.x, wp.y, s.x, s.y) < s.radius + 18);
                if (tappedEnemy && this.selectedIds.length > 0) {
                    this.selectedIds.forEach(id => {
                        const u = this.villagers.find(v => v.id === id) || this.siegeEngines.find(s => s.id === id);
                        if (u) {
                            u.targetEntityId = tappedEnemy.id;
                            u.targetX = null;
                            u.targetY = null;
                        }
                    });
                    this.targetRings.push({ x: tappedEnemy.x, y: tappedEnemy.y, maxRadius: 42, color: '#f43f5e', life: 1.0 });
                    return;
                }

                // 3. Harvest resource node
                const tappedNode = this.nodes.find(n => wrappedDist(wp.x, wp.y, n.x, n.y) < 38);
                if (tappedNode && this.selectedIds.length > 0) {
                    this.selectedIds.forEach(id => {
                        const u = this.villagers.find(v => v.id === id);
                        if (u) {
                            u.targetEntityId = tappedNode.id;
                            u.targetX = null;
                            u.targetY = null;
                        }
                    });
                    this.targetRings.push({ x: tappedNode.x, y: tappedNode.y, maxRadius: 36, color: '#fbbf24', life: 1.0 });
                    return;
                }

                // 4. Move selected units in formation
                if (this.selectedIds.length > 0) {
                    this.selectedIds.forEach((id, idx) => {
                        const u = this.villagers.find(v => v.id === id) || this.siegeEngines.find(s => s.id === id);
                        if (u) {
                            const row = Math.floor(idx / 3);
                            const col = (idx % 3) - 1;
                            u.targetEntityId = null;
                            u.targetX = wrapX(wp.x + col * 28);
                            u.targetY = Math.max(200, Math.min(WORLD_H - 200, wp.y + row * 28));
                        }
                    });
                    this.targetRings.push({ x: wp.x, y: wp.y, maxRadius: 34, color: '#4ade80', life: 1.0 });
                }
            }

            // =====================================================================
            // SIMULATION UPDATE LOOP
            // =====================================================================
            addScreenShake(intensity = 7, duration = 0.3) {
                this.screenShake.intensity = Math.max(this.screenShake.intensity, intensity);
                this.screenShake.timer = Math.max(this.screenShake.timer, duration);
                this.screenShake.maxTimer = Math.max(0.05, this.screenShake.timer);
            }

            launchUnitRagdoll(entity, vx, vy, vz = 140, spinDir = 1) {
                if (!entity) return;
                entity.vx = vx;
                entity.vy = vy;
                entity.velZ = Math.max(entity.velZ || 0, vz);
                entity.airborneZ = Math.max(entity.airborneZ || 0, 3);
                entity.ragdollSpin = spinDir * (7 + Math.random() * 4);
            }

            spawnParticle(x, y, vx, vy, color, size = 3, life = 0.5) {
                if (this.particles.length > 260) return;
                this.particles.push({ x: wrapX(x), y, vx, vy, color, size, life, maxLife: life });
            }

            spawnFloatText(x, y, text, color = '#fde047') {
                if (this.floatTexts.length > 40) return;
                this.floatTexts.push({ x: wrapX(x), y, text, color, life: 1.1 });
            }

            spawnSlashRibbon(x, y, facing, a0, a1, radius, color) {
                this.slashRibbons.push({ x: wrapX(x), y, facing, a0, a1, radius, color, life: 0.22, maxLife: 0.22 });
            }

            spawnTerrainDecal(x, y, kind, radius = 24) {
                if (this.terrainDecals.length > 90) this.terrainDecals.shift();
                this.terrainDecals.push({ x: wrapX(x), y, kind, radius, life: 14, maxLife: 14 });
            }

            spawnRockSpikeCluster(x, y, count = 3) {
                for (let i = 0; i < count; i++) {
                    this.rockSpikes.push({
                        x: wrapX(x + (Math.random() - 0.5) * 36),
                        y: y + (Math.random() - 0.5) * 20,
                        h: 18 + Math.random() * 14,
                        w: 9 + Math.random() * 5,
                        tilt: (Math.random() - 0.5) * 0.4,
                        life: 3.5,
                        maxLife: 3.5
                    });
                }
            }

            loop(now) {
                const rawDt = Math.min(0.05, Math.max(0.001, (now - this.lastTick) / 1000));
                this.lastTick = now;

                this._frames++;
                this._fpsTimer += rawDt;
                if (this._fpsTimer >= 0.5) {
                    this.fps = Math.round(this._frames / this._fpsTimer);
                    this._frames = 0;
                    this._fpsTimer = 0;
                    const fpsEl = document.getElementById('perfFps');
                    if (fpsEl) fpsEl.textContent = `${this.fps} FPS`;
                    const cIdx = Math.floor(wrapX(this.cam.x) / 1600) % CONTINENTS.length;
                    const cEl = document.getElementById('perfContinent');
                    if (cEl) cEl.textContent = CONTINENTS[cIdx].name;
                }

                try {
                    this.update(rawDt);
                    this.render();
                } catch (err) {
                    console.error('Frame error recovered:', err);
                }

                requestAnimationFrame((t) => this.loop(t));
            }

            update(dt) {
                this.gameTime += dt;
                if (this.resetConfirmTimer > 0) this.resetConfirmTimer = Math.max(0, this.resetConfirmTimer - dt);
                if (this.screenShake.timer > 0) this.screenShake.timer = Math.max(0, this.screenShake.timer - dt);
                if (this.victoryCheerTimer > 0) this.victoryCheerTimer = Math.max(0, this.victoryCheerTimer - dt);

                // Rebuild Spatial Hash Grid
                this.spatialGrid.clear();
                for (let i = 0; i < this.villagers.length; i++) this.spatialGrid.insert(this.villagers[i]);
                for (let i = 0; i < this.enemies.length; i++) this.spatialGrid.insert(this.enemies[i]);
                for (let i = 0; i < this.nodes.length; i++) this.spatialGrid.insert(this.nodes[i]);

                // Raid Wave Countdown
                this.raidTimer -= dt;
                if (this.raidTimer <= 0) {
                    this.triggerCannibalRaid();
                    this.raidTimer = 55;
                }
                const waveEl = document.getElementById('waveTimerLabel');
                if (waveEl) waveEl.textContent = `Raid: ${Math.ceil(this.raidTimer)}s`;

                // Update Settlers Porters & Buildings
                this.updateBuildingsAndPorters(dt);

                // Update Tribe Heroes, Benders & Commanders
                this.updateVillagers(dt);

                // Update 2.5D Siege Engines
                this.updateSiegeEngines(dt);

                // Update Enemies & Strongholds
                this.updateEnemies(dt);

                // Update Projectiles, Wildlife & FX
                this.updateProjectilesAndFX(dt);
            }

            updateBuildingsAndPorters(dt) {
                for (let i = 0; i < this.buildings.length; i++) {
                    const b = this.buildings[i];
                    if (!b.built) {
                        b.progress += dt * 22;
                        if (b.progress >= 100) {
                            b.built = true;
                            b.progress = 100;
                            this.showBanner('✅', `${b.name} Construction Complete!`);
                        }
                        continue;
                    }
                    b.prodTimer = (b.prodTimer || 0) + dt;
                    if (b.prodTimer >= 4.5) {
                        b.prodTimer = 0;
                        if (b.type === 'sawmill') this.resources.wood += 8;
                        else if (b.type === 'quarry') this.resources.stone += 7;
                        else if (b.type === 'kitchen') this.resources.food += 9;
                        else if (b.type === 'forge') { this.resources.weapons += 1; this.resources.gold += 4; }
                        else if (b.type === 'town_center') { this.resources.food += 4; this.resources.gold += 3; }
                        this.updateHUD();
                    }

                    if (b.type === 'tower') {
                        b.attackTimer = Math.max(0, (b.attackTimer || 0) - dt);
                        if (b.attackTimer <= 0) {
                            const nearEn = this.spatialGrid.queryRadius(b.x, b.y, 260, e => e.isEnemy && e.hp > 0);
                            if (nearEn.length > 0) {
                                b.attackTimer = 1.3;
                                this.projectiles.push({
                                    x: b.x,
                                    y: b.y - 42,
                                    tx: nearEn[0].x,
                                    ty: nearEn[0].y,
                                    targetId: nearEn[0].id,
                                    isEnemyProj: false,
                                    kind: 'fire',
                                    color: '#f97316',
                                    dmg: 28,
                                    progress: 0,
                                    speed: 2.4,
                                    arcHeight: 55
                                });
                            }
                        }
                    }
                }

                for (let i = 0; i < this.porters.length; i++) {
                    const p = this.porters[i];
                    p.t += dt * 0.22 * p.dir;
                    p.wheelPhase = (p.wheelPhase || 0) + dt * 7;
                    if (p.t >= 1) { p.t = 1; p.dir = -1; }
                    else if (p.t <= 0) { p.t = 0; p.dir = 1; }
                }
            }

            updateVillagers(dt) {
                for (let i = this.villagers.length - 1; i >= 0; i--) {
                    const u = this.villagers[i];
                    if (u.hp <= 0) {
                        if (u.isT101s) {
                            u.hp = u.maxHp; // The One Ring revives t101s
                            this.showBanner('💍', 'The One Ring restored t101s from the brink!');
                        } else {
                            this.villagers.splice(i, 1);
                            continue;
                        }
                    }

                    u.attackTimer = Math.max(0, u.attackTimer - dt);
                    u.swingAnim = Math.max(0, u.swingAnim - dt * 3.2);
                    u.kickAnim = Math.max(0, u.kickAnim - dt * 3.0);
                    u.victoryTimer = Math.max(0, (u.victoryTimer || 0) - dt);
                    u.onRoad = !u.skySoar && this.isPointNearRoad(u.x, u.y);
                    u.terrainZ = this.getTerrainElevation(u.x, u.y);

                    // Airborne Ragdoll Landing
                    if ((u.airborneZ || 0) > 0 || (u.velZ || 0) > 0) {
                        u.airborneZ = Math.max(0, (u.airborneZ || 0) + u.velZ * dt);
                        u.velZ -= 420 * dt;
                        if (u.airborneZ <= 0) {
                            u.airborneZ = 0;
                            u.velZ = 0;
                            u.ragdollSpin = 0;
                        }
                    }

                    // Waterbender Spirit Healing Beam to nearby wounded allies
                    if (u.bender === 'water' || u.bender === 'avatar') {
                        const wounded = this.villagers.find(ally => ally.hp < ally.maxHp && wrappedDist(u.x, u.y, ally.x, ally.y) < 160);
                        if (wounded) {
                            wounded.hp = Math.min(wounded.maxHp, wounded.hp + 12 * dt);
                            if (Math.random() < 0.18) {
                                this.healingBeams.push({ x1: u.x, y1: u.y - 18, x2: wounded.x, y2: wounded.y - 18, life: 0.25 });
                            }
                        }
                    }

                    // Check Enemy Target or Auto-Acquire Nearby Raider
                    let enemyTarget = null;
                    if (u.targetEntityId) {
                        enemyTarget = this.enemies.find(e => e.id === u.targetEntityId && e.hp > 0) ||
                                      this.strongholds.find(s => s.id === u.targetEntityId && s.hp > 0);
                    }
                    if (!enemyTarget) {
                        const nearEnemies = this.spatialGrid.queryRadius(u.x, u.y, 260, e => e.isEnemy && e.hp > 0);
                        if (nearEnemies.length > 0) enemyTarget = nearEnemies[0];
                    }

                    const styleSpec = FIGHTING_STYLES[u.fightingStyle] || FIGHTING_STYLES.berserker;
                    const benderSpec = u.bender ? BENDING_SPECS[u.bender] : null;

                    if (enemyTarget) {
                        const dist = wrappedDist(u.x, u.y, enemyTarget.x, enemyTarget.y);
                        const highGroundBonus = (u.terrainZ || 0) >= 16 ? 1.25 : 1.0;
                        const effRange = (u.isT101s ? 250 : (benderSpec ? benderSpec.range : styleSpec.range)) * highGroundBonus;
                        const dx = wrapDX(u.x, enemyTarget.x);
                        const dy = enemyTarget.y - u.y;
                        if (Math.abs(dx) > 2) u.facing = dx >= 0 ? 1 : -1;
                        u.moveAngle = Math.atan2(dy, dx);
                        u.aimPitch = Math.max(-0.55, Math.min(0.55, Math.atan2(dy, Math.max(18, Math.abs(dx)))));

                        if (dist > effRange) {
                            this.moveUnitToward(u, enemyTarget.x, enemyTarget.y, dt);
                        } else if (u.attackTimer <= 0) {
                            this.performUnitAttack(u, enemyTarget);
                        }
                        continue;
                    }

                    // Check Resource Harvesting Target
                    if (u.targetEntityId) {
                        const node = this.nodes.find(n => n.id === u.targetEntityId && n.amount > 0);
                        if (node) {
                            const d = wrappedDist(u.x, u.y, node.x, node.y);
                            if (d > 38) {
                                this.moveUnitToward(u, node.x, node.y, dt);
                            } else if (u.attackTimer <= 0) {
                                u.attackTimer = 0.85;
                                u.swingAnim = 1.0;
                                node.hitShakeTimer = 0.25;
                                node.amount -= 10;
                                if (node.type === 'wood') this.resources.wood += 6;
                                else if (node.type === 'stone') this.resources.stone += 6;
                                else if (node.type === 'gold') this.resources.gold += 5;
                                else this.resources.food += 6;
                                this.sfx.play('chop');
                                this.spawnFloatText(node.x, node.y - 26, '+6', '#fde047');
                                if (node.amount <= 0) {
                                    if (node.type === 'wood') {
                                        this.fallingTrees.push({ x: node.x, y: node.y, angle: 0, dir: u.facing || 1 });
                                    }
                                    this.nodes = this.nodes.filter(n => n.id !== node.id);
                                    u.targetEntityId = null;
                                }
                                this.updateHUD();
                            }
                            continue;
                        }
                    }

                    // Move to Waypoint
                    if (u.targetX !== null && u.targetY !== null) {
                        const d = wrappedDist(u.x, u.y, u.targetX, u.targetY);
                        if (d > 14) {
                            this.moveUnitToward(u, u.targetX, u.targetY, dt);
                        } else {
                            u.targetX = null;
                            u.targetY = null;
                            u.vx = 0;
                            u.vy = 0;
                        }
                    } else {
                        u.vx = 0;
                        u.vy = 0;
                    }
                }
            }

            moveUnitToward(u, tx, ty, dt) {
                const dx = wrapDX(u.x, tx);
                const dy = ty - u.y;
                const dist = Math.hypot(dx, dy) || 1;
                const styleSpec = FIGHTING_STYLES[u.fightingStyle] || FIGHTING_STYLES.berserker;
                let speed = 96 * styleSpec.speedMult;
                if (u.onRoad) speed *= 1.45;
                if (u.mountType) speed *= 1.35;
                if (u.isT101s && u.skySoar) speed *= 1.55;

                u.vx = (dx / dist) * speed;
                u.vy = (dy / dist) * speed;
                u.x = wrapX(u.x + u.vx * dt);
                u.y = Math.max(180, Math.min(WORLD_H - 180, u.y + u.vy * dt));
                if (Math.abs(dx) > 1) u.facing = dx >= 0 ? 1 : -1;
                u.moveAngle = Math.atan2(dy, dx);
                u.terrainZ = this.getTerrainElevation(u.x, u.y);
                u.walkPhase += dt * (u.onRoad ? 12 : 9);
            }

            performUnitAttack(u, target) {
                const styleSpec = FIGHTING_STYLES[u.fightingStyle] || FIGHTING_STYLES.berserker;
                const light = this.getLightingState();
                const bloodMoonBonus = light.isBloodMoon ? 1.35 : 1.0;
                const highGroundBonus = (u.terrainZ || 0) >= 16 ? 1.25 : 1.0;
                u.attackTimer = u.isT101s ? 0.78 : 1.02;
                u.swingAnim = 1.0;

                // 1. HERO t101s: THE ONE RING BLOODBENDING & PUPPET MASTERY
                if (u.isT101s) {
                    this.sfx.play('ring');
                    const dmg = u.atk * 1.65 * bloodMoonBonus * highGroundBonus;
                    target.hp -= dmg;
                    if (target.isEnemy) {
                        target.puppetTimer = 2.8;
                        target.puppetCasterId = u.id;
                        this.launchUnitRagdoll(target, (Math.random() - 0.5) * 90, (Math.random() - 0.5) * 60, 130, u.facing);
                    }
                    this.lightningArcs.push({ x1: u.x, y1: u.y - 24, x2: target.x, y2: target.y - 18, color: '#f43f5e', life: 0.35 });
                    this.spawnFloatText(target.x, target.y - 38, `🩸 PUPPET -${Math.round(dmg)}`, '#fb7185');
                    return;
                }

                // 2. AVATAR ELEMENTAL BENDING PROJECTILES
                if (u.bender) {
                    const bSpec = BENDING_SPECS[u.bender];
                    this.spawnSlashRibbon(u.x, u.y - 16, u.facing, -0.9, 1.0, 26, bSpec.color);
                    this.projectiles.push({
                        x: u.x,
                        y: u.y - 22 - (u.terrainZ || 0),
                        tx: target.x,
                        ty: target.y,
                        targetId: target.id,
                        isEnemyProj: false,
                        kind: u.bender,
                        color: bSpec.color,
                        dmg: u.atk * 1.35 * highGroundBonus,
                        progress: 0,
                        speed: 2.3,
                        arcHeight: u.bender === 'earth' ? 68 : 28
                    });
                    return;
                }

                // 3. SKY-VOLLEY ARCHERY
                if (u.fightingStyle === 'archery') {
                    for (let a = -1; a <= 1; a++) {
                        this.projectiles.push({
                            x: u.x,
                            y: u.y - 22 - (u.terrainZ || 0),
                            tx: target.x + a * 16,
                            ty: target.y + a * 10,
                            targetId: target.id,
                            isEnemyProj: false,
                            kind: 'arrow',
                            color: '#fde047',
                            dmg: u.atk * 0.55 * highGroundBonus,
                            progress: 0,
                            speed: 2.7,
                            arcHeight: 82 + Math.abs(a) * 14
                        });
                    }
                    return;
                }

                // 4. MELEE STYLES (Berserker, Phalanx, Kung-Fu, Juggernaut)
                if (u.fightingStyle === 'kungfu') u.kickAnim = 1.0;
                if (u.fightingStyle === 'juggernaut') {
                    this.fissures.push({ x: target.x, y: target.y, angle: u.moveAngle, life: 1.5 });
                    this.spawnRockSpikeCluster(target.x, target.y, 2);
                    this.addScreenShake(6, 0.22);
                }
                this.spawnSlashRibbon(u.x, u.y - 16, u.facing, -1.1, 1.1, 26, styleSpec.color);
                const dmg = u.atk * styleSpec.dmgMult * highGroundBonus;
                target.hp -= dmg;
                this.spawnFloatText(target.x, target.y - 30, `${styleSpec.icon} -${Math.round(dmg)}`, styleSpec.color);
            }

            updateSiegeEngines(dt) {
                for (let i = this.siegeEngines.length - 1; i >= 0; i--) {
                    const se = this.siegeEngines[i];
                    if (se.hp <= 0) {
                        this.siegeEngines.splice(i, 1);
                        continue;
                    }
                    se.attackTimer = Math.max(0, se.attackTimer - dt);
                    se.armAnim = Math.max(0, se.armAnim - dt * 2.2);
                    se.terrainZ = this.getTerrainElevation(se.x, se.y);

                    let target = null;
                    if (se.targetEntityId) {
                        target = this.enemies.find(e => e.id === se.targetEntityId && e.hp > 0) ||
                                 this.strongholds.find(s => s.id === se.targetEntityId && s.hp > 0);
                    }
                    if (!target) {
                        const near = this.spatialGrid.queryRadius(se.x, se.y, se.range + 140, e => e.isEnemy && e.hp > 0);
                        if (near.length > 0) target = near[0];
                    }

                    if (target) {
                        const d = wrappedDist(se.x, se.y, target.x, target.y);
                        const dx = wrapDX(se.x, target.x);
                        const dy = target.y - se.y;
                        if (Math.abs(dx) > 2) se.facing = dx >= 0 ? 1 : -1;
                        se.moveAngle = Math.atan2(dy, dx);

                        if (d > se.range) {
                            const spd = se.kind === 'ram' ? 68 : 54;
                            se.x = wrapX(se.x + (dx / d) * spd * dt);
                            se.y = Math.max(180, Math.min(WORLD_H - 180, se.y + (dy / d) * spd * dt));
                            se.wheelPhase += dt * 6.5;
                        } else if (se.attackTimer <= 0) {
                            se.attackTimer = se.kind === 'trebuchet' ? 2.5 : 1.8;
                            se.armAnim = 1.0;
                            if (se.kind === 'trebuchet') {
                                this.projectiles.push({
                                    x: se.x,
                                    y: se.y - 42 - (se.terrainZ || 0),
                                    tx: target.x,
                                    ty: target.y,
                                    targetId: target.id,
                                    isEnemyProj: false,
                                    kind: 'fire',
                                    color: '#f97316',
                                    dmg: se.atk,
                                    progress: 0,
                                    speed: 1.6,
                                    arcHeight: 140
                                });
                            } else {
                                this.addScreenShake(9, 0.3);
                                target.hp -= se.atk;
                                this.spawnRockSpikeCluster(target.x, target.y, 3);
                                this.spawnFloatText(target.x, target.y - 36, `🦣 RAM -${se.atk}!`, '#fde047');
                            }
                        }
                        continue;
                    }

                    if (se.targetX !== null && se.targetY !== null) {
                        const d = wrappedDist(se.x, se.y, se.targetX, se.targetY);
                        if (d > 16) {
                            const dx = wrapDX(se.x, se.targetX);
                            const dy = se.targetY - se.y;
                            const spd = se.kind === 'ram' ? 68 : 54;
                            se.x = wrapX(se.x + (dx / d) * spd * dt);
                            se.y = Math.max(180, Math.min(WORLD_H - 180, se.y + (dy / d) * spd * dt));
                            if (Math.abs(dx) > 2) se.facing = dx >= 0 ? 1 : -1;
                            se.wheelPhase += dt * 6.5;
                        } else {
                            se.targetX = null;
                            se.targetY = null;
                        }
                    }
                }
            }

            updateEnemies(dt) {
                for (let i = this.strongholds.length - 1; i >= 0; i--) {
                    const s = this.strongholds[i];
                    if (s.hp <= 0) {
                        const cont = CONTINENTS[s.continentIdx];
                        if (cont) cont.isPlayer = true;
                        this.empirePopBillions = +(this.empirePopBillions + 0.72).toFixed(2);
                        this.rivalPopBillions = Math.max(0, +(this.rivalPopBillions - 0.72).toFixed(2));
                        this.resources.gold += 150;
                        this.strongholds.splice(i, 1);
                        this.sfx.play('horn');
                        this.victoryCheerTimer = 4.0;
                        this.showBanner('🏆', `Conquered ${s.name}! +720M Population Annexed into Empire!`);
                        this.updateHUD();
                    }
                }

                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    if (e.hp <= 0) {
                        this.resources.gold += 6;
                        this.rivalPopBillions = Math.max(0, +(this.rivalPopBillions - 0.02).toFixed(2));
                        this.enemies.splice(i, 1);
                        this.updateHUD();
                        continue;
                    }

                    e.attackTimer = Math.max(0, e.attackTimer - dt);
                    e.swingAnim = Math.max(0, e.swingAnim - dt * 3.2);
                    e.puppetTimer = Math.max(0, (e.puppetTimer || 0) - dt);
                    e.terrainZ = this.getTerrainElevation(e.x, e.y);

                    if ((e.airborneZ || 0) > 0 || (e.velZ || 0) > 0) {
                        e.airborneZ = Math.max(0, (e.airborneZ || 0) + e.velZ * dt);
                        e.velZ -= 420 * dt;
                        if (e.airborneZ <= 0) {
                            e.airborneZ = 0;
                            e.velZ = 0;
                            e.ragdollSpin = 0;
                        }
                    }

                    // Bloodbent Puppet state: attacks fellow cannibals!
                    if (e.puppetTimer > 0) {
                        e.airborneZ = Math.max(e.airborneZ || 0, 22 + Math.sin(this.gameTime * 8 + i) * 5);
                        const otherEn = this.enemies.find(o => o.id !== e.id && wrappedDist(e.x, e.y, o.x, o.y) < 95);
                        if (otherEn && e.attackTimer <= 0) {
                            e.attackTimer = 0.9;
                            otherEn.hp -= e.atk;
                            this.spawnFloatText(otherEn.x, otherEn.y - 26, '🩸 BETRAYAL!', '#fb7185');
                        }
                        continue;
                    }

                    // Find nearest player unit or building
                    let target = null;
                    let bestD = Infinity;
                    for (let j = 0; j < this.villagers.length; j++) {
                        const u = this.villagers[j];
                        const d = wrappedDist(e.x, e.y, u.x, u.y);
                        if (d < bestD) { bestD = d; target = u; }
                    }
                    if (bestD > 420 && this.buildings.length > 0) {
                        const b = this.buildings[0];
                        const d = wrappedDist(e.x, e.y, b.x, b.y);
                        if (d < bestD) { bestD = d; target = b; }
                    }

                    if (target) {
                        const hitRange = 48;
                        if (bestD > hitRange) {
                            const dx = wrapDX(e.x, target.x);
                            const dy = target.y - e.y;
                            const dist = Math.hypot(dx, dy) || 1;
                            const spd = 76;
                            e.x = wrapX(e.x + (dx / dist) * spd * dt);
                            e.y = Math.max(180, Math.min(WORLD_H - 180, e.y + (dy / dist) * spd * dt));
                            e.facing = dx >= 0 ? 1 : -1;
                            e.moveAngle = Math.atan2(dy, dx);
                            e.walkPhase = (e.walkPhase || 0) + dt * 8.5;
                        } else if (e.attackTimer <= 0) {
                            e.attackTimer = 1.25;
                            e.swingAnim = 1.0;
                            const st = FIGHTING_STYLES[target.fightingStyle] || FIGHTING_STYLES.berserker;
                            if (Math.random() < (st.blockChance || 0.15)) {
                                this.spawnFloatText(target.x, target.y - 28, '🛡️ BLOCK!', '#38bdf8');
                            } else {
                                target.hp -= e.atk;
                            }
                        }
                    }
                }
            }

            triggerCannibalRaid() {
                const count = 4 + Math.min(6, this.wave);
                const spawnX = 1380;
                const spawnY = 2320;
                for (let i = 0; i < count; i++) {
                    this.enemies.push(this.createEnemyRaider(spawnX + (Math.random() - 0.5) * 120, spawnY + (Math.random() - 0.5) * 120, 1));
                }
                this.wave++;
                this.sfx.play('horn');
                this.showBanner('⚠️', `Cannibal Legion Wave #${this.wave - 1} Invading from the East!`);
            }

            updateProjectilesAndFX(dt) {
                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const p = this.projectiles[i];
                    p.progress += dt * p.speed;
                    if (p.progress >= 1) {
                        const target = this.enemies.find(e => e.id === p.targetId) ||
                                       this.strongholds.find(s => s.id === p.targetId);
                        if (target && target.hp > 0) {
                            target.hp -= p.dmg;
                            if (p.kind === 'fire') this.spawnTerrainDecal(target.x, target.y, 'crater', 22);
                            else if (p.kind === 'water') this.spawnTerrainDecal(target.x, target.y, 'frost', 24);
                            else if (p.kind === 'earth') this.spawnRockSpikeCluster(target.x, target.y, 2);
                        }
                        this.projectiles.splice(i, 1);
                    }
                }

                for (let i = this.wildlife.length - 1; i >= 0; i--) {
                    const w = this.wildlife[i];
                    w.walkPhase += dt * 3.6;
                    const vx = Math.cos(this.gameTime * 0.4 + i) * 15;
                    const vy = Math.sin(this.gameTime * 0.35 + i) * 10;
                    w.x = wrapX(w.x + vx * dt);
                    w.y = Math.max(1500, Math.min(3100, w.y + vy * dt));
                    w.facing = vx >= 0 ? 1 : -1;
                    w.moveAngle = Math.atan2(vy, vx);
                    w.terrainZ = this.getTerrainElevation(w.x, w.y);
                }

                for (let i = 0; i < this.riverBoats.length; i++) {
                    const b = this.riverBoats[i];
                    b.x = wrapX(b.x + b.dir * b.speed * dt);
                    b.oarPhase += dt * 5.5;
                }
                for (let i = 0; i < this.eagles.length; i++) {
                    const eg = this.eagles[i];
                    eg.ang += dt * 0.3;
                    eg.x = wrapX(eg.x + Math.cos(eg.ang) * eg.spd * dt);
                    eg.y += Math.sin(eg.ang) * eg.spd * 0.5 * dt;
                    eg.wing += dt * 7;
                }
                for (let i = 0; i < this.clouds.length; i++) {
                    const cl = this.clouds[i];
                    cl.x = wrapX(cl.x + cl.spd * dt);
                }

                const stepTimers = (arr, rate = 1) => {
                    for (let i = arr.length - 1; i >= 0; i--) {
                        arr[i].life -= dt * rate;
                        if (arr[i].life <= 0) arr.splice(i, 1);
                    }
                };
                stepTimers(this.particles, 1);
                stepTimers(this.floatTexts, 1);
                stepTimers(this.targetRings, 1.4);
                stepTimers(this.slashRibbons, 1);
                stepTimers(this.fissures, 1);
                stepTimers(this.terrainDecals, 1);
                stepTimers(this.rockSpikes, 1);
                stepTimers(this.lightningArcs, 1);
                stepTimers(this.healingBeams, 1);
                stepTimers(this.singularities, 1);
                stepTimers(this.sonicRings, 1.6);

                for (let i = this.fallingTrees.length - 1; i >= 0; i--) {
                    const ft = this.fallingTrees[i];
                    ft.angle += dt * 2.2;
                    if (ft.angle >= Math.PI * 0.5) this.fallingTrees.splice(i, 1);
                }
            }

            // =====================================================================
            // 2.5D RENDER PIPELINE & 3D ROTATING GLOBE
            // =====================================================================
            isVisibleInFrustum(wx, wy, pad = 120) {
                const dx = Math.abs(wrapDX(this.cam.x, wx));
                const dy = Math.abs(wy - this.cam.y);
                const halfW = (this.canvas.width * 0.5) / this.cam.zoom + pad;
                const halfH = (this.canvas.height * 0.5) / (this.cam.zoom * this.camTiltY) + pad;
                return dx <= halfW && dy <= halfH;
            }

            render() {
                const ctx = this.ctx;
                const W = this.canvas.width;
                const H = this.canvas.height;

                this.cam.x = wrapX(this.cam.x + wrapDX(this.cam.x, this.cam.targetX) * 0.16);
                this.cam.y = Math.max(250, Math.min(WORLD_H - 250, this.cam.y + (this.cam.targetY - this.cam.y) * 0.16));
                this.cam.zoom += (this.cam.targetZoom - this.cam.zoom) * 0.16;
                this.camTiltY += (this.targetCamTiltY - this.camTiltY) * 0.14;

                if (this.globeMode) {
                    this.render3DSphericalGlobe(ctx, W, H);
                    this.renderMinimap();
                    return;
                }

                const light = this.getLightingState();
                ctx.clearRect(0, 0, W, H);

                let shakeX = 0, shakeY = 0;
                if (this.screenShake.timer > 0) {
                    const damp = this.screenShake.timer / this.screenShake.maxTimer;
                    shakeX = (Math.random() - 0.5) * 2 * this.screenShake.intensity * damp;
                    shakeY = (Math.random() - 0.5) * 2 * this.screenShake.intensity * damp;
                }

                ctx.save();
                ctx.translate(W * 0.5 + shakeX, H * 0.5 + shakeY);
                ctx.scale(this.cam.zoom, this.cam.zoom * this.camTiltY);

                // 1. Continental Biomes, 2.5D Cliffs, Stone Ramps, Waterfalls, River & Suspension Bridges
                this.renderVisibleContinents(ctx);

                // 2. Persistent Terrain Decals & Fissures
                this.renderTerrainDecalsAndFissures(ctx);

                // 3. Settlers Cobblestone Roads
                this.renderRoadNetwork(ctx);

                // 4. True 2.5D Y-Buffer Depth-Sorted Render Queue
                const renderQueue = [];
                if (this.isVisibleInFrustum(840, 2340, 120)) {
                    renderQueue.push({ sortY: 2340, kind: 'campfire', rx: wrapDX(this.cam.x, 840), ry: 2340 - this.cam.y });
                }
                for (let i = 0; i < this.porters.length; i++) {
                    const p = this.porters[i];
                    const px = p.x1 + (p.x2 - p.x1) * p.t;
                    const py = p.y1 + (p.y2 - p.y1) * p.t;
                    if (!this.isVisibleInFrustum(px, py, 70)) continue;
                    renderQueue.push({ sortY: py, kind: 'porter', ref: p, rx: wrapDX(this.cam.x, px), ry: py - this.cam.y });
                }
                for (let i = 0; i < this.nodes.length; i++) {
                    const n = this.nodes[i];
                    if (!this.isVisibleInFrustum(n.x, n.y, 80)) continue;
                    renderQueue.push({ sortY: n.y, kind: 'node', ref: n, rx: wrapDX(this.cam.x, n.x), ry: n.y - this.cam.y });
                }
                for (let i = 0; i < this.fallingTrees.length; i++) {
                    const ft = this.fallingTrees[i];
                    if (!this.isVisibleInFrustum(ft.x, ft.y, 90)) continue;
                    renderQueue.push({ sortY: ft.y, kind: 'fallingTree', ref: ft, rx: wrapDX(this.cam.x, ft.x), ry: ft.y - this.cam.y });
                }
                for (let i = 0; i < this.buildings.length; i++) {
                    const b = this.buildings[i];
                    if (!this.isVisibleInFrustum(b.x, b.y, 120)) continue;
                    renderQueue.push({ sortY: b.y + b.radius * 0.35, kind: 'building', ref: b, rx: wrapDX(this.cam.x, b.x), ry: b.y - this.cam.y });
                }
                for (let i = 0; i < this.strongholds.length; i++) {
                    const s = this.strongholds[i];
                    if (!this.isVisibleInFrustum(s.x, s.y, 140)) continue;
